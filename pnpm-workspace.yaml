packages:
  - packages/*
  - examples/*
  - apps/*
  - "!apps/blog"

overrides:
  react: 19.2.0
  react-dom: 19.2.0
  "@types/react": 19.2.0
  "@types/react-dom": 19.2.0
  slate: 0.126.2
  slate-dom: 0.126.0
  slate-react: 0.126.4
  slate-history: 0.113.1

# macOS 同时出 arm64 与 x64 两个安装包，两种架构的原生依赖都要装进来；
# 打包时按目标架构裁掉另一种（apps/desktop/scripts/prune-packaged-native-modules.cjs）
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

patchedDependencies:
  better-sqlite3@12.10.0: patches/better-sqlite3@12.10.0.patch
  slate-react@0.126.4: patches/slate-react@0.126.4.patch

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - better-sqlite3
  - dugite
  - electron
  - electron-winstaller
  - esbuild
  - lzma-native
  - node-llama-cpp
  - sharp
  - spawn-sync
  - tesseract.js

allowBuilds:
  "@ffprobe-installer/darwin-arm64": true
  "@ffprobe-installer/darwin-x64": true
  "@ffprobe-installer/linux-arm": true
  "@ffprobe-installer/linux-arm64": true
  "@ffprobe-installer/linux-ia32": true
  "@ffprobe-installer/linux-x64": true
  "@google/genai": false
  "@swc/core": true
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  node-llama-cpp: true
  protobufjs: false
  sharp: true
  spawn-sync: true
  tesseract.js: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261016.1"
  - miniflare@5.20261012.1-beta
  - wrangler@4.151.1
