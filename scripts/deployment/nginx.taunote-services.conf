# ECS 旧协作与统计入口只返回退役响应，正式服务由 Cloudflare 承载。
server {
  listen 80;
  listen [::]:80;
  server_name collab.taunote.app stats.taunote.app;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 410 "Legacy endpoint retired.\n";
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name collab.taunote.app stats.taunote.app;
  ssl_certificate /etc/letsencrypt/live/taunote-services/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taunote-services/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  location / {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 410 "Legacy endpoint retired.\n";
  }
}
