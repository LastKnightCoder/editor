# 新域名别名与旧站点并存，复用既有协作和统计上游。
map $http_upgrade $taunote_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name collab.taunote.app stats.taunote.app;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name collab.taunote.app;
  ssl_certificate /etc/letsencrypt/live/taunote-services/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taunote-services/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  client_max_body_size 30m;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_buffering off;
  location / {
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $taunote_connection_upgrade;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name stats.taunote.app;
  ssl_certificate /etc/letsencrypt/live/taunote-services/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taunote-services/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  client_max_body_size 10m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
