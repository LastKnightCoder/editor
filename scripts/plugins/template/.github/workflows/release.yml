name: 发布插件

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # 向 GitHub 申请短期身份令牌，插件中心据此确认发布来自已绑定的仓库
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v5

      - name: 校验版本与标签
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const version = process.env.RELEASE_TAG.replace(/^v/, "");
          if (version !== manifest.version || version !== pkg.version)
            throw new Error("tag、manifest.json和package.json的版本必须一致（tag可带v前缀）");
          appendFileSync(process.env.GITHUB_OUTPUT,
            `archive=dist/${manifest.id}-${manifest.version}.zip\nprerelease=${version.includes("-")}\nversion=${version}\n`);
          NODE

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行项目测试
        run: pnpm run --if-present test
      - name: 构建插件
        run: pnpm build

      - name: 发布 ZIP 到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          test -f "$ARCHIVE"
          # 发布说明取 CHANGELOG.md 中「## 版本号」小节，与插件中心的更新日志一致
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md 2>/dev/null | sed '/./,$!d' > release-notes.md || true
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
            if [ -s release-notes.md ]; then gh release edit "$RELEASE_TAG" --notes-file release-notes.md; fi
          else
            args=(--verify-tag --title "$RELEASE_TAG")
            if [ -s release-notes.md ]; then
              args+=(--notes-file release-notes.md)
            else
              args+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$ARCHIVE" "${args[@]}"
          fi

      - name: 提交到 Tau 插件中心
        if: steps.package.outputs.prerelease == 'false'
        env:
          PORTAL_API: https://plugins-api.taunote.app
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PORTAL_API" | jq -r .value)
          echo "::add-mask::$token"
          status=$(curl -sS -o portal-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/zip" \
            --data-binary "@$ARCHIVE" "$PORTAL_API/v1/ci/releases")
          cat portal-response.json; echo
          if [ "$status" = "404" ]; then
            echo "::warning::插件尚未在插件中心首次提交，请先在 https://plugins.taunote.app 网页提交一次以绑定仓库"
            exit 0
          fi
          test "$status" -lt 300
