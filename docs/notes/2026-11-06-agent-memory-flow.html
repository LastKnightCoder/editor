<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从用户表达到下一轮召回</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,.12);
      --rule-solid: #bfc0c0;
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,.08);
      --sans: Geist, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Instrument Serif", "Noto Serif SC", "Songti SC", serif;
      --mono: "Geist Mono", monospace;
    }
    body { margin: 0; padding: 36px clamp(16px, 5vw, 64px); background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); }
    main { max-width: 960px; min-width: 0; margin: 0 auto; }
    header { margin-bottom: 24px; }
    .eyebrow { font: 500 12px/1.4 var(--sans); letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
    h1 { margin: 0 0 8px; font: 400 28px/1.3 var(--serif); }
    header p:last-child { margin: 0; color: var(--muted); }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    svg text { font-family: var(--sans); fill: var(--ink); }
    .zone-box { fill: rgba(45,49,66,.02); stroke: var(--rule); }
    .node-box { fill: none; stroke: var(--rule-solid); stroke-width: 1; }
    .input .node-box, .terminal .node-box { stroke: var(--ink); }
    .store .node-box { fill: var(--paper-2); stroke: var(--muted); }
    .focal .node-box, .decision { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.3; }
    .node-title { font-size: 15px; font-weight: 600; }
    .tag { font-size: 12px; font-weight: 500; fill: var(--muted); }
    .detail, .label { font-size: 12px; fill: var(--muted); }
    .label { font-weight: 500; }
    .connector { fill: none; stroke: var(--muted); stroke-width: 1.4; }
    .primary { stroke: var(--accent); }
    .optional { stroke-dasharray: 5 4; stroke-width: 1.2; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">流程图 · 个人助手记忆系统</p>
      <h1>从用户表达到下一轮召回</h1>
      <p>用户明确要求的操作先接入；后续可增加轮后候选。</p>
    </header>
    <div class="diagram-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="2026-11-06-agent-memory-flow-title 2026-11-06-agent-memory-flow-desc">
        <title id="2026-11-06-agent-memory-flow-title">从用户表达到下一轮召回</title>
        <desc id="2026-11-06-agent-memory-flow-desc">明确的记忆请求与后续的轮后候选进入同一校验；允许写入后才能影响后续对话。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#eb6c36"/></marker>
        </defs>
        <rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
        <path class="connector standard" d="M 480 84 V 112" marker-end="url(#arrow)"/>
        <path class="connector standard" d="M 480 176 V 204" marker-end="url(#arrow)"/>
        <path class="connector standard" d="M 608 256 H 696" marker-end="url(#arrow)"/>
        <path class="connector primary" d="M 480 308 V 348" marker-end="url(#arrow-accent)"/>
        <path class="connector standard" d="M 480 424 V 460" marker-end="url(#arrow)"/>
        <g class="arrow-label"><rect x="628" y="228" width="48" height="20" rx="2" fill="#f5f5f5"/><text x="652" y="242" class="label" text-anchor="middle">不满足</text></g>
        <g class="arrow-label"><rect x="488" y="317" width="48" height="20" rx="2" fill="#f5f5f5"/><text x="512" y="331" class="label" text-anchor="middle">满足</text></g>
        <g class="node terminal" data-node="用户提出记忆请求或产生候选">
          <rect x="344" y="32" width="272" height="52" rx="20" fill="#f5f5f5"/>
          <rect x="344" y="32" width="272" height="52" rx="20" class="node-box"/>

          <text x="360" y="57" class="node-title" text-anchor="start">用户提出记忆请求或产生候选</text>
          <text x="360" y="78" class="detail" text-anchor="start">记住、更正、忘记或轮后提炼</text>
        </g>
        <g class="node step" data-node="定位来源并分类">
          <rect x="344" y="112" width="272" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="344" y="112" width="272" height="64" rx="6" class="node-box"/>

          <text x="360" y="137" class="node-title" text-anchor="start">定位来源并分类</text>
          <text x="360" y="158" class="detail" text-anchor="start">画像、近期状态或计划</text>
        </g>
        <g class="node" data-node="写入条件">
          <polygon points="480,204 608,256 480,308 352,256" fill="#f5f5f5"/>
          <polygon class="decision" points="480,204 608,256 480,308 352,256"/>
          <text x="480" y="253" class="node-title" text-anchor="middle">满足写入条件？</text>
          <text x="480" y="274" class="detail" text-anchor="middle">可信、范围正确、规则允许</text>
        </g>
        <g class="node step" data-node="跳过或待确认">
          <rect x="696" y="228" width="220" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="696" y="228" width="220" height="56" rx="6" class="node-box"/>

          <text x="712" y="253" class="node-title" text-anchor="start">跳过或待确认</text>
          <text x="712" y="274" class="detail" text-anchor="start">此轮不改动记忆</text>
        </g>
        <g class="node step" data-node="提交变更">
          <rect x="344" y="348" width="272" height="76" rx="6" fill="#f5f5f5"/>
          <rect x="344" y="348" width="272" height="76" rx="6" class="node-box"/>

          <text x="360" y="373" class="node-title" text-anchor="start">提交变更</text>
          <text x="360" y="394" class="detail" text-anchor="start">新增、替代旧值，或清除已忘条目</text>
        </g>
        <g class="node terminal" data-node="后续对话可用">
          <rect x="344" y="460" width="272" height="56" rx="20" fill="#f5f5f5"/>
          <rect x="344" y="460" width="272" height="56" rx="20" class="node-box"/>

          <text x="360" y="485" class="node-title" text-anchor="start">后续对话可用</text>
          <text x="360" y="506" class="detail" text-anchor="start">只注入有效且相关的条目</text>
        </g>
        <line x1="24" y1="540" x2="936" y2="540" stroke="#bfc0c0"/>
        <text x="32" y="568" class="detail" text-anchor="start">更正旧事实时保留时间线；用户明确要求忘记时，同时阻止旧来源重新生成该条记忆。</text>
      </svg>
    </div>
  </main>
</body>
</html>
