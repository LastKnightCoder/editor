<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面与移动正文 Yjs 同步流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f5f5f5; color: #2d3142; font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .frame { width: 100%; max-width: 1280px; min-width: 0; margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; font: 10px 'Geist Mono', monospace; color: #4f5d75; letter-spacing: .12em; }
    h1 { margin: 0 0 16px; font: 400 28px 'Instrument Serif', 'Songti SC', serif; }
    .lead { margin: 0 0 24px; font-size: 14px; line-height: 1.7; color: #4f5d75; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    .name { font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
    .sub { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
    .label { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; text-anchor: middle; }
    .note { font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; fill: #4f5d75; }
    @media print { body { padding: 0; } .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">FLOWCHART · DOC WIDE · DEFAULT PROFILE</p>
    <h1>桌面与移动正文 Yjs 同步流程</h1>
    <p class="lead">两端从相同 Yjs 基线恢复，执行同一 NodeTree 合并与校验。正常并发自动融合，安装正文及 Yjs 状态后确认同步水位。</p>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="content-sync-title content-sync-desc">
        <title id="content-sync-title">桌面与移动正文 Yjs 同步的共同流程</title>
        <desc id="content-sync-desc">排空输入及冷写意图，加载共同 Yjs 基线和双方更新，在隔离状态预合并后按偏好决定是否询问。取消保持原状；确认后校验 Yjs 合并或条件替换的候选，准备二进制状态与整库传输，发布批次并再收集，最后安装正文和 Yjs 状态。失败与初始化边界见方案正文。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>

        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M320 96 V144"/>
          <path d="M320 208 V240"/>
          <path d="M432 288 H624"/>
          <path d="M320 336 V384"/>
          <path d="M768 320 V408 Q768 416 760 416 H464"/>
          <path d="M912 288 H1080 Q1088 288 1088 296 V384"/>
          <path d="M320 448 V528"/>
          <path d="M464 560 H584"/>
          <path d="M872 560 H992"/>
        </g>

        <g>
          <rect x="504" y="268" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="528" y="277" class="label">CHOOSE</text>
          <rect x="328" y="352" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="352" y="361" class="label">AUTO</text>
          <rect x="568" y="396" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="592" y="405" class="label">APPLY</text>
          <rect x="976" y="268" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="1000" y="277" class="label">CANCEL</text>
        </g>

        <g>
          <rect x="176" y="32" width="288" height="64" rx="20" fill="#ffffff" stroke="#2d3142"/>
          <text x="320" y="60" class="name">排空输入、草稿及冷写意图</text>
          <text x="320" y="80" class="sub">flush · replay intents · freeze</text>

          <rect x="176" y="144" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="320" y="172" class="name">加载共同基线并预合并</text>
          <text x="320" y="192" class="sub">same seed · Y.applyUpdate</text>

          <polygon points="320,240 432,288 320,336 208,288" fill="#ffffff" stroke="#2d3142"/>
          <text x="320" y="284" class="name">需要用户选择？</text>
          <text x="320" y="304" class="sub">policy · concurrent branches</text>

          <rect x="624" y="256" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="768" y="284" class="name">预览合并，或选择一侧覆盖</text>
          <text x="768" y="304" class="sub">choice token · revalidate</text>

          <rect x="944" y="384" width="288" height="64" rx="20" fill="#ffffff" stroke="#4f5d75"/>
          <text x="1088" y="412" class="name">保持原状，等待下次同步</text>
          <text x="1088" y="432" class="sub">no install · no new publication</text>

          <rect x="176" y="384" width="288" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="176" y="384" width="288" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
          <text x="320" y="412" class="name">校验融合或条件替换候选</text>
          <text x="320" y="432" class="sub">NodeTree · validateNodeDocument</text>

          <rect x="176" y="528" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="320" y="556" class="name">准备 Yjs 状态及整库传输</text>
          <text x="320" y="576" class="sub">encodeStateAsUpdate · stage</text>

          <rect x="584" y="528" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="728" y="556" class="name">发布状态批次并再次合入</text>
          <text x="728" y="576" class="sub">createFileIfAbsent · collect again</text>

          <rect x="992" y="528" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142"/>
          <text x="1112" y="556" class="name">安装正文与 Yjs 状态</text>
          <text x="1112" y="576" class="sub">same transaction · acknowledge</text>
        </g>

        <text x="624" y="64" class="note">正文之外沿用整库上传、下载方向。</text>
        <text x="624" y="88" class="note">同一篇的双方编辑使用协同模型融合。</text>
        <text x="624" y="112" class="note">重开或下载保留结构身份，不从 JSON 重新初始化。</text>
        <line x1="48" y1="648" x2="1232" y2="648" stroke="#bfc0c0"/>
        <text x="48" y="680" class="note">矩形：处理阶段　　菱形：条件判断　　圆角端点：开始或结束</text>
        <text x="704" y="680" class="note">传输失败与发布后待安装的恢复规则见方案正文。</text>
      </svg>
    </div>
  </main>
</body>
</html>
