<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Tau 伴读 · 侧栏原型</title>
<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="browser.css" />
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<div class="demo-bar" id="demo">
  <span class="label">主题</span>
  <button data-theme="light" class="on">浅</button>
  <button data-theme="dark">深</button>
  <span class="sep"></span>
  <span class="label">连接</span>
  <button data-conn="on" class="on">已连接</button>
  <button data-conn="off">未连接</button>
  <span class="sep"></span>
  <span class="label">侧栏关闭时悬浮球</span>
  <button data-orb="on" class="on">显示</button>
  <button data-orb="off">不显示</button>
</div>
<div class="hint">点工具栏 τ 开关侧栏 · ⌥J 同效 · 选中正文试试摘录 / 高亮 · 切换上方标签页看侧栏跟随</div>

<div class="chrome tau" data-mode="light" id="app">
  <div class="c-tabs" id="tabs"></div>
  <div class="c-bar">
    <button class="c-btn" title="后退"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button class="c-btn" title="前进"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button class="c-btn" title="刷新"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <div class="c-url" id="url"></div>
    <button class="c-btn c-ext" id="extBtn" title="Tau 伴读">τ</button>
    <button class="c-btn" title="浏览器菜单"><svg class="i" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"/></svg></button>
  </div>
  <div class="c-body">
    <div class="c-page" id="page"></div>
    <div class="c-split" id="split" title="拖动调整侧栏宽度"></div>
    <aside class="c-side" id="side">
      <div class="c-side-head" title="这一行是浏览器自己画的侧栏标题，扩展改不了">
        <span class="nm"><b>τ</b>Tau 伴读</span>
        <button class="c-btn" id="sideClose" title="关闭侧栏"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="panelRoot"></div>
    </aside>
  </div>
</div>

<script src="data.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const S = {
  tabs: ["p1", "p2", "p3"], active: "p1",
  open: true, width: 380,
  view: "page", tab: "anns",           // view: page | lib；tab: anns | note | chat
  lib: "pages", libDetail: null, libQuery: "",
  filter: null, cur: null, editing: null,
  notePin: null,                       // 钉住的笔记所属页面：切换标签页时继续写它
  conn: true, orb: true, chat: {},
};
const page = id => PAGES[id];
const cur = () => page(S.active);
const noteOwner = () => S.notePin || S.active;
const toast = msg => {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("#page").appendChild(t);
  setTimeout(() => t.remove(), 1800);
};
</script>
<script src="sidepanel.js"></script>
</body>
</html>
