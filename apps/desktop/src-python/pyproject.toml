[project]
name = "tau-transcriber"
version = "0.1.0"
description = "Audio transcription module for Tau - based on Faster-Whisper"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "LastKnightCoder" }
]

dependencies = [
    "faster-whisper>=1.0.0",
    "modelscope>=1.10.0",
    "huggingface-hub>=0.20.0",
    "pydub>=0.25.0",
    "langdetect>=1.0.9",
    "websockets>=12.0",
    "markitdown[all]>=0.1.0",
    "FlagEmbedding>=1.3.3",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.51.0,<5.0.0",
    "chromadb>=0.5.0",
    "mempalace>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
multimodal = [
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pyinstaller]
# PyInstaller 配置
name = "python-server"
onefile = true
console = true
