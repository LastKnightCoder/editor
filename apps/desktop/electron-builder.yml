appId: "com.tau.app"
productName: "Tau"
copyright: "Copyright © 2025 ${author}"
asar: true
asarUnpack:
  - "node_modules/@node-rs/jieba/**/*"
  - "node_modules/@node-rs/jieba-*/**/*"
  - "node_modules/@firecrawl/anydoc/**/*"
  - "node_modules/@firecrawl/anydoc-*/**/*"
  - "node_modules/@img/sharp-*/**/*"
  - "node_modules/@img/sharp-libvips-*/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/sqlite-vec-*/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"
  - "node_modules/@tailwindcss/oxide/**/*"
  - "node_modules/@tailwindcss/oxide-*/**/*"
  - "node_modules/@vscode/ripgrep/**/*"
  - "node_modules/@vscode/ripgrep-*/**/*"
  - "node_modules/node-llama-cpp/**/*"
  - "node_modules/@node-llama-cpp/**/*"
  - "node_modules/@vscode/ripgrep/**/*"
  - "node_modules/7zip-bin/**/*"
  - "node_modules/font-list/**/*"
afterPack: "scripts/prune-packaged-native-modules.cjs"
directories:
  output: release/
  buildResources: build

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "build/**/*"
  - "!build/bundled-plugins/**/*"
  - "!build/publish-template.zip"
  - "!build/bin/darwin/Tau Speech Helper.app/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/*.js.map"
  - "!node_modules/**/*.mjs.map"
  - "!node_modules/**/*.cjs.map"
  - "!node_modules/@earendil-works/pi-coding-agent/dist/bundle/**/*"
  - "!node_modules/esbuild/**/*"
  - "!node_modules/@esbuild/**/*"

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  uninstallDisplayName: "Tau"
  shortcutName: "Tau"
  include: "build/installer.nsh"

win:
  target: ["nsis"]
  icon: "build/icon.ico"
  artifactName: "${productName}-v${version}-${platform}.${ext}"
  fileAssociations:
    - ext: md
      name: Markdown
      description: Markdown文件
      icon: build/icon.ico
      role: Editor
      isPackage: false
    - ext: markdown
      name: Markdown
      description: Markdown文件
      icon: build/icon.ico
      role: Editor
      isPackage: false

mac:
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.plist"
  icon: "build/icon.icns"
  # Apple 芯片与 Intel 各出一套；文件名带 arch，electron-updater 按本机架构从 latest-mac.yml 挑包
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: "${productName}-v${version}-${platform}-${arch}.${ext}"
  # macOS 随包分发的 whisper.cpp 转录程序（CI 构建，Metal 加速，~12MB）
  extraResources:
    - from: build/bin/darwin/Tau Speech Helper.app
      to: bin/darwin/Tau Speech Helper.app
    - from: build/bin/darwin/whisper-cli
      to: bin/whisper-cli
  fileAssociations:
    - ext: md
      name: Markdown
      role: Editor
      isPackage: false
    - ext: markdown
      name: Markdown
      role: Editor
      isPackage: false
  # 文件夹：访达「打开方式」与拖到 Dock 图标（Alternate = 仅作备选，不抢访达的默认打开）
  extendInfo:
    NSMicrophoneUsageDescription: "录制语音并转换为文字，停止后填入输入框。"
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder

linux:
  icon: "build/icon.png"
  artifactName: "${productName}-v${version}-${platform}.${ext}"

publish:
  # electron-updater 从该地址拉取 latest*.yml 与更新包。
  - provider: "generic"
    url: "https://dl.taunote.app/desktop"
