appId: "com.tau.app"
productName: "Tau"
copyright: "Copyright © 2025 ${author}"
asar: true
asarUnpack:
  - "node_modules/@node-rs/jieba/**/*"
  - "node_modules/@node-rs/jieba-*/**/*"
  - "node_modules/@img/sharp-*/**/*"
  - "node_modules/@img/sharp-libvips-*/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/sqlite-vec-*/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"
  - "node_modules/node-pty/**/*"
  - "node_modules/@tailwindcss/oxide/**/*"
  - "node_modules/@tailwindcss/oxide-*/**/*"
  - "node_modules/@myriaddreamin/typst-ts-node-compiler/**/*"
  - "node_modules/@myriaddreamin/typst-ts-node-compiler-*/**/*"
  - "node_modules/7zip-bin/**/*"
  - "node_modules/font-list/**/*"
afterPack: "scripts/prune-packaged-native-modules.cjs"
directories:
  output: release/
  buildResources: build

extraResources:
  - from: dist-electron/main/dict.txt
    to: dict.txt
    filter: ["**/*"]
  - from: dist-electron/main/idf.txt
    to: idf.txt
    filter: ["**/*"]
  - from: ../cli/dist/index.js
    to: cli/index.js
  - from: ../cli/bin/tau.sh
    to: cli/tau.sh
  - from: ../cli/bin/tau.cmd
    to: cli/tau.cmd
  - from: ../cli/bin/tau.ps1
    to: cli/tau.ps1


files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "build/**/*"
  - "!build/publish-template.zip"
  - "node_modules/**/*"

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  uninstallDisplayName: "Tau"
  shortcutName: "Tau"
  include: "build/installer.nsh"


win:
  target: ["nsis"]
  icon: "build/icon.ico"
  artifactName: "${productName}-v${version}-${platform}.${ext}"
  fileAssociations:
    - ext: md
      name: Markdown
      description: Markdown文件
      icon: build/icon.ico
      role: Editor
      isPackage: false
    - ext: markdown
      name: Markdown
      description: Markdown文件
      icon: build/icon.ico
      role: Editor
      isPackage: false

mac:
  icon: "build/icon.icns"
  artifactName: "${productName}-v${version}-${platform}.${ext}"
  fileAssociations:
    - ext: md
      name: Markdown
      role: Editor
      isPackage: false

linux:
  icon: "build/icon.png"
  artifactName: "${productName}-v${version}-${platform}.${ext}"

publish:
  provider: "github"
  repo: "editor"
  owner: "LastKnightCoder"
  releaseType: "release"
