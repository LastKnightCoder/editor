appId: "com.tau.app"
productName: "Tau"
copyright: "Copyright © 2025 ${author}"
asar: true
asarUnpack:
  - "node_modules/sqlite-vec-*/**/*"
directories:
  output: release/
  buildResources: build

extraResources:
  - from: dist-electron/main/dict.txt
    to: dict.txt
    filter: ["**/*"]
  - from: dist-electron/main/idf.txt
    to: idf.txt
    filter: ["**/*"]


files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "build/**/*"
  - "!build/publish-template.zip"
  - "node_modules/**/*"

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  uninstallDisplayName: "Tau"
  shortcutName: "Tau"
  include: "build/installer.nsh"


win:
  target: ["nsis"]
  icon: "build/icon.ico"
  artifactName: "${productName}-v${version}-${platform}.${ext}"
  fileAssociations:
    - ext: md
      name: Markdown
      description: Markdown文件
      icon: build/icon.ico
      role: Editor
      isPackage: false
    - ext: markdown
      name: Markdown
      description: Markdown文件
      icon: build/icon.ico
      role: Editor
      isPackage: false

mac:
  icon: "build/icon.icns"
  artifactName: "${productName}-v${version}-${platform}.${ext}"
  fileAssociations:
    - ext: md
      name: Markdown
      role: Editor
      isPackage: false

linux:
  icon: "build/icon.png"
  artifactName: "${productName}-v${version}-${platform}.${ext}"

publish:
  provider: "github"
  repo: "editor"
  owner: "LastKnightCoder"
  releaseType: "release"
