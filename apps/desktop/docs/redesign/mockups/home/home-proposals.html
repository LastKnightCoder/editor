<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<title>今日页 · 三方案对比 — Tau 桌面端</title>
<!--
  今日（首页）三个布局方案的对比样板间，单主题（暖纸·晨光）。
  α 清单流：Things 3 式，行动清单打头，一列到底。
  β 双栏工作台：内容优先，左栏继续昨天，右栏今日三件事+本周。
  γ 轻量指标：问候+横排小指标胶囊+内容流，信息密度最高。
-->
<style>
:root, [data-theme="cream"] {
  --bg-page: #f6f1e7; --bg-surface: #fffdf9; --bg-sunken: #efe8da;
  --bg-hover: rgba(67, 57, 44, 0.06); --bg-selected: rgba(217, 119, 87, 0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --line-1: #e9e1d2; --line-2: rgba(233, 225, 210, 0.55); --hairline: transparent;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217, 119, 87, 0.12); --accent-text: #b85f42;
  --ok: #61795f; --ok-soft: #e5ede2; --warn: #a38c4d; --warn-soft: #f6efd6;
  --tag-1: #61795f; --tag-1-soft: #e5ede2; --tag-3: #8a7aa6; --tag-3-soft: #ebe6f3;
  --shadow-card: 0 1px 2px rgba(120, 100, 70, 0.06), 0 8px 20px -12px rgba(120, 100, 70, 0.16);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 1024px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ── 顶部方案切换条（demo 元件，非产品 UI） ── */
.variant-bar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 20px;
  background: var(--bg-sunken); border-bottom: 1px solid var(--line-2); }
.variant-title { font-weight: 600; font-size: 13px; margin-right: 6px; }
.vtab { display: flex; flex-direction: column; gap: 1px; padding: 5px 14px; border-radius: var(--radius-md);
  color: var(--ink-2); font-size: 12.5px; text-align: left; transition: background 160ms var(--ease-out); }
.vtab small { font-size: 10.5px; color: var(--ink-3); }
.vtab:hover { background: var(--bg-hover); }
.vtab.active { background: var(--bg-selected); color: var(--accent-text); font-weight: 500; }
.vtab.active small { color: var(--accent-text); opacity: 0.75; }

/* ── 应用外壳（简化静态） ── */
.app { display: grid; grid-template-rows: 1fr 30px; grid-template-columns: 216px 1fr; height: calc(100vh - 52px);
  grid-template-areas: "sidebar content" "statusbar statusbar"; }
.sidebar { grid-area: sidebar; padding: 10px; display: flex; flex-direction: column; gap: 2px; background: var(--bg-sunken); }
.sidebar-head { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px; margin-bottom: 4px; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: var(--radius-md); color: var(--ink-2); font-size: 13px; text-align: left; }
.nav-item.active { background: var(--bg-surface); color: var(--ink-1); font-weight: 500; box-shadow: var(--shadow-card); }
.nav-item.active .icon { color: var(--accent); }
.content { grid-area: content; overflow-y: auto; }
.statusbar { grid-area: statusbar; display: flex; align-items: center; padding: 0 14px;
  border-top: 1px solid var(--line-2); color: var(--ink-3); font-size: 11.5px; }

/* ── 共享元件 ── */
.view.hidden { display: none; }
.today-head { margin-bottom: 20px; }
.today-date { color: var(--ink-2); font-size: 12.5px; }
.today-title { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-top: 6px; }
.tag { height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; display: inline-flex; align-items: center; }

/* ══ 方案 α：清单流（Things 3 式） ══ */
.alpha-inner { max-width: 640px; margin: 0 auto; padding: 30px 32px 64px; }
.todo-section { margin-bottom: 26px; }
.todo-label { font-size: 12px; color: var(--ink-2); font-weight: 500; padding: 0 6px 8px; }
.todo-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 8px;
  border-bottom: 1px solid var(--line-2); border-radius: var(--radius-sm); transition: background 160ms var(--ease-out); }
.todo-row:hover { background: var(--bg-hover); }
.todo-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-3); flex: none; transition: border-color 160ms var(--ease-out); }
.todo-row:hover .todo-check { border-color: var(--accent); }
.todo-text { display: flex; flex-direction: column; gap: 1px; }
.todo-text b { font-size: 13.5px; font-weight: 500; }
.todo-text small { font-size: 11.5px; color: var(--ink-2); }
.todo-go { margin-left: auto; width: 14px; height: 14px; color: var(--ink-3); }
.recent-row { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 10px 8px;
  border-bottom: 1px solid var(--line-2); transition: background 160ms var(--ease-out); }
.recent-row:hover { background: var(--bg-hover); }
.recent-row .t { font-size: 13.5px; font-weight: 500; }
.recent-row .m { font-size: 11.5px; color: var(--ink-2); }

/* ══ 方案 β：双栏工作台（内容优先） ══ */
.beta-inner { max-width: 1060px; margin: 0 auto; padding: 28px 32px 64px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 36px; }
.beta-main .today-title { font-size: 24px; }
.beta-label { font-size: 12px; color: var(--ink-2); font-weight: 500; padding: 0 2px 10px; margin-top: 26px; }
.beta-doc { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; padding: 14px 12px;
  border-bottom: 1px solid var(--line-2); border-radius: var(--radius-sm); transition: background 160ms var(--ease-out); }
.beta-doc:first-of-type { border-top: 1px solid var(--line-2); }
.beta-doc:hover { background: var(--bg-hover); }
.beta-doc .t { font-size: 14px; font-weight: 500; }
.beta-doc .m { font-size: 11.5px; color: var(--ink-2); }
.beta-doc .excerpt { font-size: 12px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.beta-side { display: flex; flex-direction: column; gap: 14px; padding-top: 54px; }
.thing { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--bg-surface);
  border-radius: var(--radius-md); box-shadow: var(--shadow-card); width: 100%; text-align: left;
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
.thing:hover { transform: translateY(-1px); }
.thing-num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text);
  display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
.thing b { font-size: 13px; font-weight: 500; display: block; }
.thing small { font-size: 11px; color: var(--ink-2); }
.thing .todo-go { margin-left: auto; }
.week { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 14px 16px; }
.week h3 { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.week-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); }
.week-row:last-child { border-bottom: none; }
.week-row b { color: var(--ink-1); }

/* ══ 方案 γ：轻量指标行 ══ */
.gamma-inner { max-width: 860px; margin: 0 auto; padding: 28px 32px 64px; }
.gamma-greet { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.gamma-title { font-size: 19px; font-weight: 600; }
.gamma-date { color: var(--ink-2); font-size: 12px; }
.metric-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.metric { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card);
  font-size: 12.5px; transition: transform 160ms var(--ease-out); }
.metric:hover { transform: translateY(-1px); }
.metric b { font-weight: 600; }
.metric .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.metric.ok .dot { background: var(--ok); }
.metric.warn .dot { background: var(--warn); }
.gamma-label { font-size: 12px; color: var(--ink-2); font-weight: 500; padding: 0 2px 8px; margin-top: 20px; }
.due-card { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 13px 12px;
  border-bottom: 1px solid var(--line-2); border-radius: var(--radius-sm); transition: background 160ms var(--ease-out); }
.due-card:first-of-type { border-top: 1px solid var(--line-2); }
.due-card:hover { background: var(--bg-hover); }
.due-card .ic { width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--accent-soft);
  color: var(--accent-text); display: grid; place-items: center; flex: none; margin-top: 2px; }
.due-card .t { font-size: 13.5px; font-weight: 500; }
.due-card .m { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
.inbox-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px;
  border-bottom: 1px solid var(--line-2); border-radius: var(--radius-sm); transition: background 160ms var(--ease-out); }
.inbox-item:first-of-type { border-top: 1px solid var(--line-2); }
.inbox-item:hover { background: var(--bg-hover); }
.inbox-item .dot2 { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
.inbox-item span { font-size: 12.5px; color: var(--ink-1); }
.inbox-item .m { margin-left: auto; font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>

<!-- 方案切换条（评审用元件） -->
<div class="variant-bar">
  <span class="variant-title">今日页方案</span>
  <button class="vtab active" data-v="alpha"><span>α · 清单流</span><small>行动清单打头，一列到底（Things 3 式）</small></button>
  <button class="vtab" data-v="beta"><span>β · 双栏工作台</span><small>内容优先，左边继续、右边三件事</small></button>
  <button class="vtab" data-v="gamma"><span>γ · 轻量指标</span><small>问候+指标胶囊+内容流，密度最高</small></button>
</div>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar-head"><span class="brand-mark">τ</span><span class="brand-name">Tau</span></div>
    <div class="nav-label">工作台</div>
    <button class="nav-item active"><svg class="icon"><use href="#i-flame"/></svg><span>今日</span></button>
    <button class="nav-item"><svg class="icon"><use href="#i-inbox"/></svg><span>收集箱</span><span style="margin-left:auto;font-size:11px;color:var(--accent-text)">12</span></button>
    <div class="nav-label">知识</div>
    <button class="nav-item"><svg class="icon"><use href="#i-layers"/></svg><span>卡片库</span></button>
    <button class="nav-item"><svg class="icon"><use href="#i-book"/></svg><span>知识库</span></button>
    <div class="nav-label">学习</div>
    <button class="nav-item"><svg class="icon"><use href="#i-repeat"/></svg><span>闪卡复习</span></button>
  </nav>

  <main class="content">
    <!-- 方案 α -->
    <section class="view" id="v-alpha">
      <div class="alpha-inner">
        <header class="today-head">
          <p class="today-date num">9 月 14 日 · 周一</p>
          <h1 class="today-title">下午好</h1>
        </header>
        <div class="todo-section">
          <h2 class="todo-label">今天</h2>
          <button class="todo-row"><span class="todo-check"></span><span class="todo-text"><b>复习 23 张到期卡片</b><small>预计 18 分钟</small></span><svg class="icon todo-go"><use href="#i-chevron-right"/></svg></button>
          <button class="todo-row"><span class="todo-check"></span><span class="todo-text"><b>整理收集箱 · 12 条速记</b><small>冲洗入库，清空今天的收集</small></span><svg class="icon todo-go"><use href="#i-chevron-right"/></svg></button>
          <button class="todo-row"><span class="todo-check"></span><span class="todo-text"><b>专注时段 · 25 分钟</b><small>今日第 5 个番茄</small></span><svg class="icon todo-go"><use href="#i-chevron-right"/></svg></button>
        </div>
        <div class="todo-section">
          <h2 class="todo-label">继续昨天</h2>
          <button class="recent-row"><span class="t">知识的复利来自连接而非收集</span><span class="m num">昨天 · 方法论</span></button>
          <button class="recent-row"><span class="t">卢曼卡片盒：索引是记忆的入口</span><span class="m num">3 天前 · 卡片盒</span></button>
          <button class="recent-row"><span class="t">写作是思考的显影</span><span class="m num">1 周前 · 写作</span></button>
          <button class="recent-row"><span class="t">间隔重复的最优间隔并不存在</span><span class="m num">1 周前 · 认知科学</span></button>
        </div>
      </div>
    </section>

    <!-- 方案 β -->
    <section class="view hidden" id="v-beta">
      <div class="beta-inner">
        <div class="beta-main">
          <p class="today-date num">9 月 14 日 · 周一</p>
          <h1 class="today-title">下午好</h1>
          <h2 class="beta-label">继续昨天</h2>
          <button class="beta-doc">
            <span class="t">知识的复利来自连接而非收集</span>
            <span class="excerpt">收集只是搬运，连接才是生产。一张卡片的价值不在于它记录了什么，而在于它和哪些卡片发生了关系……</span>
            <span class="m num">昨天 · <span class="tag" style="color:var(--tag-1);background:var(--tag-1-soft)">方法论</span></span>
          </button>
          <button class="beta-doc">
            <span class="t">卢曼卡片盒：索引是记忆的入口</span>
            <span class="excerpt">索引不是目录，是入口关键词。入口要少而精，检索靠卡片间的引用网络自然展开……</span>
            <span class="m num">3 天前 · <span class="tag" style="color:var(--tag-1);background:var(--tag-1-soft)">卡片盒</span></span>
          </button>
          <button class="beta-doc">
            <span class="t">写作是思考的显影</span>
            <span class="excerpt">没写下来之前，你以为的"想清楚了"多半是熟悉感。修改才是思考的继续……</span>
            <span class="m num">1 周前 · <span class="tag" style="color:var(--tag-3);background:var(--tag-3-soft)">写作</span></span>
          </button>
        </div>
        <aside class="beta-side">
          <button class="thing"><span class="thing-num num">23</span><span><b>复习到期卡片</b><small>预计 18 分钟</small></span><svg class="icon todo-go"><use href="#i-chevron-right"/></svg></button>
          <button class="thing"><span class="thing-num num">12</span><span><b>整理收集箱</b><small>速记冲洗入库</small></span><svg class="icon todo-go"><use href="#i-chevron-right"/></svg></button>
          <button class="thing"><span class="thing-num num">5</span><span><b>专注时段</b><small>第 5 个番茄 · 25 分钟</small></span><svg class="icon todo-go"><use href="#i-chevron-right"/></svg></button>
          <div class="week">
            <h3>本周</h3>
            <div class="week-row"><span>复习完成</span><b class="num">48 张</b></div>
            <div class="week-row"><span>新建卡片</span><b class="num">31 张</b></div>
            <div class="week-row"><span>建立连接</span><b class="num">12 条</b></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- 方案 γ -->
    <section class="view hidden" id="v-gamma">
      <div class="gamma-inner">
        <div class="gamma-greet">
          <h1 class="gamma-title">下午好</h1>
          <span class="gamma-date num">9 月 14 日 周一 · 已专注 1 小时 40 分</span>
        </div>
        <div class="metric-row">
          <button class="metric warn"><span class="dot"></span>复习 <b class="num">23</b> 张到期</button>
          <button class="metric ok"><span class="dot"></span>收集箱 <b class="num">12</b> 条待整理</button>
          <button class="metric"><span class="dot"></span>本周新增 <b class="num">31</b> · 连接 <b class="num">12</b></button>
        </div>
        <h2 class="gamma-label">今天到期 · 前 3 张</h2>
        <button class="due-card"><span class="ic"><svg class="icon"><use href="#i-repeat"/></svg></span><span><span class="t">间隔重复的最优间隔并不存在</span><span class="m">认知科学 · 距上次复习 6 天</span></span></button>
        <button class="due-card"><span class="ic"><svg class="icon"><use href="#i-repeat"/></svg></span><span><span class="t">阅读时做笔记的四种粒度</span><span class="m">方法论 · 距上次复习 4 天</span></span></button>
        <button class="due-card"><span class="ic"><svg class="icon"><use href="#i-repeat"/></svg></span><span><span class="t">概念卡片与事实卡片的分野</span><span class="m">方法论 · 距上次复习 9 天</span></span></button>
        <h2 class="gamma-label">收集箱 · 最新</h2>
        <button class="inbox-item"><span class="dot2"></span><span>「记忆的错觉」读书摘录 —— 巩固发生在提取时……</span><span class="m num">14:02</span></button>
        <button class="inbox-item"><span class="dot2"></span><span>灵感：给复习加一个"想不起来就立即降档"的规则</span><span class="m num">11:37</span></button>
      </div>
    </section>
  </main>

  <footer class="statusbar"><span>今日页三方案对比 · 单主题（暖纸 · 晨光）</span></footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>

<script>
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
$$('.vtab').forEach(t => t.addEventListener('click', () => {
  $$('.vtab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $$('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('v-' + t.dataset.v).classList.remove('hidden');
}));
</script>
</body>
</html>
