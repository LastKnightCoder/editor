<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>样板间 A2 · 暖纸 · 柔和版 — Tau 桌面端</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  【视觉参考，非导出源】（D-013）：壳层样式已迁移组件 Tailwind，本模板仅作对照
  截图的视觉基准；调视觉直接改组件，模板不再与代码同步维护。
  方向 A2「暖纸 · 柔和版」——同 A 的色彩基因，重写排版：
  · 去横线化：分组靠底色容器与留白，不再满屏 border 分割
  · 宽度利用：内容区放开（max 1680），卡片网格自适应 4-5 列
  · 首页丰满：问候 + 行动块 + 双栏内容 + 收集箱速览
  · 详情双栏：左正文（阅读宽度）+ 右信息栏（属性/连接）
  · 导航：logo/折叠在侧栏头部；标题栏仅后退/前进/面包屑；收起用悬浮按钮
  ═══════════════════════════════════════════════════════════════════
-->
<style>
:root {
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
[data-theme="cream"] {
  color-scheme: light;
  --bg-page: #f3eee2;
  --bg-surface: #fffdf9;
  --bg-sunken: #ece5d4;
  --bg-group: #faf6ec;      /* 分组容器底：比 surface 沉半档，代替横线 */
  --bg-hover: rgba(67, 57, 44, 0.05);
  --bg-selected: rgba(217, 119, 87, 0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217, 119, 87, 0.12); --accent-text: #b85f42;
  --focus-ring: 0 0 0 3px rgba(217, 119, 87, 0.28);
  --ok: #61795f; --ok-soft: #e5ede2; --warn: #a38c4d; --warn-soft: #f6efd6; --info: #5c7d99; --info-soft: #e2ebf3;
  --tag-1: #61795f; --tag-1-soft: #e5ede2; --tag-2: #5c7d99; --tag-2-soft: #e2ebf3; --tag-3: #8a7aa6; --tag-3-soft: #ebe6f3;
  --tag-4: #a38c4d; --tag-4-soft: #f6efd6; --tag-5: #b06a5e; --tag-5-soft: #f6e3e0;
  --overlay: rgba(67, 57, 44, 0.35);
  --shadow-card: 0 1px 2px rgba(120, 100, 70, 0.05), 0 10px 24px -14px rgba(120, 100, 70, 0.18);
  --shadow-float: 0 16px 40px -12px rgba(120, 100, 70, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.65; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 1080px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
::selection { background: var(--accent-soft); }
.icon { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }

.app { position: relative; display: grid; grid-template-columns: auto 4px minmax(0, 1fr); grid-template-rows: 100vh;
  grid-template-areas: "sidebar resizer main"; }
/* 右列整体：标题栏/内容/状态栏只属于主区，侧栏整高贯通窗口（融合骨架） */
.main { grid-area: main; display: grid; grid-template-rows: 46px minmax(0, 1fr) 30px;
  grid-template-areas: "titlebar" "content" "statusbar"; min-width: 0; }
.resizer { grid-area: resizer; cursor: col-resize; border-radius: 2px; background: transparent; }
.resizer:hover, .resizer.active { background: var(--bg-hover); }

/* ── 标题栏：只留导航 + 面包屑，不堆积 ── */
.titlebar { grid-area: titlebar; display: flex; align-items: center; gap: 10px; padding: 0 14px; user-select: none; }
.titlebar-crumb { color: var(--ink-2); font-size: 12.5px; }
.titlebar-spacer { flex: 1; }
.kbd-pill { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card);
  color: var(--ink-2); font-size: 12px; }
.kbd-pill:hover { color: var(--ink-1); }
kbd { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-group); color: var(--ink-2);
  font-size: 11px; font-family: ui-monospace, Consolas, monospace; display: inline-flex; align-items: center; }
.icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); display: grid; place-items: center;
  color: var(--ink-2); transition: background 160ms var(--ease-out), color 160ms var(--ease-out); }
.icon-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
.icon-btn:disabled, .icon-btn:disabled:hover { opacity: 0.35; background: none; cursor: default; }
.win-controls { display: flex; gap: 2px; margin-left: 4px; }
.win-btn { width: 36px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.win-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
.win-btn.close:hover { background: #c25450; color: #fff; }
/* 平台：Mac 红绿灯 */
.traffic-lights { display: none; align-items: center; gap: 8px; padding-right: 4px; }
html[data-platform="mac"] .traffic-lights { display: flex; }
html[data-platform="mac"] .win-controls { display: none; }
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl-close { background: #ff5f57; } .tl-min { background: #febc2e; } .tl-max { background: #28c840; }

/* ── 侧边栏：与页面同底色、整高贯通，白卡浮起作对比，不再是一块深色板 ── */
.sidebar { grid-area: sidebar; width: var(--sidebar-w, 218px); padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto; transition: width 220ms var(--ease-out); }
.sidebar-head { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; margin-bottom: 6px; flex: none; }
.sidebar-head .brand { display: flex; align-items: center; gap: 8px; }
.sidebar-head .icon-btn { width: 27px; height: 27px; margin-left: auto; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13.5px; }
.nav-section { margin-top: 12px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13px; text-align: left;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out); }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { background: var(--bg-surface); color: var(--ink-1); font-weight: 500; box-shadow: var(--shadow-card); }
/* 融合态：激活项改用极淡墨底 + 左缘小竖点，白卡浮起只在列表卡片里出现 */
.nav-item.active { background: var(--bg-hover); box-shadow: none; color: var(--ink-1); position: relative; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item.active .icon { color: var(--accent); }
.nav-item .icon { width: 17px; height: 17px; }
.nav-badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 500; display: grid; place-items: center; }
.nav-spacer { flex: 1; }
/* 收起态：logo 让位给展开按钮（同位反转，图标镜像换向），Mac 红绿灯独占一行不与 logo 互压 */
body.collapsed .sidebar { width: 58px; }
body.collapsed .sidebar .nav-item span, body.collapsed .sidebar .nav-label, body.collapsed .sidebar .nav-badge { display: none; }
body.collapsed .sidebar .nav-item { justify-content: center; padding: 0; }
body.collapsed .sidebar-head { flex-direction: column; justify-content: flex-start; align-items: center; gap: 12px; height: auto; padding: 10px 0 12px; }
body.collapsed .sidebar-head .brand { display: none; }
body.collapsed .sidebar-head .icon-btn { display: grid; margin-left: 0; }
body.collapsed #sidebar-toggle svg { transform: scaleX(-1); }
body.collapsed .traffic-lights { padding-right: 0; }
/* 收起态：logo 让位给展开按钮（同位反转，图标镜像换向），Mac 红绿灯独占一行不与 logo 互压 */

/* ── 内容区：宽容器（不浪费桌面宽度） ── */
.content { grid-area: content; overflow-y: auto; }
.view.hidden { display: none; }
.wide { max-width: 1680px; margin: 0 auto; padding: 26px 34px 56px; }

/* ══ 今日（首页 · 丰满版） ══ */
.home-hero { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.hero-date { color: var(--ink-2); font-size: 12.5px; }
.hero-title { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; }
.hero-summary { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.chiplet { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 14px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); font-size: 12.5px; color: var(--ink-2); }
.chiplet b { color: var(--ink-1); font-weight: 600; }
.chiplet .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chiplet.ok .dot { background: var(--ok); } .chiplet.warn .dot { background: var(--warn); }

/* 行动块：底色容器，无线条 */
.quick-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 14px; }
.quick { display: flex; align-items: center; gap: 13px; padding: 16px 18px; background: var(--bg-surface);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card); text-align: left; width: 100%;
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
.quick:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
.quick-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; }
.quick-ic.review { background: var(--accent-soft); color: var(--accent-text); }
.quick-ic.inbox { background: var(--warn-soft); color: var(--warn); }
.quick-ic.focus { background: var(--ok-soft); color: var(--ok); }
.quick b { font-size: 14px; font-weight: 600; display: block; }
.quick small { font-size: 11.5px; color: var(--ink-2); }
.quick .go { margin-left: auto; width: 15px; height: 15px; color: var(--ink-3); }

/* 首页双栏：左内容流 / 右侧栏 */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); gap: 14px; margin-bottom: 14px; }
.board { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 18px 20px; }
.board-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-1); }
.board-title small { font-weight: 400; color: var(--ink-3); font-size: 11.5px; margin-left: 8px; }
.doc-row { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 11px 10px;
  border-radius: var(--radius-sm); transition: background 160ms var(--ease-out); }
.doc-row:hover { background: var(--bg-hover); }
.doc-row .t { font-size: 13.5px; font-weight: 500; }
.doc-row .excerpt { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-row .m { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.home-side { display: flex; flex-direction: column; gap: 14px; }
.todo-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 10px;
  border-radius: var(--radius-sm); transition: background 160ms var(--ease-out); }
.todo-row:hover { background: var(--bg-hover); }
.todo-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-3); flex: none; transition: border-color 160ms var(--ease-out); }
.todo-row:hover .todo-check { border-color: var(--accent); }
.todo-text b { font-size: 13px; font-weight: 500; display: block; }
.todo-text small { font-size: 11px; color: var(--ink-2); }
.todo-go { margin-left: auto; width: 14px; height: 14px; color: var(--ink-3); }
.week-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: var(--radius-sm); font-size: 12.5px; color: var(--ink-2); }
.week-row b { color: var(--ink-1); font-weight: 600; }
.board-note { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--accent-soft); color: var(--accent-text); font-size: 12px; line-height: 1.6; }
/* 收集箱速览：横排小卡 */
.inbox-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.inbox-card { display: flex; flex-direction: column; gap: 4px; padding: 13px 15px; background: var(--bg-surface);
  border-radius: var(--radius-md); box-shadow: var(--shadow-card); text-align: left; width: 100%;
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
.inbox-card:hover { transform: translateY(-2px); }
.inbox-card p { font-size: 12.5px; color: var(--ink-1); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.inbox-card .m { font-size: 11px; color: var(--ink-3); }

/* ══ 卡片库列表（宽网格） ══ */
.page-header { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 16px; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.page-sub { color: var(--ink-2); font-size: 12.5px; margin-bottom: 2px; }
.page-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 15px;
  border-radius: 10px; font-size: 13px; font-weight: 500; transition: background 160ms var(--ease-out), transform 160ms var(--ease-out); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--ink-inverse); box-shadow: 0 6px 14px -5px rgba(217, 119, 87, 0.5); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-soft { background: var(--bg-surface); color: var(--ink-1); box-shadow: var(--shadow-card); }
.btn-soft:hover { background: var(--bg-hover); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--ink-1); }
.filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.chip-group { display: flex; gap: 4px; padding: 3px; background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); }
.chip { height: 27px; padding: 0 13px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2); transition: background 160ms var(--ease-out), color 160ms var(--ease-out); }
.chip:hover { background: var(--bg-hover); color: var(--ink-1); }
.chip.active { background: var(--bg-selected); color: var(--accent-text); font-weight: 500; }
.segmented { margin-left: auto; display: flex; gap: 2px; padding: 3px; background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); }
.seg-btn { width: 29px; height: 27px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2); }
.seg-btn:hover { color: var(--ink-1); }
.seg-btn.active { color: var(--accent-text); background: var(--bg-selected); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { position: relative; padding: 17px 17px 13px; background: var(--bg-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); cursor: pointer; text-align: left; width: 100%;
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
.card-title { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; text-wrap: balance; }
.card-excerpt { color: var(--ink-2); font-size: 12.5px; line-height: 1.65; margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { height: 21px; padding: 0 9px; border-radius: 999px; font-size: 11px; display: inline-flex; align-items: center; }
.card-meta { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 11.5px; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); opacity: 0.6; }
.status { display: inline-flex; align-items: center; gap: 5px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
.status.review::before { background: var(--warn); }
.status.mastered::before { background: var(--ok); }
.status.fresh::before { background: var(--info); }
.card.pinned { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 4px 28px; padding: 20px 22px 16px; }
.card.pinned .card-excerpt { max-width: 72ch; margin-bottom: 8px; }
.pin-badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 10px;
  border-radius: 999px; background: var(--tag-4-soft); color: var(--tag-4); font-size: 11px; font-weight: 500; }
.ai-badge { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 9px; border-radius: 999px;
  background: var(--tag-3-soft); color: var(--tag-3); font-size: 11px; }
.pin-side { display: flex; align-items: center; gap: 28px; }
.pin-stat { text-align: right; }
.pin-stat b { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
.pin-stat span { font-size: 11px; color: var(--ink-3); }

/* ══ 详情（双栏：正文 + 信息栏） ══ */
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; max-width: 1280px; margin: 0 auto; padding: 30px 34px 72px; }
.detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.detail-title { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; margin-bottom: 10px; text-wrap: balance; }
.detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; margin-bottom: 22px; }
.prose p { margin-bottom: 13px; color: var(--ink-1); line-height: 1.9; font-size: 13.5px; max-width: 72ch; }
.prose p + p { color: var(--ink-2); }
.prose blockquote { margin: 16px 0; padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--accent-soft); color: var(--accent-text); font-size: 13px; max-width: 72ch; }
.detail-sub { font-size: 13px; font-weight: 600; margin: 26px 0 8px; }
.doc-row + .doc-row { margin-top: 2px; }
.detail-actions { display: flex; gap: 8px; margin-top: 28px; }
.info-panel { position: sticky; top: 0; display: flex; flex-direction: column; gap: 14px; }
.info-board { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 18px; }
.info-board h3 { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-bottom: 8px; }
.info-row { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12.5px; color: var(--ink-2); }
.info-row b { color: var(--ink-1); font-weight: 500; }

/* ── 命令面板 ── */
.palette-backdrop { position: fixed; inset: 0; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease-out); z-index: 80; }
body.palette-open .palette-backdrop { opacity: 1; pointer-events: auto; }
.palette { position: fixed; left: 50%; top: 16vh; transform: translate(-50%, 8px) scale(0.98); width: min(580px, 92vw);
  background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
  opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out); z-index: 81; overflow: hidden; }
body.palette-open .palette { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
.palette-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; }
.palette-input { flex: 1; border: none; outline: none; background: none; font-size: 14.5px; }
.palette-input::placeholder { color: var(--ink-2); }
.palette-list { max-height: 380px; overflow-y: auto; padding: 8px; }
.palette-group { font-size: 11px; color: var(--ink-3); padding: 8px 10px 4px; }
.palette-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px;

.palette-empty { padding: 28px; text-align: center; color: var(--ink-3); font-size: 12.5px; }

/* ── 状态栏 / Toast ── */
.statusbar { grid-area: statusbar; display: flex; align-items: center; gap: 16px; padding: 0 14px;

.statusbar .sync { display: flex; align-items: center; gap: 6px; }
.statusbar .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar-right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.platform-btn { font-size: inherit; color: inherit; padding: 2px 8px; border-radius: 5px; opacity: 0.9; }
.platform-btn:hover { background: var(--bg-hover); opacity: 1; }
.toast { position: fixed; left: 50%; bottom: 44px; transform: translate(-50%, 12px); z-index: 90;
  background: var(--ink-1); color: var(--bg-page); padding: 8px 16px; border-radius: 999px;
  font-size: 12.5px; opacity: 0; pointer-events: none; transition: all 200ms var(--ease-out); }
body.toast-show .toast { opacity: 1; transform: translate(-50%, 0); }
</style>

          </button>
          <button class="card" data-title="费曼技巧的三个自检问题" data-tags="学习" data-source="AI 对话" data-time="5 天前" data-status="mastered" data-status-text="已掌握">
            <h3 class="card-title">费曼技巧的三个自检问题</h3>
            <p class="card-excerpt">能否不用术语讲给外行听？能否给出一个反例？能否预言一个新现象？三问过不了，说明理解的还只是名词而不是机制。</p>
            <div class="card-tags"><span class="tag" style="color:var(--tag-5);background:var(--tag-5-soft)">学习</span></div>
            <div class="card-meta"><span>AI 对话</span><span class="dot"></span><span class="num">5 天前</span><span class="dot"></span><span class="status mastered">已掌握</span></div>
          </button>
          <button class="card" data-title="间隔重复的最优间隔并不存在" data-tags="认知科学" data-source="阅读 · 论文笔记" data-time="1 周前" data-status="review" data-status-text="复习中">
            <h3 class="card-title">间隔重复的最优间隔并不存在</h3>
            <p class="card-excerpt">遗忘曲线是统计平均，不是个人处方。比追求"最优间隔"更重要的是让复习时机服从你的实际提取失败——想不起来的时候才是复习的时候。</p>
            <div class="card-tags"><span class="tag" style="color:var(--tag-2);background:var(--tag-2-soft)">认知科学</span></div>
            <div class="card-meta"><span>阅读 · 论文笔记</span><span class="dot"></span><span class="num">1 周前</span><span class="dot"></span><span class="status review">复习中</span></div>
          </button>
          <button class="card" data-title="写作是思考的显影" data-tags="写作" data-source="速记" data-time="1 周前" data-status="fresh" data-status-text="新卡">
            <h3 class="card-title">写作是思考的显影</h3>
            <p class="card-excerpt">没写下来之前，你以为的"想清楚了"多半是熟悉感。写作把思考显影成可检视的对象，修改才是思考的继续。</p>
            <div class="card-tags"><span class="tag" style="color:var(--tag-3);background:var(--tag-3-soft)">写作</span></div>
            <div class="card-meta"><span>速记</span><span class="dot"></span><span class="num">1 周前</span><span class="dot"></span><span class="status fresh">新卡</span></div>
          </button>
          <button class="card" data-title="双链笔记的涌现结构" data-tags="工具,方法论" data-source="阅读" data-time="2 周前" data-status="mastered" data-status-text="已掌握">
            <h3 class="card-title">双链笔记的涌现结构</h3>
            <p class="card-excerpt">链接本身不产生价值，链接密度超过阈值后涌现的结构才有。结构化笔记（MOC）是事后总结，不是事前规划。</p>
            <div class="card-tags"><span class="tag" style="color:var(--tag-2);background:var(--tag-2-soft)">工具</span><span class="tag" style="color:var(--tag-1);background:var(--tag-1-soft)">方法论</span></div>
            <div class="card-meta"><span>阅读</span><span class="dot"></span><span class="num">2 周前</span><span class="dot"></span><span class="status mastered">已掌握</span></div>
          </button>
          <button class="card" data-title="阅读时做笔记的四种粒度" data-tags="方法论" data-source="阅读" data-time="2 周前" data-status="review" data-status-text="复习中">
            <h3 class="card-title">阅读时做笔记的四种粒度</h3>
            <p class="card-excerpt">划线、转述、评注、连接。只有后两种产出可检索的卡片；前两种只是给遗忘做缓冲。</p>
            <div class="card-meta"><span>阅读</span><span class="dot"></span><span class="num">2 周前</span><span class="dot"></span><span class="status review">复习中</span></div>
          </button>
          <button class="card" data-title="AI 协作：给上下文，不给结论" data-tags="方法论,AI" data-source="AI 对话" data-time="3 周前" data-status="mastered" data-status-text="已掌握">
            <h3 class="card-title">AI 协作：给上下文，不给结论</h3>

            <div class="card-tags"><span class="tag" style="color:var(--tag-1);background:var(--tag-1-soft)">方法论</span><span class="ai-badge"><svg class="icon" style="width:11px;height:11px"><use href="#i-sparkles"/></svg>AI 参与</span></div>
            <div class="card-meta"><span>AI 对话</span><span class="dot"></span><span class="num">3 周前</span><span class="dot"></span><span class="status mastered">已掌握</span></div>
          </button>
          <button class="card" data-title="每日回顾的 15 分钟仪式" data-tags="学习" data-source="速记" data-time="3 周前" data-status="fresh" data-status-text="新卡">
            <h3 class="card-title">每日回顾的 15 分钟仪式</h3>
            <p class="card-excerpt">睡前 15 分钟只做两件事：把今天的收集箱清空进卡片盒，给今天最有价值的一张卡片找一个连接对象。</p>
            <div class="card-tags"><span class="tag" style="color:var(--tag-5);background:var(--tag-5-soft)">学习</span></div>
            <div class="card-meta"><span>速记</span><span class="dot"></span><span class="num">3 周前</span><span class="dot"></span><span class="status fresh">新卡</span></div>
          </button>
          <button class="card" data-title="概念卡片与事实卡片的分野" data-tags="方法论" data-source="阅读" data-time="1 个月前" data-status="mastered" data-status-text="已掌握">
            <h3 class="card-title">概念卡片与事实卡片的分野</h3>
            <p class="card-excerpt">事实卡回答"是什么"，越用越旧；概念卡回答"如何运转"，越连越新。卡片盒的长期资产几乎全部是后者。</p>

    <section class="view hidden" id="view-detail"></section>
  </main>

  <footer class="statusbar">
    <span class="sync num">本地优先 · 已同步 14:32</span>
    <span>Tau v1.0 重构预览</span>
    <div class="statusbar-right">
      <button class="platform-btn" id="platform-toggle" title="预览 Mac 红绿灯 / Win 三键标题栏">平台：Win</button>
      <span class="num">A2 · 暖纸柔和版</span>

<div class="palette-backdrop" id="palette-backdrop"></div>
<div class="palette" role="dialog" aria-label="命令面板">
  <div class="palette-input-row"><svg class="icon" style="width:16px;height:16px;color:var(--ink-3)"><use href="#i-search"/></svg>
    <input class="palette-input" id="palette-input" type="text" placeholder="输入页面名、动作或卡片标题…" autocomplete="off"></div>
  <div class="palette-list" id="palette-list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

let toastTimer;
function toast(msg) {
  $('#toast').textContent = msg;
  document.body.classList.add('toast-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.body.classList.remove('toast-show'), 1800);
}

/* ── 卡片详情：正文 + 信息栏（双栏，无横线） ── */
const TAG_COLOR = { '方法论': 1, '卡片盒': 1, '工具': 2, '认知科学': 2, '写作': 3, '学习': 5, 'AI': 3 };
function fillDetail(card) {
  const tags = (card.dataset.tags || '').split(',').filter(Boolean)
    .map(t => `<span class="tag" style="color:var(--tag-${TAG_COLOR[t] || 1});background:var(--tag-${TAG_COLOR[t] || 1}-soft)">${t}</span>`).join(' ');
  $('#view-detail').innerHTML = `
    <div class="detail-layout">
      <article>
        <div class="detail-tags">${tags}</div>
        <h1 class="detail-title">${card.dataset.title}</h1>
        <div class="detail-meta">
          <span>${card.dataset.source}</span><span class="dot"></span>
          <span class="num">${card.dataset.time}</span><span class="dot"></span>
          <span class="status ${card.dataset.status}">${card.dataset.statusText}</span>
        </div>
        <div class="prose">
          <p>${$('.card-excerpt', card) ? $('.card-excerpt', card).textContent : '卡片正文摘录。'}</p>
          <blockquote>这条卡片与「知识的复利来自连接而非收集」建立了引用关系 —— 示例引用</blockquote>
          <p>正文的示例段落。卡片正文支持 Markdown、双链引用与行内 AI 操作；这里作为排版占位，展示正文在阅读宽度（约 72ch）下的层级关系——宽屏下右侧由信息栏补位，不浪费空间。</p>
          <p>元信息：来源 ${card.dataset.source} · ${card.dataset.time} · 状态 ${card.dataset.statusText}。</p>
        </div>
        <h2 class="detail-sub">连接</h2>
        <button class="doc-row" data-nav><span class="t">知识的复利来自连接而非收集</span><span class="excerpt">被这张卡片引用 · 方法论</span></button>
        <button class="doc-row" data-nav><span class="t">双链笔记的涌现结构</span><span class="excerpt">相关卡片 · 工具</span></button>
        <div class="detail-actions">
          <button class="btn btn-primary" data-nav><svg class="icon" style="width:15px;height:15px"><use href="#i-pen"/></svg>编辑</button>
          <button class="btn btn-soft" data-nav><svg class="icon" style="width:15px;height:15px"><use href="#i-repeat"/></svg>复习</button>
          <button class="btn btn-ghost" data-nav><svg class="icon" style="width:15px;height:15px"><use href="#i-sparkles"/></svg>AI 追问</button>
        </div>
      </article>
      <aside class="info-panel">
        <div class="info-board">
          <h3>属性</h3>
          <div class="info-row"><span>创建</span><b class="num">2026-06-30</b></div>
          <div class="info-row"><span>复习次数</span><b class="num">6 次</b></div>
          <div class="info-row"><span>记忆强度</span><b class="num">82%</b></div>
          <div class="info-row"><span>下次复习</span><b class="num">明天</b></div>
        </div>
        <div class="info-board">
          <h3>引用</h3>
          <button class="doc-row" data-nav><span class="t" style="font-size:12.5px">知识的复利来自连接而非收集</span></button>
          <button class="doc-row" data-nav><span class="t" style="font-size:12.5px">阅读时做笔记的四种粒度</span></button>
        </div>
      </aside>
    </div>`;
  $('#view-detail').classList.remove('hidden');
  $$('#view-detail [data-nav]').forEach(b => b.addEventListener('click', () => toast('样板间内跳转略')));
}

/* ── 页面栈（今日 / 列表 / 详情） ── */
const navStack = [{ view: 'today', card: null }];
const navForward = [];
const VIEW_EL = { today: '#view-today', list: '#view-list', detail: '#view-detail' };
const VIEW_CRUMB = { today: '今日', list: '卡片库', detail: '卡片详情' };
function refreshNavBtns() {
  $('#nav-back').disabled = navStack.length <= 1;
  $('#nav-forward').disabled = navForward.length === 0;
}
function render() {
  const top = navStack[navStack.length - 1];
  $$('.view').forEach(v => v.classList.add('hidden'));
  if (top.view === 'detail') fillDetail(top.card);
  else $(VIEW_EL[top.view]).classList.remove('hidden');
  $('#crumb').textContent = '· ' + VIEW_CRUMB[top.view];
  $('#nav-today').classList.toggle('active', top.view === 'today');
  $('#nav-cards').classList.toggle('active', top.view !== 'today');
  refreshNavBtns();
}
function pushView(entry) {
  const top = navStack[navStack.length - 1];
  if (top.view === entry.view && top.card === entry.card) return;
  navStack.push(entry); navForward.length = 0; render();
}
function back() { if (navStack.length > 1) { navForward.push(navStack.pop()); render(); } }
function forward() { if (navForward.length) { navStack.push(navForward.pop()); render(); } }
$$('.card').forEach(c => c.addEventListener('click', () => pushView({ view: 'detail', card: c })));
$('#nav-back').addEventListener('click', back);
$('#nav-forward').addEventListener('click', forward);
$('#nav-today').addEventListener('click', () => pushView({ view: 'today' }));
$('#nav-cards').addEventListener('click', () => pushView({ view: 'list' }));

/* ── 命令面板 ── */
const PALETTE_ITEMS = [
  { group: '页面', icon: 'i-flame', label: '今日', nav: true },
  { group: '页面', icon: 'i-layers', label: '卡片库', kbd: 'Ctrl 1', nav: true },
  { group: '页面', icon: 'i-article', label: '文章', kbd: 'Ctrl 2', nav: true },
  { group: '页面', icon: 'i-repeat', label: '闪卡复习', nav: true },
  { group: '动作', icon: 'i-plus', label: '新建卡片', kbd: 'Ctrl N' },
  { group: '卡片', icon: 'i-pin', label: '知识的复利来自连接而非收集', nav: 'card' },
];
let paletteIndex = 0;
function renderPalette(query = '') {
  const q = query.trim().toLowerCase();
  const hits = PALETTE_ITEMS.filter(it => it.label.toLowerCase().includes(q));
  const list = $('#palette-list');
  if (!hits.length) { list.innerHTML = `<div class="palette-empty">没有匹配「${query}」的结果</div>`; return; }
  paletteIndex = Math.min(paletteIndex, hits.length - 1);
  let html = '', lastGroup = '';
  hits.forEach((it, i) => {
    if (it.group !== lastGroup) { html += `<div class="palette-group">${it.group}</div>`; lastGroup = it.group; }
    html += `<button class="palette-item ${i === paletteIndex ? 'active' : ''}" data-i="${i}">
      <svg class="icon"><use href="#${it.icon}"/></svg>${it.label}${it.kbd ? `<kbd>${it.kbd}</kbd>` : ''}</button>`;
  });
  list.innerHTML = html;
  $$('.palette-item', list).forEach(el => {
    el.addEventListener('click', () => runPaletteItem(hits[+el.dataset.i]));
    el.addEventListener('mousemove', () => { paletteIndex = +el.dataset.i; $$('.palette-item', list).forEach(x => x.classList.toggle('active', x === el)); });
  });
  list._hits = hits;
}
function runPaletteItem(it) {
  closePalette();
  if (it.label === '今日') { pushView({ view: 'today' }); return; }
  if (it.label === '卡片库') { pushView({ view: 'list' }); return; }
  toast(`样板间仅实现「今日 / 卡片库」，${it.label} 略`);
}
function openPalette() {
  document.body.classList.add('palette-open');
  paletteIndex = 0; renderPalette('');
  $('#palette-input').value = '';
  setTimeout(() => $('#palette-input').focus(), 30);
}
function closePalette() { document.body.classList.remove('palette-open'); }
$('#palette-open-btn').addEventListener('click', openPalette);
$('#palette-backdrop').addEventListener('click', closePalette);
$('#palette-input').addEventListener('input', e => { paletteIndex = 0; renderPalette(e.target.value); });
$('#palette-input').addEventListener('keydown', e => {
  const hits = $('#palette-list')._hits || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = (paletteIndex + 1) % Math.max(hits.length, 1); renderPalette($('#palette-input').value); }
  if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = (paletteIndex - 1 + hits.length) % Math.max(hits.length, 1); renderPalette($('#palette-input').value); }
  if (e.key === 'Enter' && hits[paletteIndex]) { runPaletteItem(hits[paletteIndex]); }
});

/* ── 键盘：Ctrl+K / Alt+←→ / Esc=后退 ── */
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); back(); return; }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); forward(); return; }
  if (e.key === 'Escape') {
    if (document.body.classList.contains('palette-open')) { closePalette(); return; }
    back();
  }
});

/* ── 筛选条 / 占位导航 ── */
$$('.chip').forEach(c => c.addEventListener('click', () => {
  $$('.chip').forEach(x => x.classList.remove('active')); c.classList.add('active');
}));
$$('.seg-btn').forEach(b => b.addEventListener('click', () => {
  $$('.seg-btn').forEach(x => x.classList.remove('active')); b.classList.add('active');
  toast(b.title === '列表视图' ? '列表视图（演示）' : '网格视图');
}));
$$('[data-nav]').forEach(b => b.addEventListener('click', () => toast('样板间仅实现「今日 / 卡片库」两页')));

/* ── 侧栏：收起 + 拖宽 ── */
$('#sidebar-toggle').addEventListener('click', () => {
  const collapsed = document.body.classList.toggle('collapsed');
  $('#sidebar-toggle').title = collapsed ? '展开侧边栏' : '收起侧边栏';
  $('#sidebar-toggle').setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
});
const SB_W_KEY = 'tau-mockup-sidebar-w';
const savedW = parseInt(localStorage.getItem(SB_W_KEY), 10);
if (savedW >= 180 && savedW <= 340) document.body.style.setProperty('--sidebar-w', savedW + 'px');
let sbDrag = null;
$('#sidebar-resizer').addEventListener('mousedown', e => {
  sbDrag = { x: e.clientX, w: document.querySelector('.sidebar').offsetWidth };
  $('#sidebar-resizer').classList.add('active');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!sbDrag) return;
  document.body.style.setProperty('--sidebar-w', Math.max(180, Math.min(340, sbDrag.w + e.clientX - sbDrag.x)) + 'px');
});
window.addEventListener('mouseup', () => {
  if (!sbDrag) return;
  sbDrag = null;
  $('#sidebar-resizer').classList.remove('active');
  localStorage.setItem(SB_W_KEY, document.body.style.getPropertyValue('--sidebar-w').replace('px', ''));
});

/* ── 平台预览（Win / Mac） ── */
const PLAT_KEY = 'tau-mockup-platform';
function applyPlatform(p) {
  document.documentElement.dataset.platform = p;
  $('#platform-toggle').textContent = '平台：' + (p === 'mac' ? 'Mac' : 'Win');
  localStorage.setItem(PLAT_KEY, p);
}
applyPlatform(localStorage.getItem(PLAT_KEY) || 'win');
$('#platform-toggle').addEventListener('click', () => {
  applyPlatform(document.documentElement.dataset.platform === 'mac' ? 'win' : 'mac');
});

render();
</script>
