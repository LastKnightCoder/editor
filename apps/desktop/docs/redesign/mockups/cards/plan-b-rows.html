<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<title>卡片库 · 方案 B 卡片盒行 — Tau 桌面端</title>
<!--
  【视觉参考，非导出源】（D-001）：mockup 用于对照评审，落地时样式迁移组件 Tailwind。
  方案 B · 卡片盒行：与今日页「继续编辑」/ 文章页 B 案同构的行式语言。旧版左侧标签树
  改为顶部横向标签 pills（顶层 + 选中后展开二级），换取列表全宽——置顶卡不再是「大卡」
  而是置顶分组的普通行，密度优先。时间分组（置顶/今天/昨天/本周/本月/更早）sticky 头 +
  ↑↓ 键盘移动 + Enter 预览。四分类以行首色点呈现，hover 平铺操作。图谱 / 表格切换保留。
  页内不设搜索框（titlebar Ctrl K 已覆盖）。
-->
<style>
:root {
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
[data-theme="cream"] {
  color-scheme: light;
  --bg-page: #f3eee2; --bg-surface: #fffdf9; --bg-group: #faf6ec; --bg-sunken: #ece5d4;
  --bg-hover: rgba(67,57,44,0.05); --bg-selected: rgba(217,119,87,0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217,119,87,0.12); --accent-text: #b85f42;
  --ok: #61795f; --warn: #a38c4d; --info: #5c7d99;
  --shadow-card: 0 1px 2px rgba(120,100,70,0.05), 0 10px 24px -14px rgba(120,100,70,0.18);
  --cat-temporary: #c96f4e; --cat-literature: #5c7d99; --cat-permanent: #61795f; --cat-theme: #a38c4d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 880px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; }
.icon { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ── 融合壳层 ── */
.app { display: grid; grid-template-columns: 218px 4px minmax(0,1fr); grid-template-rows: 100vh;
  grid-template-areas: "sidebar resizer main"; }
.sidebar { grid-area: sidebar; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-head { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; margin-bottom: 6px; flex: none; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13.5px; }
.nav-section { margin-top: 12px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13px; text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { background: var(--bg-hover); color: var(--ink-1); font-weight: 500; position: relative; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.resizer { grid-area: resizer; }
.main { grid-area: main; display: grid; grid-template-rows: 46px minmax(0,1fr) 30px; min-width: 0; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.titlebar-crumb { color: var(--ink-2); font-size: 12.5px; }
.titlebar-spacer { flex: 1; }
.kbd-pill { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--ink-2); font-size: 12px; }
kbd { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-group); color: var(--ink-2);
  font-size: 11px; font-family: ui-monospace, Consolas, monospace; display: inline-flex; align-items: center; }
.win-controls { display: flex; gap: 2px; margin-left: 4px; }
.win-btn { width: 36px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.win-btn:hover { background: var(--bg-hover); }
.win-btn.close:hover { background: #c25450; color: #fff; }
.content { overflow-y: auto; }
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--ink-3); font-size: 11.5px; }
.statusbar .sync { display: flex; align-items: center; gap: 6px; }
.statusbar .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar-spacer { flex: 1; }

/* ══ 卡片库 · 方案 B 卡片盒行 ══ */
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 26px 60px; }
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 2px 0 12px; background: var(--bg-page); }
.toolbar h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar .digest { font-size: 12px; color: var(--ink-2); }
.toolbar .digest b { color: var(--ink-1); font-weight: 600; }
.toolbar-spacer { flex: 1; }
.seg { display: flex; align-items: center; gap: 2px; background: var(--bg-surface); border-radius: 10px;
  padding: 3px; box-shadow: var(--shadow-card); }
.seg button { height: 24px; padding: 0 11px; border-radius: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink-1); }
.seg button.on { background: var(--bg-group); color: var(--ink-1); font-weight: 500; }
.icon-btn { width: 30px; height: 30px; border-radius: 999px; background: var(--bg-surface); box-shadow: var(--shadow-card);
  display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink-1); }
.new-btn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 14px;
  background: linear-gradient(145deg, var(--accent-hover), var(--accent)); color: var(--ink-inverse);
  border-radius: 999px; font-size: 12.5px; font-weight: 600;
  box-shadow: 0 4px 14px rgba(201,106,76,0.35), 0 1px 2px rgba(120,100,70,0.1); }
.new-btn:hover { transform: translateY(-1px); }

/* 筛选带：分类 chips（竖分隔）+ 横向标签 pills */
.filter-band { position: sticky; top: 44px; z-index: 19; display: flex; align-items: center; gap: 6px;
  padding-bottom: 10px; background: var(--bg-page); flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px;
  border-radius: 999px; background: var(--bg-surface); box-shadow: var(--shadow-card);
  font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 999px; }
.chip .n { font-size: 10.5px; color: var(--ink-3); }
.chip:hover { color: var(--ink-1); }
.chip.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.chip.on .n { color: var(--accent-text); }
.vsep { width: 1px; height: 18px; background: var(--bg-sunken); margin: 0 4px; }
.chip.tag { background: none; box-shadow: none; padding: 0 8px; }
.chip.tag.on { background: var(--bg-selected); }
.chip.tag .lvl2 { padding-left: 2px; color: var(--ink-3); }
.filter-band .count { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.kbd-hint { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); }

/* 时间分组 + 行 */
.group { margin-bottom: 4px; }
.group-head { position: sticky; top: 88px; z-index: 15; display: flex; align-items: baseline; gap: 8px;
  padding: 10px 4px 6px; font-size: 11px; color: var(--ink-3); background: var(--bg-page); }
.group-head b { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.row-list { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card);
  overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px;
  height: 46px; cursor: pointer; }
.row + .row { border-top: 1px solid var(--bg-group); }
.row::before { content: ""; position: absolute; left: 8px; top: 14px; bottom: 14px; width: 3px;
  border-radius: 3px; background: var(--cc, transparent); opacity: 0.75; }
.row:hover { background: var(--bg-hover); }
.row.kbd { background: var(--bg-selected); }
.row .r-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13px; color: var(--ink-1); }
.row .r-tags { display: flex; gap: 4px; flex: none; max-width: 260px; overflow: hidden; }
.tpill { display: inline-flex; align-items: center; height: 19px; padding: 0 8px; border-radius: 999px;
  background: var(--bg-group); color: var(--ink-2); font-size: 10.5px; white-space: nowrap; }
.row .r-links { flex: none; display: inline-flex; align-items: center; gap: 3px; width: 44px;
  font-size: 11px; color: var(--info); }
.row .r-links .icon { width: 11px; height: 11px; }
.row .r-words { flex: none; width: 52px; text-align: right; font-size: 11px; color: var(--ink-3); }
.row .r-date { flex: none; width: 44px; font-size: 11px; color: var(--ink-3); }
.row .r-pin { flex: none; color: var(--cat-temporary); display: inline-flex; }
.row .r-pin .icon { width: 12px; height: 12px; }
.row-acts { display: flex; gap: 2px; flex: none; opacity: 0; transition: opacity 120ms; }
.row:hover .row-acts, .row.kbd .row-acts { opacity: 1; }
.act { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); }
.act:hover { background: var(--bg-hover); color: var(--ink-1); }
.act .icon { width: 14px; height: 14px; }
.empty { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 72px 0; color: var(--ink-3); }
.empty.show { display: flex; }
.empty b { color: var(--ink-2); font-size: 14px; }
.sentinel { text-align: center; padding: 20px 0 4px; color: var(--ink-3); font-size: 11.5px; }

/* 其他视图占位 */
.alt-view { display: none; padding: 72px 0; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.alt-view.show { display: block; }
.alt-view b { color: var(--ink-2); display: block; margin-bottom: 4px; font-size: 14px; }

/* ── 预览弹窗（同方案 A 的合并形态）── */
.overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  background: rgba(67,57,44,0.32); backdrop-filter: blur(3px); }
.overlay.show { display: flex; }
.modal { width: 680px; max-width: calc(100vw - 60px); max-height: calc(100vh - 80px); display: flex; flex-direction: column;
  background: var(--bg-surface); border-radius: var(--radius-lg);
  box-shadow: 0 24px 64px -24px rgba(67,57,44,0.4); animation: pop 200ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
.m-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px 0; }
.m-head .spacer { flex: 1; }
.m-body { padding: 14px 18px 4px; overflow-y: auto; }
.m-text { font-size: 14.5px; line-height: 1.9; color: var(--ink-1); outline: none; min-height: 120px; }
.m-edithint { font-size: 10.5px; color: var(--ink-3); margin-top: 8px; }
.m-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 12px 18px 16px; }
.cat-tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px;
  font-size: 10.5px; background: var(--cs); color: var(--cc); white-space: nowrap; }
.cat-tag::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--cc); }
.meta { display: flex; gap: 12px; margin-left: 6px; font-size: 11px; color: var(--ink-3); }

/* ── 菜单 / toast ── */
.menu { position: fixed; z-index: 120; min-width: 168px; background: var(--bg-surface); border-radius: 10px;
  box-shadow: 0 4px 10px rgba(67,57,44,0.12), 0 16px 40px -16px rgba(67,57,44,0.3); padding: 4px; display: none; }
.menu.show { display: block; }
.menu .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 9px;
  border-radius: 7px; font-size: 12.5px; color: var(--ink-1); text-align: left; }
.menu .mi:hover { background: var(--bg-hover); }
.menu .mi .icon { width: 13.5px; height: 13.5px; color: var(--ink-3); }
.menu .mi.danger { color: #b0564d; }
.menu .msep { height: 1px; margin: 4px 6px; background: var(--bg-group); }
.menu .mlabel { font-size: 10.5px; color: var(--ink-3); padding: 5px 9px 2px; }
.toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(8px); z-index: 200;
  background: var(--ink-1); color: var(--ink-inverse); font-size: 12.5px; border-radius: 999px;
  padding: 8px 16px; opacity: 0; pointer-events: none; transition: all 200ms var(--ease-out); }
.toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-head">
      <span style="display:flex;align-items:center;gap:8px"><span class="brand-mark">τ</span><span class="brand-name">Tau</span></span>
    </div>
    <div class="nav-section">
      <div class="nav-label">工作台</div>
      <button class="nav-item"><svg class="icon"><use href="#i-flame"/></svg><span>今日</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-calendar"/></svg><span>日程</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-todo"/></svg><span>待办</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-users"/></svg><span>协作</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">知识</div>
      <button class="nav-item active"><svg class="icon"><use href="#i-layers"/></svg><span>卡片库</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-article"/></svg><span>文章</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-pen"/></svg><span>日记</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-book"/></svg><span>知识库</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-board"/></svg><span>白板</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">学习</div>
      <button class="nav-item"><svg class="icon"><use href="#i-folder"/></svg><span>项目</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-repeat"/></svg><span>闪卡复习</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-help"/></svg><span>问题管理</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">工具</div>
      <button class="nav-item"><svg class="icon"><use href="#i-chart"/></svg><span>统计</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></button>
    </div>
  </nav>
  <div class="resizer"></div>
  <div class="main">
    <header class="titlebar">
      <span class="titlebar-crumb">· 卡片库</span>
      <div class="titlebar-spacer"></div>
      <button class="kbd-pill"><svg class="icon" style="width:13px;height:13px"><use href="#i-search"/></svg>搜索或跳转…<kbd>Ctrl K</kbd></button>
      <div class="win-controls"><span class="win-btn"></span><span class="win-btn close"></span></div>
    </header>
    <main class="content" id="content">
      <div class="wrap">
        <div class="toolbar">
          <h1>卡片库</h1>
          <span class="digest num" id="digest"></span>
          <div class="toolbar-spacer"></div>
          <div class="seg" id="seg">
            <button data-view="rows" class="on">卡片盒</button>
            <button data-view="graph">图谱</button>
            <button data-view="table">表格</button>
          </div>
          <button class="icon-btn" title="导入 Markdown" id="importBtn"><svg class="icon"><use href="#i-import"/></svg></button>
          <button class="new-btn" id="newBtn"><svg class="icon" style="width:13px;height:13px"><use href="#i-plus"/></svg>新建卡片</button>
        </div>

        <!-- 筛选带：分类 chips | 标签横向 pills（选中后二级以 · 链接呈现） -->
        <div class="filter-band" id="filterBand">
          <button class="chip on" data-cat="all">全部<span class="n num" id="n-all"></span></button>
          <button class="chip" data-cat="temporary"><span class="dot" style="background:var(--cat-temporary)"></span>闪念<span class="n num" id="n-temporary"></span></button>
          <button class="chip" data-cat="literature"><span class="dot" style="background:var(--cat-literature)"></span>文献<span class="n num" id="n-literature"></span></button>
          <button class="chip" data-cat="permanent"><span class="dot" style="background:var(--cat-permanent)"></span>永久<span class="n num" id="n-permanent"></span></button>
          <button class="chip" data-cat="theme"><span class="dot" style="background:var(--cat-theme)"></span>主题<span class="n num" id="n-theme"></span></button>
          <span class="vsep"></span>
          <span id="tagPills" style="display:flex;gap:2px;flex-wrap:wrap"></span>
          <span class="count num" id="resultCount"></span>
          <span class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd>移动<kbd>↵</kbd>预览</span>
        </div>

        <section id="view-rows">
          <div id="groups"></div>
          <div class="empty" id="empty">
            <svg class="icon" style="width:26px;height:26px"><use href="#i-layers"/></svg>
            <b>没有匹配的卡片</b>
            <small>清除分类 / 标签筛选，或用 Ctrl K 全局搜索</small>
          </div>
          <div class="sentinel num" id="sentinel"></div>
        </section>

        <section id="view-alt" class="alt-view"></section>
      </div>
    </main>
    <footer class="statusbar">
      <span class="sync">已同步</span>
      <span class="num" id="status-count"></span>
      <span class="statusbar-spacer"></span>
      <span id="status-view">视图 · 卡片盒</span>
    </footer>
  </div>
</div>

<!-- 预览弹窗（纯编辑/预览：操作在行内 ⋯ 菜单） -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-head">
      <span class="cat-tag" id="pv-cat"></span>
      <div class="meta"><span id="pv-created"></span><span id="pv-updated"></span><span class="num" id="pv-words"></span></div>
      <div class="spacer"></div>
      <button class="act" title="进入详情" data-act="detail"><svg class="icon"><use href="#i-maximize"/></svg></button>
      <button class="act" title="关闭 (Esc)" data-act="close"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="m-body">
      <div class="m-text" id="pv-text" contenteditable="true" spellcheck="false"></div>
      <div class="m-edithint">正文可直接编辑 · 每 0.5s 自动保存（旧版 CardPreview 行为保留）</div>
    </div>
    <div class="m-tags" id="pv-tags"></div>
  </div>
</div>

<div class="menu" id="cardMenu">
  <button class="mi" data-k="detail"><svg class="icon"><use href="#i-maximize"/></svg>进入详情</button>
  <button class="mi" data-k="window"><svg class="icon"><use href="#i-external"/></svg>窗口打开</button>
  <button class="mi" data-k="top"><svg class="icon"><use href="#i-pin"/></svg>设置置顶</button>
  <button class="mi" data-k="present"><svg class="icon"><use href="#i-play"/></svg>演示模式</button>
  <div class="msep"></div>
  <div class="mlabel">导出</div>
  <button class="mi" data-k="export"><svg class="icon"><use href="#i-export"/></svg>Markdown / 图片 / EPUB / PDF</button>
  <div class="msep"></div>
  <div class="mlabel">编辑分类</div>
  <button class="mi" data-k="cat-temporary"><i style="width:7px;height:7px;border-radius:99px;background:var(--cat-temporary)"></i>闪念笔记</button>
  <button class="mi" data-k="cat-literature"><i style="width:7px;height:7px;border-radius:99px;background:var(--cat-literature)"></i>文献笔记</button>
  <button class="mi" data-k="cat-permanent"><i style="width:7px;height:7px;border-radius:99px;background:var(--cat-permanent)"></i>永久笔记</button>
  <button class="mi" data-k="cat-theme"><i style="width:7px;height:7px;border-radius:99px;background:var(--cat-theme)"></i>主题笔记</button>
  <div class="msep"></div>
  <button class="mi danger" data-k="delete"><svg class="icon"><use href="#i-trash"/></svg>删除卡片</button>
</div>

<script>
/* ── mock 数据（与方案 A 同一口径）── */
const CAT = {

};
const C = (id, cat, tags, words, grp, date, text, links = []) => ({ id, cat, tags, words, grp, date, text, links });
const CARDS = [
  Object.assign(C(1, "permanent", ["卡片盒", "方法论"], 212, "today", "09-20",
    "知识的复利来自连接而非收集。收集创造库存，连接创造利息；而库存是要付仓储成本的——每一次「以后再看」，都是一笔记在未来自己账上的负债。", [12, 20, 25]), { top: true }),
  Object.assign(C(2, "theme", ["读书/卡片笔记", "卡片盒"], 186, "today", "09-20",
    "MOC · 卡片盒方法总览。卢曼的秘密不在卡片，在编号：编号是思想的坐标系，没有地址的思想等于不存在。本卡作索引页，串起四条主线——原子化、编号、连接、反刍。", [12, 20, 25, 30]), { top: true }),
  C(3, "temporary", ["写作"], 64, "today", "09-20", "写作是思考的显影：脑子里的念头是高清的，落到纸上全是噪点。把信噪比提到别人能读懂的程度，就是写作全部的工作量。"),
  C(4, "temporary", ["卡片盒"], 52, "today", "09-20", "三条闪念没有归属标签，先挂在「卡片盒」待整理——周五盘点时统一决定去留，不让 inbox 变成仓库。"),
  C(5, "literature", ["读书/文明"], 148, "today", "09-20", "《文明》第二季第 4 期：地理是文明的硬约束。大河的走向决定了粮食的分布，粮食的分布决定了城市的选址，城市的选址决定了帝国扩张的方向。", [22]),
  C(6, "permanent", ["认知/记忆"], 172, "today", "09-20", "流畅感是记忆最大的骗子：重读时越顺，说明线索越熟；而线索的熟悉，恰恰掩盖了提取的生疏。检验记住与否的唯一标准，是合上书还能不能复述。", [13, 29]),
  C(7, "temporary", ["认知/注意力"], 38, "yesterday", "09-19", "注意力残留：每次切换后，残留的思绪要 15 分钟才消散。", [17, 19]),
  C(8, "temporary", ["工具流"], 45, "yesterday", "09-19", "写脚本自动化一件一年只做三次的事，纯粹因为第三次手动做的时候忍无可忍。值吗？值。"),
  C(9, "literature", ["读书/卡片笔记"], 156, "yesterday", "09-19", "《卡片笔记写作法》重读：闪念卡片与文献卡片是两条不同的产线——前者记录自己的念头，后者摘录他人的论述。混在一起，就是灾难的开始。"),
  C(10, "permanent", ["方法论"], 168, "yesterday", "09-19", "我理解的「慢就是快」：快是跳过理解直达答案，慢是让每一步都踩实。跳过的部分不会消失，总会在下一个路口等你，而且利息不低。"),
  C(11, "temporary", ["写作"], 30, "yesterday", "09-19", "标题先写最烂的那版。烂标题是占位符，好标题是承诺——别在一开始就许诺。"),
  C(12, "permanent", ["卡片盒"], 194, "week", "09-17", "原子化不是碎片化。一张卡片只承载一个论点，论证材料放在链接的另一端；「一卡一事」牺牲的是单卡的完整感，换来的是复用与重组的自由。", [1, 2]),
  C(13, "temporary", ["认知/记忆"], 44, "week", "09-17", "间隔重复的最优间隔并不存在——算法能给的是兜底，不是最优。", [6]),
  C(14, "literature", ["读书/文明"], 132, "week", "09-16", "《文明》第二季第 3 期摘录：盐铁之辩的本质不是经济问题，是中央与地方的权力边界问题。财政工具从来都是政治工具。"),
  C(15, "permanent", ["写作"], 158, "week", "09-16", "写长文先搭骨架。大纲是叙述的顺序，骨架是论证的顺序——先立论点，再排证据，最后才是修辞。骨架立住之后，写作变成填空。"),
  C(16, "temporary", ["方法论"], 36, "week", "09-15", "模板每次变复杂一点，写的时候反而更快一点。约束本身就是脚手架。"),
  C(17, "permanent", ["认知/注意力"], 176, "week", "09-15", "深度工作的环境设计清单：手机放另一个房间、通知全关、任务写在纸上而非屏幕上、开始前倒一杯水。全部是为了让「切换」这件事变贵。", [7, 19]),
  C(18, "literature", ["读书/卡片笔记"], 141, "week", "09-14", "渐进式总结的第二遍不是压缩，是改写。用自己的话重述时丢失的那部分，恰恰是还没理解的部分——丢失率就是理解率的反面。"),
  C(19, "temporary", ["认知/注意力"], 47, "week", "09-14", "通知全关第七天：戒断反应消失，第一次出现连续三小时的沉浸。", [17]),
  C(20, "permanent", ["卡片盒"], 165, "week", "09-13", "编号是思想的坐标系。卢曼给每张卡片一个不重复的地址，新卡片插在旧卡片的缝隙里（21/3a），位置本身就是语境。", [2, 1]),
  C(21, "temporary", ["写作"], 41, "month", "09-08", "晨间随笔第 30 天：前二十天产出的是情绪垃圾，后十天偶尔出现一句真话。真话率 5%，值回全部时间。"),
  C(22, "literature", ["读书/文明"], 120, "month", "09-05", "《文明》第二季第 2 期摘录：造纸术西传的真正意义不是知识变便宜，而是「删改」变可能——可修改的媒介才有版本的概念。", [5]),
  C(23, "permanent", ["方法论"], 149, "month", "09-03", "费曼技巧实践：向想象中的听众解释「为什么卡片要原子化」，讲到第三句就卡壳。卡住的地方，就是理解的边界；边界比知识本身更有价值。"),
  C(24, "temporary", ["工具流"], 58, "month", "09-01", "「素材库」改叫「引文池」之后，往里丢东西前会多想一秒——命名在悄悄塑造行为。"),
  C(25, "permanent", ["卡片盒"], 172, "month", "08-28", "链接的价值不在建立的瞬间，而在三个月后你在完全不同的语境里撞见它的那次意外。双链笔记的涌现结构，需要的是时间和足够的节点密度。", [1]),
  C(26, "temporary", ["卡片盒"], 49, "month", "08-25", "孤儿链接三条：指向已删除卡片的链接没有清理。盘点清单再 +1。"),
  C(27, "permanent", ["写作"], 134, "month", "08-22", "给重要文章定一个「复读日」：好书读两遍胜过读两本。第二遍带着第一遍留下的问题去读，密度完全不同。"),
  C(28, "literature", ["读书/卡片笔记"], 128, "month", "08-18", "文献卡片纪律：只记语境，不改写。原文摘录 + 页码 + 当时为什么摘它，三条缺一不可；改写是永久卡片阶段的事。"),
  C(29, "temporary", ["认知/记忆"], 52, "month", "08-15", "回忆式复习第二个月：「想不起来」的痛苦指数断崖式下降——原来提取本身是可以训练的。", [6]),
  C(30, "permanent", ["卡片盒"], 181, "month", "08-12", "反对自己的卡片：肌肉在对抗中生长，思维在反驳中生长。照抄一百张卡片，不如愤怒地反驳一张——反驳逼你亮出自己的论点。", [2]),
  C(31, "temporary", ["工具流"], 63, "earlier", "07-30", "小而钝的工具：大而全的工具替你做决定，小而钝的工具逼你面对自己的流程。后者往往更能留下东西。"),
  C(32, "literature", ["读书/文明"], 137, "earlier", "07-21", "《文明》第二季第 1 期摘录：文明的第一驱动力是「讲故事的能力」——超过 150 人的协作，靠的不是熟悉，而是共同的叙事。"),
  C(33, "permanent", ["写作"], 129, "earlier", "07-14", "手机写作的秘诀是放弃编辑：只管往前写，格式、错字、结构全部留给回桌面后的自己。先有素材，再谈加工。"),
  C(34, "temporary", ["方法论"], 55, "earlier", "07-06", "公开学习最难的不是被批评，而是忍受「这还不成熟」的羞耻感。但它确实加速了迭代。"),
  C(35, "permanent", ["认知/记忆"], 163, "earlier", "06-28", "提取练习优于重读：测试效应的证据很扎实——主动提取一次的记忆留存，是被动重读三次的三倍，尽管重读的感觉更好。", [6]),
  C(36, "theme", ["卡片盒", "写作"], 158, "earlier", "06-15", "MOC · 写作主题索引：写作即思考的显影、骨架先于修辞、烂标题是占位符、复读日的密度。本卡是「写作」标签的地图页，回答「关于写作我写过什么」。", [3, 15, 21, 27, 33]),
];
const GRPS = [["pinned", "置顶"], ["today", "今天"], ["yesterday", "昨天"], ["week", "本周"], ["month", "本月"], ["earlier", "更早"]];
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
CARDS.forEach((c, i) => c.createOrder = CARDS.length - i); /* 数据本身按新→旧排 */

const state = { view: "rows", cat: "all", tag: "" };
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const SOFT = { temporary: "rgba(201,111,78,.11)", literature: "rgba(92,125,153,.12)", permanent: "rgba(97,121,95,.13)", theme: "rgba(163,140,77,.14)" };

$("#digest").innerHTML = `<b class="num">${CARDS.length}</b> 张 · <b class="num">${CARDS.reduce((s, c) => s + c.words, 0).toLocaleString()}</b> 字`;
["all", "temporary", "literature", "permanent", "theme"].forEach(k => {
  $("#n-" + k).textContent = k === "all" ? CARDS.length : CARDS.filter(c => c.cat === k).length;
});

/* ── 横向标签 pills：顶层 + 选中后二级 ── */
function renderTagPills() {
  const tops = {};
  CARDS.forEach(c => c.tags.forEach(t => {
    const segs = t.split("/"), top = segs[0];
    tops[top] = tops[top] || { n: 0, kids: {} };
    tops[top].n++;
    if (segs[1]) tops[top].kids[segs[1]] = (tops[top].kids[segs[1]] || 0) + 1;
  }));
  let html = "";
  Object.entries(tops).forEach(([name, v]) => {
    const on = state.tag === name || state.tag.startsWith(name + "/");
    html += `<button class="chip tag ${on ? "on" : ""}" data-tag="${esc(name)}">${esc(name)}<span class="n num">${v.n}</span></button>`;
    if (on) Object.entries(v.kids).forEach(([k, n]) => {
      const kon = state.tag === name + "/" + k;
      html += `<button class="chip tag ${kon ? "on" : ""}" data-tag="${esc(name + "/" + k)}"><span class="lvl2">·</span>${esc(k)}<span class="n num">${n}</span></button>`;
    });
  });
  $("#tagPills").innerHTML = html;
  $("#tagPills").querySelectorAll(".chip.tag").forEach(p => p.onclick = () => {
    const t = p.dataset.tag;
    state.tag = state.tag === t ? "" : t;
    renderTagPills(); render();
  });
}

/* ── 过滤 + 分组渲染（搜索走 titlebar Ctrl K）── */
function filtered() {
  return CARDS.filter(c => {
    if (state.cat !== "all" && c.cat !== state.cat) return false;
    if (state.tag && !c.tags.some(t => t === state.tag || t.startsWith(state.tag + "/"))) return false;
    return true;
  }).sort((a, b) => b.createOrder - a.createOrder || 0);
}
function rowHTML(c) {
  return `
  <div class="row" data-id="${c.id}" style="--cc:${CAT[c.cat].c}" tabindex="-1">
    ${c.top ? `<span class="r-pin" title="已置顶"><svg class="icon"><use href="#i-pin"/></svg></span>` : ""}
    <span class="r-text">${esc(c.text.split("\n")[0])}</span>
    <span class="r-tags">${c.tags.map(t => `<span class="tpill">${esc(t)}</span>`).join("")}</span>
    <span class="r-links num">${c.links.length ? `<svg class="icon"><use href="#i-link"/></svg>${c.links.length}` : ""}</span>
    <span class="r-words num">${c.words} 字</span>
    <span class="r-date num">${c.date}</span>
    <span class="row-acts">
      <button class="act" data-act="detail" title="进入详情"><svg class="icon"><use href="#i-maximize"/></svg></button>
      <button class="act" data-act="present" title="演示模式"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="act" data-act="menu" title="更多"><svg class="icon"><use href="#i-more"/></svg></button>
    </span>
  </div>`;
}
function render() {
  const list = filtered();
  const groups = GRPS.map(([k, label]) => {
    let items;
    if (k === "pinned") items = list.filter(c => c.top);
    else items = list.filter(c => !c.top && c.grp === k);
    return { k, label, items };
  }).filter(g => g.items.length);
  $("#groups").innerHTML = groups.map(g => `
    <div class="group">
      <div class="group-head"><b>${g.label}</b><span class="num">${g.items.length} 张</span></div>
      <div class="row-list">${g.items.map(rowHTML).join("")}</div>
    </div>`).join("");
  $("#resultCount").textContent = `${list.length} / ${CARDS.length} 张`;
  $("#empty").classList.toggle("show", list.length === 0);
  $("#sentinel").textContent = list.length ? "已加载全部 " + list.length + " 张 · 列表命令按 LIMIT 渐进拉取" : "";
  $("#status-count").textContent = CARDS.length + " 张卡片";
}
renderTagPills(); render();

/* ── 事件 ── */
$("#filterBand").querySelectorAll(".chip[data-cat]").forEach(ch => ch.onclick = () => {
  state.cat = ch.dataset.cat;
  $("#filterBand").querySelectorAll(".chip[data-cat]").forEach(x => x.classList.toggle("on", x === ch));
  render();
});
$("#seg").querySelectorAll("button").forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  $("#seg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  const isRows = state.view === "rows";
  $("#view-rows").style.display = isRows ? "" : "none";
  $("#filterBand").style.display = isRows ? "" : "none";
  const alt = $("#view-alt");
  alt.classList.toggle("show", !isRows);
  alt.innerHTML = isRows ? "" : `<b>${b.textContent}视图</b>与方案 A 同源：图谱 = LinkGraph（links + 内联链接成边，点击节点预览）；表格 = Database 组件（四型视图 / 行内编辑 / 列宽持久化）。`;
  $("#status-view").textContent = "视图 · " + b.textContent.trim();
});

let kbdId = null;
document.addEventListener("click", e => {
  const act = e.target.closest(".act[data-act]");
  if (act) {
    e.stopPropagation();
    const row = act.closest(".row"); if (!row) return;
    const id = +row.dataset.id;
    if (act.dataset.act === "detail") toast("进入详情：navigator.push(card-detail/" + id + ")");
    else if (act.dataset.act === "present") toast("演示模式：PresentationMode 全屏");
    else if (act.dataset.act === "menu") openMenu(act, id);
    return;
  }
  const row = e.target.closest(".row[data-id]");
  if (row) openPreview(+row.dataset.id);
});

/* ── 键盘：↑↓ 移动 + Enter 预览 ── */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePreview(); menu.classList.remove("show"); return; }
  const t = e.target;
  if ($("#overlay").classList.contains("show") || (t.closest && t.closest("input, [contenteditable]"))) return;
  const rows = [...document.querySelectorAll(".row[data-id]")];
  if (!rows.length) return;
  const cur = rows.findIndex(r => r.classList.contains("kbd"));
  let next = cur;
  if (e.key === "ArrowDown") next = Math.min(rows.length - 1, cur + 1);
  else if (e.key === "ArrowUp") next = Math.max(0, cur === -1 ? 0 : cur - 1);
  else if (e.key === "Enter" && cur >= 0) { openPreview(+rows[cur].dataset.id); return; }
  else return;
  e.preventDefault();
  rows.forEach(r => r.classList.remove("kbd"));
  rows[next].classList.add("kbd");
  rows[next].scrollIntoView({ block: "nearest" });
});

/* ── 菜单 ── */
const menu = $("#cardMenu");
let menuCardId = null;
function openMenu(anchor, id) {
  menuCardId = id;
  const r = anchor.getBoundingClientRect();
  menu.classList.add("show");
  menu.style.left = Math.min(r.left, innerWidth - 190) + "px";
  menu.style.top = Math.min(r.bottom + 6, innerHeight - menu.offsetHeight - 8) + "px";
  menu.querySelector('[data-k="top"]').lastChild.textContent = byId[id].top ? "取消置顶" : "设置置顶";
}
menu.querySelectorAll(".mi").forEach(mi => mi.onclick = () => {
  menu.classList.remove("show");
  const k = mi.dataset.k, id = menuCardId;
  if (k === "detail") toast("进入详情：navigator.push(card-detail/" + id + ")");
  else if (k === "window") toast("窗口打开（仅 Electron 渲染）");
  else if (k === "top") { byId[id].top = !byId[id].top; render(); toast(byId[id].top ? "已置顶" : "已取消置顶"); }
  else if (k === "present") toast("演示模式：PresentationMode 全屏");
  else if (k === "delete") toast("删除确认：MobileConfirmDialog 同款浮层");
  else if (k === "export") toast("导出：Markdown / 图片 / EPUB / PDF（Dialog）");
  else if (k.startsWith("cat-")) { byId[id].cat = k.slice(4); render(); toast("分类已改为「" + CAT[k.slice(4)].full + "」"); }
});
document.addEventListener("click", e => { if (!e.target.closest("#cardMenu") && !e.target.closest('[data-act="menu"]')) menu.classList.remove("show"); });

/* ── 预览 ── */
let previewId = null;
function openPreview(id) {
  previewId = id;
  const c = byId[id];
  $("#pv-cat").outerHTML = `<span class="cat-tag" id="pv-cat" style="--cc:${CAT[c.cat].c};--cs:${SOFT[c.cat]}">${CAT[c.cat].full}</span>`;
  $("#pv-created").textContent = "创建于 2026-" + c.date;
  $("#pv-updated").textContent = "最后修改 2026-" + c.date;
  $("#pv-words").textContent = c.words + " 字";
  $("#pv-text").textContent = c.text;
  renderPvTags(c);
  $("#overlay").classList.add("show");
}
function renderPvTags(c) {
  $("#pv-tags").innerHTML = c.tags.map(t => `<span class="tpill" data-t="${esc(t)}" title="点击移除" style="height:22px;font-size:11px;cursor:pointer">${esc(t)} ×</span>`).join("") +
    `<button class="m-tag-add" style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--bg-group);color:var(--ink-3);font-size:11px">＋ 添加标签</button>`;
  $("#pv-tags").querySelectorAll(".tpill").forEach(el => el.onclick = () => { c.tags = c.tags.filter(t => t !== el.dataset.t); renderPvTags(c); renderTagPills(); render(); });
  $("#pv-tags").querySelector(".m-tag-add").onclick = () => {
    const t = prompt("新标签（支持 a/b 层级）");
    if (t && !c.tags.includes(t)) { c.tags.push(t); renderPvTags(c); renderTagPills(); render(); }
  };
}
$("#overlay").addEventListener("click", e => { if (e.target === $("#overlay")) closePreview(); });
function closePreview() { $("#overlay").classList.remove("show"); previewId = null; }
$("#overlay").querySelectorAll(".m-head .act").forEach(b => b.onclick = () => {
  if (b.dataset.act === "close") closePreview();
  else if (b.dataset.act === "detail") { closePreview(); toast("进入详情：navigator.push(card-detail/" + previewId + ")"); }
});

$("#newBtn").onclick = () => toast("新建卡片：CreateCard 弹窗（编辑器 + 标签 + 草稿暂存）");
$("#importBtn").onclick = () => toast("导入 Markdown：多选文件 → importFromMarkdown 逐张建卡");

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
