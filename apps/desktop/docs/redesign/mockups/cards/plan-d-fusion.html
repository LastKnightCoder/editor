<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<title>卡片库 · 方案 D 融合工作台 — Tau 桌面端</title>
<!--
  【视觉参考，非导出源】（D-001）：mockup 用于对照评审，落地时样式迁移组件 Tailwind。
  方案 D · 融合工作台（第一轮反馈定稿方向）：合并三方案各自的吸引点——
  · A 的左侧标签树（分类 + 层级标签，前缀匹配过滤）；
  · B 的时间分组（置顶/今天/昨天/本周/本月/更早，分组头 sticky）；
  · C 的明确工作区（右侧独立大卡工作台：预览即编辑、链接 chips、操作平铺、新建同区完成）。
  页内不再设搜索框——全局搜索（titlebar Ctrl K / types:["card"]）已覆盖，本页只做浏览与加工。
  列表数据 LIMIT 渐进拉取；键盘 ↑↓ 浏览 + ↵ 选中；Ctrl ↵ 保存新建。
-->
<style>
:root {
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
[data-theme="cream"] {
  color-scheme: light;
  --bg-page: #f3eee2; --bg-surface: #fffdf9; --bg-group: #faf6ec; --bg-sunken: #ece5d4;
  --bg-hover: rgba(67,57,44,0.05); --bg-selected: rgba(217,119,87,0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217,119,87,0.12); --accent-text: #b85f42;
  --ok: #61795f; --warn: #a38c4d; --info: #5c7d99;
  --shadow-card: 0 1px 2px rgba(120,100,70,0.05), 0 10px 24px -14px rgba(120,100,70,0.18);
  --shadow-desk: 0 1px 2px rgba(120,100,70,0.06), 0 18px 44px -18px rgba(120,100,70,0.26);
  --cat-temporary: #c96f4e; --cat-temporary-soft: rgba(201,111,78,0.11);
  --cat-literature: #5c7d99; --cat-literature-soft: rgba(92,125,153,0.12);
  --cat-permanent: #61795f; --cat-permanent-soft: rgba(97,121,95,0.13);
  --cat-theme: #a38c4d; --cat-theme-soft: rgba(163,140,77,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 1200px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font: inherit; }
.icon { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ── 融合壳层 ── */
.app { display: grid; grid-template-columns: 218px 4px minmax(0,1fr); grid-template-rows: 100vh;
  grid-template-areas: "sidebar resizer main"; }
.sidebar { grid-area: sidebar; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-head { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; margin-bottom: 6px; flex: none; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13.5px; }
.nav-section { margin-top: 12px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13px; text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { background: var(--bg-hover); color: var(--ink-1); font-weight: 500; position: relative; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.resizer { grid-area: resizer; }
.main { grid-area: main; display: grid; grid-template-rows: 46px minmax(0,1fr) 30px; min-width: 0; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.titlebar-crumb { color: var(--ink-2); font-size: 12.5px; }
.titlebar-spacer { flex: 1; }
.kbd-pill { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--ink-2); font-size: 12px; }
kbd { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-group); color: var(--ink-2);
  font-size: 11px; font-family: ui-monospace, Consolas, monospace; display: inline-flex; align-items: center; }
.win-controls { display: flex; gap: 2px; margin-left: 4px; }
.win-btn { width: 36px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.win-btn:hover { background: var(--bg-hover); }
.win-btn.close:hover { background: #c25450; color: #fff; }
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--ink-3); font-size: 11.5px; }
.statusbar .sync { display: flex; align-items: center; gap: 6px; }
.statusbar .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar-spacer { flex: 1; }

/* ══ 卡片库 · 方案 D 融合工作台 ══ */
/* 工具栏：无搜索框（titlebar Ctrl K 承担），只留视图切换 / 导入 / 新建 */
.toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 18px 10px; }
.toolbar h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar .digest { font-size: 12px; color: var(--ink-2); }
.toolbar .digest b { color: var(--ink-1); font-weight: 600; }
.toolbar-spacer { flex: 1; }
.seg { display: flex; align-items: center; gap: 2px; background: var(--bg-surface); border-radius: 10px;
  padding: 3px; box-shadow: var(--shadow-card); }
.seg button { height: 24px; padding: 0 11px; border-radius: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink-1); }
.seg button.on { background: var(--bg-group); color: var(--ink-1); font-weight: 500; }
.icon-btn { width: 30px; height: 30px; border-radius: 999px; background: var(--bg-surface); box-shadow: var(--shadow-card);
  display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink-1); }
.new-btn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 14px;
  background: linear-gradient(145deg, var(--accent-hover), var(--accent)); color: var(--ink-inverse);
  border-radius: 999px; font-size: 12.5px; font-weight: 600;
  box-shadow: 0 4px 14px rgba(201,106,76,0.35), 0 1px 2px rgba(120,100,70,0.1); }
.new-btn:hover { transform: translateY(-1px); }

/* 三块面板：列表窄、工作台大且阴影更重——「工作区」与其他区域明确分开 */
.desk { height: 100%; display: grid; grid-template-columns: 224px 376px minmax(0,1fr); gap: 14px;
  padding: 4px 18px 16px; }

/* ── 左栏 · 标签树（A 基因）── */
.tagpane { display: flex; flex-direction: column; min-height: 0; background: var(--bg-surface);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 12px 8px; }
.tagpane-head { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; color: var(--ink-3); font-size: 11.5px; }
.tagpane-head .icon { width: 13px; height: 13px; }
.catnode { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px;
  border-radius: 8px; color: var(--ink-2); font-size: 12.5px; text-align: left; }
.catnode .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.catnode:hover { background: var(--bg-hover); color: var(--ink-1); }
.catnode.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.catnode .n { margin-left: auto; font-size: 11px; color: var(--ink-3); }
.tagsep { height: 1px; margin: 8px 10px; background: var(--bg-group); }
.tnode { display: flex; align-items: center; gap: 6px; width: 100%; height: 29px; padding: 0 8px;
  border-radius: 8px; color: var(--ink-2); font-size: 12.5px; text-align: left; }
.tnode:hover { background: var(--bg-hover); color: var(--ink-1); }
.tnode.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.tnode .caret { width: 14px; height: 14px; display: grid; place-items: center; color: var(--ink-3); transition: transform 150ms var(--ease-out); }
.tnode .caret.flat { visibility: hidden; }
.tnode-wrap.open > .tnode > .caret { transform: rotate(90deg); }
.tnode .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tnode .n { font-size: 11px; color: var(--ink-3); }
.tnode .kids { margin-left: 13px; border-left: 1px solid var(--bg-sunken); padding-left: 4px; display: none; }
.tnode-wrap.open > .kids { display: block; }

/* ── 中栏 · 时间分组列表（B 基因）── */
.listpane { display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.list-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; color: var(--ink-3); font-size: 11.5px; }
.list-head .kbd-hint { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.list-scroll { flex: 1; overflow-y: auto; padding-bottom: 14px; }
.lgroup { position: sticky; top: 0; z-index: 5; font-size: 10.5px; color: var(--ink-3);
  padding: 9px 14px 4px; letter-spacing: 0.04em; background: var(--bg-surface); }
.lgroup b { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-right: 4px; }
.lrow { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 8px 14px 8px 22px;
  cursor: pointer; border-left: 3px solid transparent; }
.lrow:hover { background: var(--bg-hover); }
.lrow.on { background: var(--bg-selected); border-left-color: var(--accent); }
.lrow .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
.lrow .cdot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.lrow .lt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12.5px; color: var(--ink-1); }
.lrow.on .lt { font-weight: 600; }
.lrow .lpin { color: var(--cat-temporary); display: inline-flex; }
.lrow .lpin .icon { width: 11px; height: 11px; }
.lrow .l2 { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink-3); padding-left: 15px; }
.lrow .l2 .tp { background: var(--bg-group); border-radius: 999px; padding: 0 7px; height: 16px;
  display: inline-flex; align-items: center; color: var(--ink-2); max-width: 88px; overflow: hidden; white-space: nowrap; }
.lrow .l2 .spacer { flex: 1; }
.lrow .l2 .lk { color: var(--info); display: inline-flex; align-items: center; gap: 3px; }
.lrow .l2 .lk .icon { width: 10px; height: 10px; }

/* ── 右栏 · 工作台（C 基因，区隔强化：更重阴影 + 独立大卡）── */
.detailpane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg-surface);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-desk); position: relative; overflow: hidden; }
.detailpane::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--accent), transparent 70%); opacity: 0.5; }
.dv-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px 0; }
.cat-tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px;
  font-size: 10.5px; background: var(--cs); color: var(--cc); white-space: nowrap; }
.cat-tag::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--cc); }
.dv-head .spacer { flex: 1; }
.dv-acts { display: flex; gap: 2px; }
.act { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); }
.act:hover { background: var(--bg-hover); color: var(--ink-1); }
.act.on { color: var(--cat-temporary); background: var(--cat-temporary-soft); }
.act .icon { width: 14px; height: 14px; }
.dv-meta { display: flex; gap: 14px; padding: 8px 19px 0; font-size: 11px; color: var(--ink-3); }
.dv-body { flex: 1; overflow-y: auto; padding: 16px 22px 8px; }
.dv-card { background: var(--bg-group); border-radius: var(--radius-md); padding: 22px 24px;
  font-size: 14.5px; line-height: 2; color: var(--ink-1); outline: none; position: relative; }
.dv-card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--cc, var(--accent)); }
.dv-card:focus { background: var(--bg-surface); box-shadow: var(--shadow-card); }
.dv-edithint { font-size: 10.5px; color: var(--ink-3); margin-top: 8px; padding-left: 4px; }
.dv-links { padding: 4px 22px 0; }
.dv-sec { font-size: 11px; color: var(--ink-3); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.linkchip { display: inline-flex; align-items: gap: 6px; height: 26px; padding: 0 10px; margin: 0 6px 6px 0;
  border-radius: 9px; background: var(--bg-group); color: var(--ink-2); font-size: 11.5px; cursor: pointer; }
.linkchip:hover { background: var(--bg-hover); color: var(--ink-1); }
.linkchip .cdot { width: 7px; height: 7px; border-radius: 999px; }
.linkchip .t { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 22px 0; }
.tpill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px;
  background: var(--bg-group); color: var(--ink-2); font-size: 11px; white-space: nowrap; cursor: pointer; }
.tpill:hover { background: var(--bg-hover); color: var(--ink-1); }
.tag-add { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 10px; border-radius: 999px;
  background: var(--bg-group); color: var(--ink-3); font-size: 11px; }
.tag-add:hover { color: var(--ink-1); }
.dv-foot { display: flex; align-items: center; gap: 6px; padding: 12px 16px 14px; border-top: 1px solid var(--bg-group); }
.dv-foot .spacer { flex: 1; }
.btn { height: 28px; padding: 0 12px; border-radius: 9px; font-size: 12px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--bg-hover); color: var(--ink-1); }
.btn .icon { width: 13px; height: 13px; }
.btn.primary { background: var(--accent); color: var(--ink-inverse); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }

/* ── 右栏新建态 ── */
.dv-new { display: none; flex-direction: column; flex: 1; min-height: 0; }
.dv-new.show { display: flex; }
.dv-new .dv-body { display: flex; }
.newcat-row { display: flex; align-items: center; gap: 6px; padding: 12px 22px 0; }
.newcat-row .lbl { font-size: 11px; color: var(--ink-3); }
.nc { height: 24px; padding: 0 11px; border-radius: 999px; background: var(--bg-group); color: var(--ink-2); font-size: 11.5px; }
.nc.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.new-editor { flex: 1; background: var(--bg-group); border-radius: var(--radius-md); padding: 18px 20px;
  font-size: 14px; line-height: 2; color: var(--ink-1); border: none; outline: none; resize: none; min-height: 200px; }
.new-editor:focus { background: var(--bg-surface); box-shadow: var(--shadow-card); }

/* 其他视图占位 / toast */
.alt-view { display: none; padding: 80px 0; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.alt-view.show { display: block; }
.alt-view b { color: var(--ink-2); display: block; margin-bottom: 4px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(8px); z-index: 200;
  background: var(--ink-1); color: var(--ink-inverse); font-size: 12.5px; border-radius: 999px;
  padding: 8px 16px; opacity: 0; pointer-events: none; transition: all 200ms var(--ease-out); }
.toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-head">
      <span style="display:flex;align-items:center;gap:8px"><span class="brand-mark">τ</span><span class="brand-name">Tau</span></span>
    </div>
    <div class="nav-section">
      <div class="nav-label">工作台</div>
      <button class="nav-item"><svg class="icon"><use href="#i-flame"/></svg><span>今日</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-calendar"/></svg><span>日程</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-todo"/></svg><span>待办</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-users"/></svg><span>协作</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">知识</div>
      <button class="nav-item active"><svg class="icon"><use href="#i-layers"/></svg><span>卡片库</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-article"/></svg><span>文章</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-pen"/></svg><span>日记</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-book"/></svg><span>知识库</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-board"/></svg><span>白板</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">学习</div>
      <button class="nav-item"><svg class="icon"><use href="#i-folder"/></svg><span>项目</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-repeat"/></svg><span>闪卡复习</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-help"/></svg><span>问题管理</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">工具</div>
      <button class="nav-item"><svg class="icon"><use href="#i-chart"/></svg><span>统计</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></button>
    </div>
  </nav>
  <div class="resizer"></div>
  <div class="main">
    <header class="titlebar">
      <span class="titlebar-crumb">· 卡片库</span>
      <div class="titlebar-spacer"></div>
      <button class="kbd-pill"><svg class="icon" style="width:13px;height:13px"><use href="#i-search"/></svg>搜索卡片…<kbd>Ctrl K</kbd></button>
      <div class="win-controls"><span class="win-btn"></span><span class="win-btn close"></span></div>
    </header>
    <main style="min-height:0;display:flex;flex-direction:column">
      <div class="toolbar">
        <h1>卡片库</h1>
        <span class="digest num" id="digest"></span>
        <div class="toolbar-spacer"></div>
        <div class="seg" id="seg">
          <button data-view="desk" class="on">工作台</button>
          <button data-view="graph">图谱</button>
          <button data-view="table">表格</button>
        </div>
        <button class="icon-btn" title="导入 Markdown" id="importBtn"><svg class="icon"><use href="#i-import"/></svg></button>
        <button class="new-btn" id="newBtn"><svg class="icon" style="width:13px;height:13px"><use href="#i-plus"/></svg>新建卡片</button>
      </div>

      <!-- 三块面板：标签树 / 时间分组列表 / 工作台 -->
      <section class="desk" id="view-desk">
        <aside class="tagpane" id="tagpane">
          <div class="tagpane-head"><svg class="icon"><use href="#i-tag"/></svg>分类与标签</div>
          <button class="catnode on" data-cat="all"><span class="dot" style="background:var(--accent)"></span>全部卡片<span class="n num" id="n-all"></span></button>
          <button class="catnode" data-cat="temporary"><span class="dot" style="background:var(--cat-temporary)"></span>闪念笔记<span class="n num" id="n-temporary"></span></button>
          <button class="catnode" data-cat="literature"><span class="dot" style="background:var(--cat-literature)"></span>文献笔记<span class="n num" id="n-literature"></span></button>
          <button class="catnode" data-cat="permanent"><span class="dot" style="background:var(--cat-permanent)"></span>永久笔记<span class="n num" id="n-permanent"></span></button>
          <button class="catnode" data-cat="theme"><span class="dot" style="background:var(--cat-theme)"></span>主题笔记<span class="n num" id="n-theme"></span></button>
          <div class="tagsep"></div>
          <div id="tagtree"></div>
        </aside>

        <div class="listpane">
          <div class="list-head">
            <span id="listTitle">全部卡片</span><span class="num" id="listCount"></span>

<script>
/* ── mock 数据（三方案同口径）── */
const CAT = {
  temporary:  { name: "闪念", full: "闪念笔记", c: "var(--cat-temporary)",  cs: "var(--cat-temporary-soft)" },
  literature: { name: "文献", full: "文献笔记", c: "var(--cat-literature)", cs: "var(--cat-literature-soft)" },
  permanent:  { name: "永久", full: "永久笔记", c: "var(--cat-permanent)",  cs: "var(--cat-permanent-soft)" },
  theme:      { name: "主题", full: "主题笔记", c: "var(--cat-theme)",      cs: "var(--cat-theme-soft)" },
};
const C = (id, cat, tags, words, grp, date, text, links = []) => ({ id, cat, tags, words, grp, date, text, links });
const CARDS = [
  Object.assign(C(1, "permanent", ["卡片盒", "方法论"], 212, "today", "09-20",
    "知识的复利来自连接而非收集。收集创造库存，连接创造利息；而库存是要付仓储成本的——每一次「以后再看」，都是一笔记在未来自己账上的负债。", [12, 20, 25]), { top: true }),
  Object.assign(C(2, "theme", ["读书/卡片笔记", "卡片盒"], 186, "today", "09-20",
    "MOC · 卡片盒方法总览。卢曼的秘密不在卡片，在编号：编号是思想的坐标系，没有地址的思想等于不存在。本卡作索引页，串起四条主线——原子化、编号、连接、反刍。", [12, 20, 25, 30]), { top: true }),
  C(3, "temporary", ["写作"], 64, "today", "09-20", "写作是思考的显影：脑子里的念头是高清的，落到纸上全是噪点。把信噪比提到别人能读懂的程度，就是写作全部的工作量。"),
  C(4, "temporary", ["卡片盒"], 52, "today", "09-20", "三条闪念没有归属标签，先挂在「卡片盒」待整理——周五盘点时统一决定去留，不让 inbox 变成仓库。"),
  C(5, "literature", ["读书/文明"], 148, "today", "09-20", "《文明》第二季第 4 期：地理是文明的硬约束。大河的走向决定了粮食的分布，粮食的分布决定了城市的选址，城市的选址决定了帝国扩张的方向。", [22]),
  C(6, "permanent", ["认知/记忆"], 172, "today", "09-20", "流畅感是记忆最大的骗子：重读时越顺，说明线索越熟；而线索的熟悉，恰恰掩盖了提取的生疏。检验记住与否的唯一标准，是合上书还能不能复述。", [13, 29]),
  C(7, "temporary", ["认知/注意力"], 38, "yesterday", "09-19", "注意力残留：每次切换后，残留的思绪要 15 分钟才消散。", [17, 19]),
  C(8, "temporary", ["工具流"], 45, "yesterday", "09-19", "写脚本自动化一件一年只做三次的事，纯粹因为第三次手动做的时候忍无可忍。值吗？值。"),
  C(9, "literature", ["读书/卡片笔记"], 156, "yesterday", "09-19", "《卡片笔记写作法》重读：闪念卡片与文献卡片是两条不同的产线——前者记录自己的念头，后者摘录他人的论述。混在一起，就是灾难的开始。"),
  C(10, "permanent", ["方法论"], 168, "yesterday", "09-19", "我理解的「慢就是快」：快是跳过理解直达答案，慢是让每一步都踩实。跳过的部分不会消失，总会在下一个路口等你，而且利息不低。"),
  C(11, "temporary", ["写作"], 30, "yesterday", "09-19", "标题先写最烂的那版。烂标题是占位符，好标题是承诺——别在一开始就许诺。"),
  C(12, "permanent", ["卡片盒"], 194, "week", "09-17", "原子化不是碎片化。一张卡片只承载一个论点，论证材料放在链接的另一端；「一卡一事」牺牲的是单卡的完整感，换来的是复用与重组的自由。", [1, 2]),
  C(13, "temporary", ["认知/记忆"], 44, "week", "09-17", "间隔重复的最优间隔并不存在——算法能给的是兜底，不是最优。", [6]),
  C(14, "literature", ["读书/文明"], 132, "week", "09-16", "《文明》第二季第 3 期摘录：盐铁之辩的本质不是经济问题，是中央与地方的权力边界问题。财政工具从来都是政治工具。"),
  C(15, "permanent", ["写作"], 158, "week", "09-16", "写长文先搭骨架。大纲是叙述的顺序，骨架是论证的顺序——先立论点，再排证据，最后才是修辞。骨架立住之后，写作变成填空。"),
  C(16, "temporary", ["方法论"], 36, "week", "09-15", "模板每次变复杂一点，写的时候反而更快一点。约束本身就是脚手架。"),
  C(17, "permanent", ["认知/注意力"], 176, "week", "09-15", "深度工作的环境设计清单：手机放另一个房间、通知全关、任务写在纸上而非屏幕上、开始前倒一杯水。全部是为了让「切换」这件事变贵。", [7, 19]),
  C(18, "literature", ["读书/卡片笔记"], 141, "week", "09-14", "渐进式总结的第二遍不是压缩，是改写。用自己的话重述时丢失的那部分，恰恰是还没理解的部分——丢失率就是理解率的反面。"),
  C(19, "temporary", ["认知/注意力"], 47, "week", "09-14", "通知全关第七天：戒断反应消失，第一次出现连续三小时的沉浸。", [17]),
  C(20, "permanent", ["卡片盒"], 165, "week", "09-13", "编号是思想的坐标系。卢曼给每张卡片一个不重复的地址，新卡片插在旧卡片的缝隙里（21/3a），位置本身就是语境。", [2, 1]),
  C(21, "temporary", ["写作"], 41, "month", "09-08", "晨间随笔第 30 天：前二十天产出的是情绪垃圾，后十天偶尔出现一句真话。真话率 5%，值回全部时间。"),
  C(22, "literature", ["读书/文明"], 120, "month", "09-05", "《文明》第二季第 2 期摘录：造纸术西传的真正意义不是知识变便宜，而是「删改」变可能——可修改的媒介才有版本的概念。", [5]),
  C(23, "permanent", ["方法论"], 149, "month", "09-03", "费曼技巧实践：向想象中的听众解释「为什么卡片要原子化」，讲到第三句就卡壳。卡住的地方，就是理解的边界；边界比知识本身更有价值。"),
  C(24, "temporary", ["工具流"], 58, "month", "09-01", "「素材库」改叫「引文池」之后，往里丢东西前会多想一秒——命名在悄悄塑造行为。"),
  C(25, "permanent", ["卡片盒"], 172, "month", "08-28", "链接的价值不在建立的瞬间，而在三个月后你在完全不同的语境里撞见它的那次意外。双链笔记的涌现结构，需要的是时间和足够的节点密度。", [1]),
  C(26, "temporary", ["卡片盒"], 49, "month", "08-25", "孤儿链接三条：指向已删除卡片的链接没有清理。盘点清单再 +1。"),
  C(27, "permanent", ["写作"], 134, "month", "08-22", "给重要文章定一个「复读日」：好书读两遍胜过读两本。第二遍带着第一遍留下的问题去读，密度完全不同。"),
  C(28, "literature", ["读书/卡片笔记"], 128, "month", "08-18", "文献卡片纪律：只记语境，不改写。原文摘录 + 页码 + 当时为什么摘它，三条缺一不可；改写是永久卡片阶段的事。"),
  C(29, "temporary", ["认知/记忆"], 52, "month", "08-15", "回忆式复习第二个月：「想不起来」的痛苦指数断崖式下降——原来提取本身是可以训练的。", [6]),
  C(30, "permanent", ["卡片盒"], 181, "month", "08-12", "反对自己的卡片：肌肉在对抗中生长，思维在反驳中生长。照抄一百张卡片，不如愤怒地反驳一张——反驳逼你亮出自己的论点。", [2]),
  C(31, "temporary", ["工具流"], 63, "earlier", "07-30", "小而钝的工具：大而全的工具替你做决定，小而钝的工具逼你面对自己的流程。后者往往更能留下东西。"),
  C(32, "literature", ["读书/文明"], 137, "earlier", "07-21", "《文明》第二季第 1 期摘录：文明的第一驱动力是「讲故事的能力」——超过 150 人的协作，靠的不是熟悉，而是共同的叙事。"),
  C(33, "permanent", ["写作"], 129, "earlier", "07-14", "手机写作的秘诀是放弃编辑：只管往前写，格式、错字、结构全部留给回桌面后的自己。先有素材，再谈加工。"),
  C(34, "temporary", ["方法论"], 55, "earlier", "07-06", "公开学习最难的不是被批评，而是忍受「这还不成熟」的羞耻感。但它确实加速了迭代。"),
  C(35, "permanent", ["认知/记忆"], 163, "earlier", "06-28", "提取练习优于重读：测试效应的证据很扎实——主动提取一次的记忆留存，是被动重读三次的三倍，尽管重读的感觉更好。", [6]),
  C(36, "theme", ["卡片盒", "写作"], 158, "earlier", "06-15", "MOC · 写作主题索引：写作即思考的显影、骨架先于修辞、烂标题是占位符、复读日的密度。本卡是「写作」标签的地图页，回答「关于写作我写过什么」。", [3, 15, 21, 27, 33]),
];
const GRPS = [["pinned", "置顶"], ["today", "今天"], ["yesterday", "昨天"], ["week", "本周"], ["month", "本月"], ["earlier", "更早"]];
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));

const state = { cat: "all", tag: "", sel: 1 };
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

$("#digest").innerHTML = `<b class="num">${CARDS.length}</b> 张 · <b class="num">${CARDS.reduce((s, c) => s + c.words, 0).toLocaleString()}</b> 字`;
["all", "temporary", "literature", "permanent", "theme"].forEach(k => {
  $("#n-" + k).textContent = k === "all" ? CARDS.length : CARDS.filter(c => c.cat === k).length;
});

/* ── 左栏 · 标签树（层级派生 + 计数）── */
function buildTree() {
  const root = { kids: {}, n: 0 };
  CARDS.forEach(c => c.tags.forEach(t => {
    let node = root; node.n++;
    t.split("/").forEach(seg => { node = node.kids[seg] || (node.kids[seg] = { kids: {}, n: 0, name: seg }); node.n++; });
  }));
  return root;
}
function renderTree() {
  const tree = buildTree(), el = $("#tagtree");
  el.innerHTML = "";
  const mk = (path, node) => {
    const wrap = document.createElement("div"); wrap.className = "tnode-wrap";
    const hasKids = Object.keys(node.kids).length > 0;
    const btn = document.createElement("button"); btn.className = "tnode" + (state.tag === path ? " on" : "");
    btn.innerHTML = `<span class="caret ${hasKids ? "" : "flat"}"><svg class="icon" style="width:11px;height:11px"><use href="#i-cheeright"/></svg></span>
      <span class="name">${esc(node.name)}</span><span class="n num">${node.n}</span>`;
    btn.onclick = e => {
      if (hasKids && e.target.closest(".caret")) { wrap.classList.toggle("open"); return; }
      state.tag = state.tag === path ? "" : path;
      renderTree(); render();
    };
    if (hasKids && state.tag && state.tag.startsWith(path + "/")) wrap.classList.add("open");
    wrap.appendChild(btn);
    if (hasKids) {
      const kids = document.createElement("div"); kids.className = "kids";
      Object.values(node.kids).forEach(k => kids.appendChild(mk(path ? path + "/" + k.name : k.name, k)));
      wrap.appendChild(kids);
    }
    return wrap;
  };
  Object.values(tree.kids).forEach(k => el.appendChild(mk(k.name, k)));
}

/* ── 中栏 · 时间分组列表（B 基因：置顶/今天/昨天/本周/本月/更早）── */
function filtered() {
  return CARDS.filter(c => {
    if (state.cat !== "all" && c.cat !== state.cat) return false;
    if (state.tag && !c.tags.some(t => t === state.tag || t.startsWith(state.tag + "/"))) return false;
    return true;
  });
}
function render() {
  const list = filtered();
  const groups = GRPS.map(([k, label]) => ({
    label, items: k === "pinned" ? list.filter(c => c.top) : list.filter(c => !c.top && c.grp === k),
  })).filter(g => g.items.length);
  $("#listBody").innerHTML = groups.map(g => `
    <div class="lgroup"><b>${g.label}</b><span class="num">${g.items.length}</span></div>
    ${g.items.map(c => `
      <div class="lrow ${c.id === state.sel ? "on" : ""}" data-id="${c.id}">
        <div class="l1">
          <span class="cdot" style="background:${CAT[c.cat].c}"></span>
          <span class="lt">${esc(c.text.split("。")[0])}。</span>
          ${c.top ? `<span class="lpin" title="已置顶"><svg class="icon"><use href="#i-pin"/></svg></span>` : ""}
        </div>
        <div class="l2">
          ${c.tags.slice(0, 2).map(t => `<span class="tp">${esc(t)}</span>`).join("")}
          <span class="spacer"></span>
          ${c.links.length ? `<span class="lk"><svg class="icon"><use href="#i-link"/></svg>${c.links.length}</span>` : ""}
          <span class="num">${c.words} 字 · ${c.date}</span>
        </div>
      </div>`).join("")}`).join("");
  $("#listBody").querySelectorAll(".lrow").forEach(r => r.onclick = () => select(+r.dataset.id));
  $("#listCount").textContent = "· " + list.length + " 张";
  $("#listTitle").textContent = state.tag ? state.tag : state.cat === "all" ? "全部卡片" : CAT[state.cat].full + "笔记";
  $("#empty").classList.toggle("show", list.length === 0);
  $("#status-count").textContent = CARDS.length + " 张卡片";
  if (!list.find(c => c.id === state.sel) && list.length) state.sel = list[0].id;
  renderDetail();
}

/* ── 右栏 · 工作台（预览即编辑）── */
function renderDetail() {
  const c = byId[state.sel]; if (!c) return;
  $("#pv-cat").outerHTML = `<span class="cat-tag" id="pv-cat" style="--cc:${CAT[c.cat].c};--cs:${CAT[c.cat].cs}">${CAT[c.cat].full}</span>`;
  $("#pv-created").textContent = "创建于 2026-" + c.date;
  $("#pv-updated").textContent = "最后修改 2026-" + c.date;
  $("#pv-words").textContent = c.words + " 字";
  $("#pv-text").textContent = c.text;
  $("#pv-text").style.setProperty("--cc", CAT[c.cat].c);
  $("#pv-top").classList.toggle("on", c.top);
  $("#pv-links").innerHTML = c.links.length
    ? `<div class="dv-sec"><svg class="icon" style="width:12px;height:12px"><use href="#i-link"/></svg>链接 ${c.links.length} 张</div>` +
      c.links.map(t => { const tc = byId[t]; return tc
        ? `<button class="linkchip" data-id="${t}"><span class="cdot" style="background:${CAT[tc.cat].c}"></span><span class="t">${esc(tc.text.split("。")[0])}。</span></button>` : ""; }).join("")
    : "";
  $("#pv-links").querySelectorAll(".linkchip").forEach(b => b.onclick = () => select(+b.dataset.id));
  $("#pv-tags").innerHTML = `<div class="dv-sec" style="width:100%"><svg class="icon" style="width:12px;height:12px"><use href="#i-tag"/></svg>标签</div>` +
    c.tags.map(t => `<span class="tpill" data-t="${esc(t)}" title="点击移除">${esc(t)} ×</span>`).join("") +
    `<button class="tag-add" id="tagAdd"><svg class="icon" style="width:11px;height:11px"><use href="#i-plus"/></svg>添加</button>`;
  $("#pv-tags").querySelectorAll(".tpill").forEach(el => el.onclick = () => {
    c.tags = c.tags.filter(t => t !== el.dataset.t); renderTree(); render();
  });
  $("#tagAdd").onclick = () => {
    const t = prompt("新标签（支持 a/b 层级）");
    if (t && !c.tags.includes(t)) { c.tags.push(t); renderTree(); render(); }
  };
}
function select(id) {
  state.sel = id;
  $("#listBody").querySelectorAll(".lrow").forEach(r => r.classList.toggle("on", +r.dataset.id === id));
  $("#dvNew").classList.remove("show");
  $("#dvView").style.display = "";
  renderDetail();
}

/* ── 左栏事件 ── */
$("#tagpane").querySelectorAll(".catnode").forEach(b => b.onclick = () => {
  state.cat = b.dataset.cat;
  $("#tagpane").querySelectorAll(".catnode").forEach(x => x.classList.toggle("on", x === b));
  render();
});

/* ── 工作台操作 ── */
$("#pv-top").onclick = () => { const c = byId[state.sel]; c.top = !c.top; render(); toast(c.top ? "已置顶" : "已取消置顶"); };
$("#pv-export").onclick = () => toast("导出：Markdown / 图片 / EPUB / PDF（Dialog）");
$("#pv-delete").onclick = () => toast("删除确认：MobileConfirmDialog 同款浮层");
$("#pv-detail").onclick = () => toast("进入详情：navigator.push(card-detail/" + state.sel + ")");
$("#pv-graph").onclick = () => toast("切到图谱视图并定位该节点");
$("#view-desk").addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (!act) return;
  if (act.dataset.act === "present") toast("演示模式：PresentationMode 全屏");
  if (act.dataset.act === "window") toast("窗口打开（仅 Electron 渲染）");
});

/* ── 新建态（工作台内完成，弹窗废除）── */
let newCat = "temporary", newTags = [];
$("#newBtn").onclick = () => {
  $("#dvView").style.display = "none";
  $("#dvNew").classList.add("show");
  $("#newText").focus();
};
$("#newCatRow").querySelectorAll(".nc").forEach(b => b.onclick = () => {
  newCat = b.dataset.cat;
  $("#newCatRow").querySelectorAll(".nc").forEach(x => x.classList.toggle("on", x === b));
});
function promptTag() {
  const t = prompt("新标签（支持 a/b 层级）");
  if (t && !newTags.includes(t)) { newTags.push(t); renderNewTags(); }
}
function renderNewTags() {
  $("#newTags").innerHTML = `<div class="dv-sec" style="width:100%"><svg class="icon" style="width:12px;height:12px"><use href="#i-tag"/></svg>标签</div>` +
    newTags.map(t => `<span class="tpill" data-t="${esc(t)}" title="点击移除">${esc(t)} ×</span>`).join("") +
    `<button class="tag-add" id="newTagAdd"><svg class="icon" style="width:11px;height:11px"><use href="#i-plus"/></svg>添加</button>`;
  $("#newTags").querySelectorAll(".tpill").forEach(el => el.onclick = () => { newTags = newTags.filter(t => t !== el.dataset.t); renderNewTags(); });
  $("#newTagAdd").onclick = promptTag;
}
function closeNew() {
  $("#dvNew").classList.remove("show");
  $("#dvView").style.display = "";
  $("#newText").value = ""; newTags = []; renderNewTags();
}
function saveNew() {
  const text = $("#newText").value.trim();
  if (!text) { toast("卡片内容为空"); return; }
  const id = Math.max(...CARDS.map(c => c.id)) + 1;
  CARDS.unshift(Object.assign(C(id, newCat, [...newTags], text.length, "today", "09-20", text), { top: false }));
  state.sel = id; state.cat = "all"; state.tag = "";
  $("#tagpane").querySelectorAll(".catnode").forEach(x => x.classList.toggle("on", x.dataset.cat === "all"));
  closeNew(); renderTree(); render();
  toast("已保存：新卡片 #" + id + "（cardEventBus 广播 card:created）");
}
$("#newCancel").onclick = closeNew;
$("#newSave").onclick = saveNew;

/* ── 键盘：↑↓ 浏览 + ↵ 选中（新建态 Ctrl ↵ 保存 / Esc 放弃）── */
document.addEventListener("keydown", e => {
  if ($("#dvNew").classList.contains("show")) {
    if (e.key === "Escape") closeNew();
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveNew(); }
    return;
  }
  const t = e.target;
  if (t.closest && t.closest("input, textarea, [contenteditable]")) return;
  const rows = [...document.querySelectorAll(".lrow[data-id]")];
  if (!rows.length) return;
  const cur = rows.findIndex(r => +r.dataset.id === state.sel);
  if (e.key === "ArrowDown") { e.preventDefault(); const n = Math.min(rows.length - 1, cur + 1); select(+rows[n].dataset.id); rows[n].scrollIntoView({ block: "nearest" }); }
  if (e.key === "ArrowUp") { e.preventDefault(); const n = Math.max(0, cur - 1); select(+rows[n].dataset.id); rows[n].scrollIntoView({ block: "nearest" }); }
});

/* ── 视图切换 ── */
$("#seg").querySelectorAll("button").forEach(b => b.onclick = () => {
  $("#seg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  const isDesk = b.dataset.view === "desk";
  $("#view-desk").style.display = isDesk ? "" : "none";
  const alt = $("#view-alt");
  alt.classList.toggle("show", !isDesk);
  alt.innerHTML = isDesk ? "" : `<b>${b.textContent}视图</b>与方案 A 同源：图谱 = LinkGraph（links + 内联链接成边，点击节点预览）；表格 = Database 组件（四型视图 / 行内编辑 / 列宽持久化）。`;
  $("#status-view").textContent = "视图 · " + b.textContent.trim();
});

$("#importBtn").onclick = () => toast("导入 Markdown：多选文件 → importFromMarkdown 逐张建卡");

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

renderTree(); renderNewTags(); render();
</script>
</body>
</html>
