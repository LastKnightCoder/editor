<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<title>卡片库 · 方案 A1 卡片墙·时间分组 — Tau 桌面端</title>
<!--
  【视觉参考，非导出源】（D-001）：mockup 用于对照评审，落地时样式迁移组件 Tailwind。
  方案 A1 · 卡片墙 + 时间分组（第三轮裁决：回到 A，叠加 B 的分组）：
  A 的骨架全部保留——左侧层级标签树、多列卡片墙、置顶双列宽横卡、四分类色点、
  图谱 / 表格视图切换、预览弹窗（可编辑）；在此之上按 置顶/今天/昨天/本周/本月/更早 分段，
  每段一个 sticky 分组头（计数随筛选联动），段内各自等高网格（不跨组补位）。
  时间锚点与滚动浏览兼得；工具栏搜索框做<b>当前列表轻量筛选</b>（与 titlebar
  Ctrl K 全局语义搜索并存，定位不同）；<b>容器级响应式</b>：卡片墙为纯 CSS 等高网格
  （auto-fill + minmax(min(100%,292px),1fr)，对齐文章页 A3 做法）——同行卡片 stretch
  等高（杜绝参差与 resize 跳列抖动），列数由 grid 引擎按容器宽增减（侧边栏收起/展开 /
  窄窗口统一覆盖，窄于单卡宽自然降单列，无 JS observer、无 @container——
  auto-fill 网格本身即容器级响应）；置顶横卡同法 auto-fit；数据层：LIMIT 渐进拉取。
-->
<style>
:root {
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
[data-theme="cream"] {
  color-scheme: light;
  --bg-page: #f3eee2; --bg-surface: #fffdf9; --bg-group: #faf6ec; --bg-sunken: #ece5d4;
  --bg-hover: rgba(67,57,44,0.05); --bg-selected: rgba(217,119,87,0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217,119,87,0.12); --accent-text: #b85f42;
  --ok: #61795f; --warn: #a38c4d; --info: #5c7d99;
  --shadow-card: 0 1px 2px rgba(120,100,70,0.05), 0 10px 24px -14px rgba(120,100,70,0.18);
  --cat-temporary: #c96f4e; --cat-temporary-soft: rgba(201,111,78,0.11);
  --cat-literature: #5c7d99; --cat-literature-soft: rgba(92,125,153,0.12);
  --cat-permanent: #61795f; --cat-permanent-soft: rgba(97,121,95,0.13);
  --cat-theme: #a38c4d; --cat-theme-soft: rgba(163,140,77,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 880px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; }
.icon { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ── 融合壳层（sidebar 可收起：容器级响应式演示）── */
.app { display: grid; grid-template-columns: 218px 4px minmax(0,1fr); grid-template-rows: 100vh;
  grid-template-areas: "sidebar resizer main"; transition: grid-template-columns 200ms var(--ease-out); }
.app.collapsed { grid-template-columns: 64px 4px minmax(0,1fr); }
.app.collapsed .nav-label, .app.collapsed .nav-item > span { display: none; }
.app.collapsed .nav-item { justify-content: center; padding: 0; }
.app.collapsed .sidebar-head { flex-direction: column; height: auto; min-height: 46px; padding: 8px 2px; }
.app.collapsed .brand-row, .app.collapsed .brand-name { display: none; }
.collapse-btn { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  color: var(--ink-3); margin-left: auto; flex: none; }
.collapse-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
.sidebar { grid-area: sidebar; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-head { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; margin-bottom: 6px; flex: none; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13.5px; }
.nav-section { margin-top: 12px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13px; text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { background: var(--bg-hover); color: var(--ink-1); font-weight: 500; position: relative; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.resizer { grid-area: resizer; }
.main { grid-area: main; display: grid; grid-template-rows: 46px minmax(0,1fr) 30px; min-width: 0; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.titlebar-crumb { color: var(--ink-2); font-size: 12.5px; }
.titlebar-spacer { flex: 1; }
.kbd-pill { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--ink-2); font-size: 12px; }
kbd { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-group); color: var(--ink-2);
  font-size: 11px; font-family: ui-monospace, Consolas, monospace; display: inline-flex; align-items: center; }
.win-controls { display: flex; gap: 2px; margin-left: 4px; }
.win-btn { width: 36px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.win-btn:hover { background: var(--bg-hover); }
.win-btn.close:hover { background: #c25450; color: #fff; }
.content { overflow-y: auto; }
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--ink-3); font-size: 11.5px; }
.statusbar .sync { display: flex; align-items: center; gap: 6px; }
.statusbar .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.statusbar-spacer { flex: 1; }

/* ══ 卡片库 · 方案 A1 卡片墙 + 时间分组 ══ */
.wrap { max-width: 1760px; margin: 0 auto; padding: 20px 26px 60px; }
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 2px 0 12px; background: var(--bg-page); }
.toolbar h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar .digest { font-size: 12px; color: var(--ink-2); }
.toolbar .digest b { color: var(--ink-1); font-weight: 600; }
.toolbar-spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; width: 220px; height: 30px; padding: 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--ink-3);
  transition: width 200ms var(--ease-out); }
.search:focus-within { width: 280px; }
.search input { flex: 1; border: none; outline: none; background: none; font-size: 12.5px; color: var(--ink-1); }
.search input::placeholder { color: var(--ink-3); }
.seg { display: flex; align-items: center; gap: 2px; background: var(--bg-surface); border-radius: 10px;
  padding: 3px; box-shadow: var(--shadow-card); }
.seg button { height: 24px; padding: 0 11px; border-radius: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink-1); }
.seg button.on { background: var(--bg-group); color: var(--ink-1); font-weight: 500; }
.icon-btn { width: 30px; height: 30px; border-radius: 999px; background: var(--bg-surface); box-shadow: var(--shadow-card);
  display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink-1); }
.new-btn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 14px;
  background: linear-gradient(145deg, var(--accent-hover), var(--accent)); color: var(--ink-inverse);
  border-radius: 999px; font-size: 12.5px; font-weight: 600;
  box-shadow: 0 4px 14px rgba(201,106,76,0.35), 0 1px 2px rgba(120,100,70,0.1); }
.new-btn:hover { transform: translateY(-1px); }
.new-btn:active { transform: none; }

/* 筛选行：分类 chips + 标签面包屑 */
.filter-row { position: sticky; top: 44px; z-index: 19; display: flex; align-items: center; gap: 6px;
  padding-bottom: 10px; background: var(--bg-page); }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px;
  border-radius: 999px; background: var(--bg-surface); box-shadow: var(--shadow-card);
  font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.chip .n { font-size: 11px; color: var(--ink-3); }
.chip:hover { color: var(--ink-1); }
.chip.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.chip.on .n { color: var(--accent-text); }
.tag-crumb { display: none; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 12px; margin-left: 4px;
  border-radius: 999px; background: var(--bg-selected); color: var(--ink-1); font-size: 12.5px; }
.tag-crumb.show { display: inline-flex; }
.tag-crumb .x { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2); }
.tag-crumb .x:hover { background: var(--bg-hover); }
.filter-row .count { margin-left: auto; font-size: 12px; color: var(--ink-3); }

/* 主体：标签树 + 分组卡片墙 */
.body-grid { display: grid; grid-template-columns: 236px minmax(0,1fr); gap: 20px; align-items: start; }

/* 标签树（面板撑满可用高度，树内容在面板内滚动） */
.tagtree { position: sticky; top: 96px; height: calc(100vh - 184px); display: flex; flex-direction: column;
  background: var(--bg-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); padding: 12px 8px; overflow: hidden; }
.tagtree-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.tagtree-head { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; color: var(--ink-3); font-size: 11.5px; }
.tagtree-head .icon { width: 13px; height: 13px; }
.tnode { display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 8px;
  border-radius: 8px; color: var(--ink-2); font-size: 12.5px; text-align: left; }
.tnode:hover { background: var(--bg-hover); color: var(--ink-1); }
.tnode.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.tnode .caret { width: 14px; height: 14px; display: grid; place-items: center; color: var(--ink-3);
  transition: transform 150ms var(--ease-out); }
.tnode .caret.flat { visibility: hidden; }
.tnode.open > .caret { transform: rotate(90deg); }
.tnode .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tnode .n { font-size: 11px; color: var(--ink-3); }
.tnode .kids { margin-left: 13px; border-left: 1px solid var(--bg-sunken); padding-left: 4px; display: none; }
.tnode-wrap.open > .kids { display: block; }

/* 时间分组头（B 基因：sticky 于筛选行下方） */
.tgroup-head { position: sticky; top: 86px; z-index: 14; display: flex; align-items: baseline; gap: 8px;
  padding: 10px 4px 8px; background: var(--bg-page); }
.tgroup-head b { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tgroup-head .num { font-size: 11px; color: var(--ink-3); }
.tgroup-head .line { flex: 1; height: 1px; background: var(--bg-sunken); align-self: center; }

/* 主列容器（列数自适应由内部 grid auto-fill 承担） */
#wallColumn { min-width: 0; }

/* 置顶横卡（auto-fit 随容器宽升降列，窄容器降单列） */
.featured-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; margin-bottom: 10px; }
.featured { position: relative; display: flex; gap: 14px; background: var(--bg-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); padding: 16px 18px; cursor: pointer; overflow: hidden;
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
.featured:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(120,100,70,0.06), 0 16px 36px -16px rgba(120,100,70,0.26); }
.featured::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cc, var(--accent)); }
.featured .pin-flag { position: absolute; top: 12px; right: 14px; width: 22px; height: 22px; border-radius: 999px;
  background: var(--cat-temporary-soft); color: var(--cat-temporary); display: grid; place-items: center; }
.featured .pin-flag .icon { width: 12px; height: 12px; }
.featured .f-main { flex: 1; min-width: 0; }
.featured .f-text { font-size: 14px; line-height: 1.75; color: var(--ink-1); margin: 6px 0 10px; }
.featured .f-sub { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 10px; }

/* 组内卡片网格：等高并列（grid stretch，同行拉齐）+ auto-fill 容器级自适应——
   列数由 grid 引擎按容器宽增减（侧边栏收起/窄窗口统一覆盖），窄于 292px 自然降单列；
   不用 JS 分配（高度不齐 + resize 跳列抖动） */
.wall { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 288px), 1fr)); align-items: stretch; }
.card { position: relative; background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card);
  padding: 13px 14px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
.card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(120,100,70,0.06), 0 16px 36px -16px rgba(120,100,70,0.26); }
.card-head { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.cat-tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px;
  font-size: 10.5px; background: var(--cs); color: var(--cc); white-space: nowrap; }
.cat-tag::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--cc); }
.card-head .pin-mini { color: var(--cat-temporary); display: inline-flex; }
.card-head .pin-mini .icon { width: 12px; height: 12px; }
.card-head .spacer { flex: 1; }
.card-acts { display: flex; gap: 2px; opacity: 0; transition: opacity 120ms; }
.card:hover .card-acts, .card:focus-within .card-acts { opacity: 1; }
.act { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); }
.act:hover { background: var(--bg-hover); color: var(--ink-1); }
.act .icon { width: 13.5px; height: 13.5px; }
.card-text { flex: 1; font-size: 12.5px; line-height: 1.7; color: var(--ink-1); }
.card-text.quote { position: relative; padding-left: 10px; border-left: 2px solid var(--cat-literature-soft); color: var(--ink-2); }
.card-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tpill { display: inline-flex; align-items: center; height: 18px; padding: 0 8px; border-radius: 999px;
  background: var(--bg-group); color: var(--ink-2); font-size: 10.5px; white-space: nowrap; }
.card-foot .spacer { flex: 1; }
.card-meta { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.card-meta .lk { display: inline-flex; align-items: center; gap: 3px; color: var(--info); }
.card-meta .lk .icon { width: 11px; height: 11px; }

/* 空态 / 加载尾 */
.empty { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 72px 0; color: var(--ink-3); }
.empty.show { display: flex; }
.empty b { color: var(--ink-2); font-size: 14px; }
.sentinel { display: flex; justify-content: center; padding: 22px 0 4px; color: var(--ink-3); font-size: 11.5px; }

/* ── 图谱视图 ── */
.graph-stage { position: relative; height: calc(100vh - 220px); min-height: 460px; background: var(--bg-surface);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
.graph-tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.graph-tools .icon-btn { background: var(--bg-group); }
.graph-legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 12px; font-size: 11px; color: var(--ink-3);
  background: var(--bg-group); border-radius: 999px; padding: 4px 12px; }
.graph-legend i { width: 7px; height: 7px; border-radius: 999px; display: inline-block; margin-right: 4px; }
.graph-hint { position: absolute; left: 14px; top: 12px; font-size: 11px; color: var(--ink-3);
  background: var(--bg-group); border-radius: 999px; padding: 4px 12px; }
.gnode { cursor: pointer; }
.gnode circle { stroke: var(--bg-surface); stroke-width: 2.5; }
.gnode text { font-size: 11px; fill: var(--ink-2); text-anchor: middle; }
.gnode:hover circle { stroke: var(--accent); }
.gedge { stroke: rgba(120,100,70,0.25); stroke-width: 1.2; }

/* ── 表格视图 ── */
.db-tabs { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; }
.db-tab { height: 28px; padding: 0 13px; border-radius: 9px; font-size: 12.5px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px; background: var(--bg-surface); box-shadow: var(--shadow-card); }
.db-tab:hover { color: var(--ink-1); }
.db-tab.on { background: var(--bg-selected); color: var(--ink-1); font-weight: 600; }
.db-add { width: 28px; height: 28px; border-radius: 9px; background: var(--bg-surface); box-shadow: var(--shadow-card);
  display: grid; place-items: center; color: var(--ink-3); }
.db-add:hover { color: var(--ink-1); }
.db-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--bg-surface);
  border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; font-size: 12.5px; }
.db-table th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--bg-group);
  padding: 9px 14px; border-bottom: 1px solid var(--bg-sunken); white-space: nowrap; }
.db-table td { padding: 9px 14px; border-bottom: 1px solid var(--bg-group); color: var(--ink-2); vertical-align: middle; }
.db-table tr:last-child td { border-bottom: none; }
.db-table tr:hover td { background: var(--bg-hover); }
.db-table tr { cursor: pointer; }
.db-title { color: var(--ink-1); font-weight: 500; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.db-row-add td { color: var(--ink-3); cursor: pointer; }
.db-row-add:hover td { color: var(--ink-1); }
.db-placeholder { display: none; padding: 72px 0; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.db-placeholder.show { display: block; }
.db-placeholder b { color: var(--ink-2); display: block; margin-bottom: 4px; font-size: 14px; }

/* ── 预览弹窗 ── */
.overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  background: rgba(67,57,44,0.32); backdrop-filter: blur(3px); }
.overlay.show { display: flex; }
.modal { width: 680px; max-width: calc(100vw - 60px); max-height: calc(100vh - 80px); display: flex; flex-direction: column;
  background: var(--bg-surface); border-radius: var(--radius-lg);
  box-shadow: 0 24px 64px -24px rgba(67,57,44,0.4); animation: pop 200ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
.m-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px 0; }
.m-head .meta { display: flex; gap: 12px; margin-left: 6px; font-size: 11px; color: var(--ink-3); }
.m-head .spacer { flex: 1; }
.m-body { padding: 14px 18px 4px; overflow-y: auto; }
.m-text { font-size: 14.5px; line-height: 1.9; color: var(--ink-1); outline: none; min-height: 120px; }
.m-text:focus { background: var(--bg-group); border-radius: 8px; }
.m-edithint { font-size: 10.5px; color: var(--ink-3); margin-top: 8px; }
.m-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 12px 18px 16px; }
.m-tags .tpill { height: 22px; font-size: 11px; cursor: pointer; }
.m-tags .tpill:hover { background: var(--bg-hover); }

const state = { view: "wall", cat: "all", tag: "", q: "" };
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ── 标签树 ── */
function buildTree() {
  const root = { kids: {}, n: 0 };
  CARDS.forEach(c => c.tags.forEach(t => {
    let node = root; node.n++;
    t.split("/").forEach(seg => { node = node.kids[seg] || (node.kids[seg] = { kids: {}, n: 0, name: seg }); node.n++; });
  }));
  return root;
}
function renderTree() {
  const tree = buildTree();
  const rootEl = $("#tagtreeScroll");
  rootEl.querySelectorAll(".tnode-wrap").forEach(e => e.remove());
  let totalTop = 0; Object.values(tree.kids).forEach(k => totalTop += k.n);
  $("#tagTotal").textContent = totalTop + " 组";
  const mk = (path, node) => {
    const wrap = document.createElement("div"); wrap.className = "tnode-wrap";
    const hasKids = Object.keys(node.kids).length > 0;
    const btn = document.createElement("button"); btn.className = "tnode" + (state.tag === path ? " on" : "");
    btn.innerHTML = `<span class="caret ${hasKids ? "" : "flat"}"><svg class="icon" style="width:11px;height:11px"><use href="#i-cheeright"/></svg></span>
      <span class="name">${esc(node.name)}</span><span class="n num">${node.n}</span>`;
    btn.onclick = e => {
      if (hasKids && e.target.closest(".caret")) { wrap.classList.toggle("open"); return; }
      setTag(state.tag === path ? "" : path);
    };
    if (hasKids && (state.tag && state.tag.startsWith(path + "/"))) wrap.classList.add("open");
    wrap.appendChild(btn);
    if (hasKids) {
      const kids = document.createElement("div"); kids.className = "kids";
      Object.values(node.kids).forEach(k => kids.appendChild(mk(path ? path + "/" + k.name : k.name, k)));
      wrap.appendChild(kids);
    }
    return wrap;
  };
  Object.values(tree.kids).forEach(k => rootEl.appendChild(mk(k.name, k, 0)));
}
function setTag(tag) {
  state.tag = tag;
  $("#tagCrumb").classList.toggle("show", !!tag);
  $("#tagCrumbName").textContent = tag;
  renderTree(); render();
}

/* ── 过滤（分类 + 标签前缀匹配 + 页内筛选；全局语义搜索走 titlebar Ctrl K）── */
function filtered() {
  return CARDS.filter(c => {
    if (state.cat !== "all" && c.cat !== state.cat) return false;
    if (state.tag && !c.tags.some(t => t === state.tag || t.startsWith(state.tag + "/"))) return false;
    if (state.q) {
      const hay = c.text + " " + c.tags.join("/") + " " + CAT[c.cat].full;
      if (!hay.toLowerCase().includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
}

/* ── 卡片模板 ── */
function cardHTML(c) {
  const paras = c.text.split("\n").map(p => `<p>${esc(p)}</p>`).join("");
  const quoteCls = c.cat === "literature" ? " quote" : "";
  return `
  <div class="card" data-id="${c.id}" tabindex="0">
    <div class="card-head">
      ${catTag(c.cat)}
      ${c.top ? `<span class="pin-mini" title="已置顶"><svg class="icon"><use href="#i-pin"/></svg></span>` : ""}
      <span class="spacer"></span>
      <div class="card-acts">
        <button class="act" data-act="detail" title="进入详情"><svg class="icon"><use href="#i-maximize"/></svg></button>
        <button class="act" data-act="menu" title="更多"><svg class="icon"><use href="#i-more"/></svg></button>
      </div>
    </div>
    <div class="card-text${quoteCls}">${paras}</div>
    <div class="card-foot">
      ${c.tags.map(t => `<span class="tpill">${esc(t)}</span>`).join("")}
      <span class="spacer"></span>
      <span class="card-meta num">
        ${c.links.length ? `<span class="lk" title="链接 ${c.links.length} 张卡片"><svg class="icon"><use href="#i-link"/></svg>${c.links.length}</span>` : ""}
        <span>${c.words} 字</span><span>${c.date}</span>
      </span>
    </div>
  </div>`;
}
function featuredHTML(c) {
  return `
  <div class="featured" data-id="${c.id}" style="--cc:${CAT[c.cat].c}" tabindex="0">
    <span class="pin-flag" title="已置顶"><svg class="icon"><use href="#i-pin"/></svg></span>
    <div class="f-main">
      <div class="card-head" style="margin-bottom:0">${catTag(c.cat)}
        <div class="card-acts" style="opacity:1">
          <button class="act" data-act="detail" title="进入详情"><svg class="icon"><use href="#i-maximize"/></svg></button>
          <button class="act" data-act="menu" title="更多"><svg class="icon"><use href="#i-more"/></svg></button>
        </div>
      </div>
      <div class="f-text">${esc(c.text)}</div>
      <div class="f-sub"><span>${c.tags.map(t => "#" + esc(t)).join("  ")}</span>
        <span style="flex:1"></span>
        <span class="num">⇄ ${c.links.length} 链接 · ${c.words} 字 · ${c.date}</span></div>
    </div>
  </div>`;
}

/* ── 分组渲染：置顶（featured）+ 每个时间组各自瀑布流 ── */
function renderWall() {
  const list = filtered();
  const tops = list.filter(c => c.top);
  $("#pinCount").textContent = "· " + tops.length + " 张";
  $("#featured").innerHTML = tops.map(featuredHTML).join("");
  document.querySelector(".tgroup-head").style.display = tops.length ? "" : "none";
  $("#resultCount").textContent = `显示 ${list.length} / ${CARDS.length} 张`;
  $("#empty").classList.toggle("show", list.length === 0);
  $("#groups").innerHTML = "";
  GRPS.forEach(([k, label]) => {
    const items = list.filter(c => !c.top && c.grp === k);
    if (!items.length) return;
    const sec = document.createElement("div");
    sec.innerHTML = `<div class="tgroup-head"><b>${label}</b><span class="num">${items.length} 张</span><span class="line"></span></div>`;
    const wall = document.createElement("div"); wall.className = "wall";
    sec.appendChild(wall);
    $("#groups").appendChild(sec);
    wall.innerHTML = items.map(cardHTML).join("");
  });
  $("#sentinel").textContent = list.length ? "已加载全部 " + list.length + " 张 · 列表命令按 LIMIT 渐进拉取" : "";
}

/* ── 图谱 ── */
function renderGraph() {
  const nodes = [1, 2, 3, 5, 6, 7, 12, 13, 15, 17, 19, 20, 21, 22, 25, 27, 29, 30, 33, 35, 36];
  const pos = { 1: [480, 262], 2: [300, 152], 12: [326, 362], 20: [648, 128], 25: [655, 366], 30: [420, 452],
    3: [592, 58], 15: [876, 168], 27: [906, 326], 33: [858, 470], 36: [760, 262], 6: [128, 246],
    13: [58, 160], 29: [40, 330], 35: [230, 70], 17: [206, 420], 19: [330, 508], 7: [95, 478],
    5: [92, 118], 22: [58, 366], 21: [668, 96] };
  const drawn = new Set(nodes);
  const edgeKeys = new Set();
  nodes.forEach(id => byId[id].links.forEach(t => {
    if (drawn.has(t) && t !== id) edgeKeys.add(Math.min(id, t) + "-" + Math.max(id, t));
  }));
  let edges = "";
  edgeKeys.forEach(k => {
    const [a, b] = k.split("-").map(Number);
    edges += `<line class="gedge" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"/>`;
  });
  let dots = "";
  nodes.forEach(id => {
    const c = byId[id], deg = c.links.length + CARDS.filter(x => x.links.includes(id)).length;
    const r = id === 1 || id === 2 ? 24 : Math.min(20, 12 + deg * 1.5);
    const [x, y] = pos[id];
    dots += `<g class="gnode" data-id="${id}">
      <circle cx="${x}" cy="${y}" r="${r}" fill="${CAT[c.cat].c}" fill-opacity="0.85"/>
      <text x="${x}" y="${y + r + 15}">${esc(c.text.slice(0, 8))}…</text></g>`;
  });
  $("#graphSvg").innerHTML = edges + dots;
  $("#graphSvg").querySelectorAll(".gnode").forEach(n => n.onclick = () => openPreview(+n.dataset.id));
}

/* ── 表格 ── */

  const list = filtered().slice(0, 10);
  $("#dbBody").innerHTML = list.map(c => `
    <tr data-id="${c.id}">
      <td class="db-title">${esc(c.text.split("。")[0])}。</td>
      <td>${catTag(c.cat)}</td>
      <td>${c.tags.map(t => `<span class="tpill">${esc(t)}</span>`).join(" ")}</td>
      <td class="num">${c.links.length || "—"}</td>
      <td class="num">${c.date}</td><td class="num">${c.date}</td>
    </tr>`).join("") +
    `<tr class="db-row-add" id="dbRowAdd"><td colspan="6">＋ 新建卡片（继承当前分类 / 筛选）</td></tr>`;
  $("#dbBody").querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => openPreview(+tr.dataset.id));
  $("#dbRowAdd").onclick = () => toast("新建卡片：CreateCard 弹窗（编辑器 + 标签 + 草稿暂存）");
}

/* ── 渲染入口 ── */
function render() {
  if (state.view === "wall") renderWall();
  else if (state.view === "table") renderTable();
  $("#status-count").textContent = CARDS.length + " 张卡片";
}
renderTree(); render();

/* ── 视图切换 ── */
$("#seg").querySelectorAll("button").forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  $("#seg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  ["wall", "graph", "table"].forEach(v => $("#view-" + v).style.display = v === state.view ? "" : "none");
  $("#filterRow").style.display = state.view === "graph" ? "none" : "";
  $("#status-view").textContent = "视图 · " + b.textContent.trim();
  if (state.view === "graph") renderGraph();
  if (state.view === "table") renderTable();
  if (state.view === "wall") requestAnimationFrame(renderWall);
});

  const ph = $("#dbPlaceholder");
  ph.classList.toggle("show", !isTable);
  ph.innerHTML = `<b>${t.textContent.trim()}视图</b>Database 组件已支持（useCardDatabaseViewStore 持久化），此处略去示意——列宽 / 排序 / 过滤 / 分组 / 行内编辑同旧版。`;
});

/* ── 卡片事件委托 ── */
let menuCardId = null;
document.addEventListener("click", e => {
  const act = e.target.closest(".act[data-act]");
  if (act) {
    e.stopPropagation();
    const card = act.closest("[data-id]"); if (!card) return;
    const id = +card.dataset.id;
    if (act.dataset.act === "detail") toast("进入详情：navigator.push(card-detail/" + id + ")");
    else if (act.dataset.act === "menu") openMenu(act, id);
    return;
  }
  const cardEl = e.target.closest(".card[data-id], .featured[data-id]");
  if (cardEl) openPreview(+cardEl.dataset.id);
});

/* ── ⋯ 菜单 ── */
const menu = $("#cardMenu");
function openMenu(anchor, id) {
  menuCardId = id;
  const r = anchor.getBoundingClientRect();
  menu.classList.add("show");
  menu.style.left = Math.min(r.left, innerWidth - 190) + "px";
  menu.style.top = Math.min(r.bottom + 6, innerHeight - menu.offsetHeight - 8) + "px";
  menu.querySelector('[data-k="top"]').lastChild.textContent = byId[id].top ? "取消置顶" : "设置置顶";
}
menu.querySelectorAll(".mi").forEach(mi => mi.onclick = () => {
  menu.classList.remove("show");
  const k = mi.dataset.k, id = menuCardId;
  if (k === "detail") toast("进入详情：navigator.push(card-detail/" + id + ")");
  else if (k === "window") toast("窗口打开（仅 Electron 渲染）");
  else if (k === "top") { byId[id].top = !byId[id].top; render(); toast(byId[id].top ? "已置顶" : "已取消置顶"); }
  else if (k === "present") toast("演示模式：PresentationMode 全屏");
  else if (k === "delete") toast("删除确认：MobileConfirmDialog 同款浮层");
  else if (k.startsWith("export-")) toast("导出 " + k.split("-")[1].toUpperCase() + "：复用四个导出 Dialog");
  else if (k.startsWith("cat-")) { byId[id].cat = k.slice(4); render(); toast("分类已改为「" + CAT[k.slice(4)].full + "」"); }
});
document.addEventListener("click", e => { if (!e.target.closest("#cardMenu") && !e.target.closest('[data-act="menu"]')) menu.classList.remove("show"); });

/* ── 预览弹窗 ── */
let previewId = null;
function openPreview(id) {
  previewId = id;
  const c = byId[id];
  $("#pv-cat").outerHTML = `<span class="cat-tag" id="pv-cat" style="--cc:${CAT[c.cat].c};--cs:${CAT[c.cat].cs}">${CAT[c.cat].full}</span>`;
  $("#pv-created").textContent = "创建于 2026-" + c.date;
  $("#pv-updated").textContent = "最后修改 2026-" + c.date;
  $("#pv-words").textContent = c.words + " 字";
  $("#pv-text").textContent = c.text;
  renderPvTags(c);
  $("#overlay").classList.add("show");
  $("#pv-text").focus();
}
function renderPvTags(c) {
  $("#pv-tags").innerHTML = c.tags.map(t =>
    `<span class="tpill" data-t="${esc(t)}" title="点击移除">${esc(t)} ×</span>`).join("") +
    `<button class="m-tag-add" id="pvTagAdd"><svg class="icon" style="width:11px;height:11px"><use href="#i-plus"/></svg>添加标签</button>`;
  $("#pv-tags").querySelectorAll(".tpill").forEach(el => el.onclick = () => {
    c.tags = c.tags.filter(t => t !== el.dataset.t); renderPvTags(c); renderTree(); render();
  });
  $("#pvTagAdd").onclick = () => {
    const t = prompt("新标签（支持 a/b 层级）");
    if (t && !c.tags.includes(t)) { c.tags.push(t); renderPvTags(c); renderTree(); render(); }
  };
}
$("#overlay").addEventListener("click", e => { if (e.target === $("#overlay")) closePreview(); });
function closePreview() { $("#overlay").classList.remove("show"); previewId = null; }
$("#overlay").querySelectorAll(".m-head .act").forEach(b => b.onclick = () => {
  if (b.dataset.act === "close") closePreview();
  else if (b.dataset.act === "detail") { closePreview(); toast("进入详情：navigator.push(card-detail/" + previewId + ")"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePreview(); menu.classList.remove("show"); } });

/* ── 工具栏 ── */
$("#newBtn").onclick = () => toast("新建卡片：CreateCard 弹窗（编辑器 + 标签 + 草稿暂存）");
$("#importBtn").onclick = () => toast("导入 Markdown：多选文件 → importFromMarkdown 逐张建卡");

/* ── toast ── */
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
