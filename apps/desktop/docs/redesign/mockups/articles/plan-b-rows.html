<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<title>文章 · 方案 B 档案行 — Tau 桌面端</title>
<!--
  【视觉参考，非导出源】（D-001）：mockup 用于对照评审，落地时样式迁移组件 Tailwind。
  方案 B · 档案行：行式高密度列表，与今日页「继续编辑」同构但升格为整页能力——
  时间分组（置顶/今天/昨天/本周/本月/更早，sticky 分组头，靠底色与留白分组、零横线）、
  标签过滤 pills、排序、行内 hover 操作（置顶/导出/删除/更多）、↑↓ 键盘移动选中。
  单屏可见 ~18 条（旧版杂志卡 ~3 条），密度导向"先找再开"的使用动线。
-->
<style>
:root {
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
[data-theme="cream"] {
  color-scheme: light;
  --bg-page: #f3eee2; --bg-surface: #fffdf9; --bg-group: #faf6ec; --bg-sunken: #ece5d4;
  --bg-hover: rgba(67,57,44,0.05); --bg-selected: rgba(217,119,87,0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217,119,87,0.12); --accent-text: #b85f42;
  --ok: #61795f; --ok-soft: #e5ede2; --warn: #a38c4d; --warn-soft: #f6efd6;
  --info: #5c7d99; --info-soft: #e2ebf3;
  --shadow-card: 0 1px 2px rgba(120,100,70,0.05), 0 10px 24px -14px rgba(120,100,70,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 1200px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.icon { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* 融合骨架（与 home-final 同构） */
.app { display: grid; grid-template-columns: 218px 4px minmax(0,1fr); grid-template-rows: 100vh;
  grid-template-areas: "sidebar resizer main"; }
.sidebar { grid-area: sidebar; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-head { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; margin-bottom: 6px; flex: none; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13.5px; }
.nav-section { margin-top: 12px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13px; text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { background: var(--bg-hover); color: var(--ink-1); font-weight: 500; position: relative; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.resizer { grid-area: resizer; }
.main { grid-area: main; display: grid; grid-template-rows: 46px minmax(0,1fr) 30px; min-width: 0; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.titlebar-crumb { color: var(--ink-2); font-size: 12.5px; }
.titlebar-spacer { flex: 1; }
.kbd-pill { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--ink-2); font-size: 12px; }
kbd { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-group); color: var(--ink-2);
  font-size: 11px; font-family: ui-monospace, Consolas, monospace; display: inline-flex; align-items: center; }
.win-controls { display: flex; gap: 2px; margin-left: 4px; }
.win-btn { width: 36px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.win-btn:hover { background: var(--bg-hover); }
.win-btn.close:hover { background: #c25450; color: #fff; }
.content { overflow-y: auto; }
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--ink-3); font-size: 11.5px; }
.statusbar .sync { display: flex; align-items: center; gap: 6px; }
.statusbar .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

/* ══ 文章页 · 方案 B 档案行 ══ */
.wrap { max-width: 1480px; margin: 0 auto; padding: 20px 26px 90px; }

/* 工具栏 + 标签过滤（两层一起 sticky） */
.toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg-page);
  display: flex; align-items: center; gap: 16px; padding: 2px 0 12px; }
.toolbar h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar .digest { font-size: 12px; color: var(--ink-2); }
.toolbar .digest b { color: var(--ink-1); font-weight: 600; }
.toolbar-spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; width: 240px; height: 30px; padding: 0 12px;
  background: var(--bg-surface); border-radius: 999px; box-shadow: var(--shadow-card); color: var(--ink-3); }
.search input { flex: 1; border: none; outline: none; background: none; font: inherit; font-size: 12.5px; color: var(--ink-1); }
.search input::placeholder { color: var(--ink-3); }
.seg { display: flex; align-items: center; gap: 2px; background: var(--bg-surface); border-radius: 10px;
  padding: 3px; box-shadow: var(--shadow-card); }
.seg button { height: 24px; padding: 0 12px; border-radius: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink-1); }
.seg button.on { background: var(--bg-group); color: var(--ink-1); font-weight: 500; }
.new-btn { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 999px;
  background: linear-gradient(145deg, var(--accent-hover), var(--accent)); color: var(--ink-inverse);
  font-size: 12.5px; font-weight: 500; box-shadow: 0 4px 14px -4px rgba(217,119,87,0.5); }
.new-btn:hover { filter: brightness(1.04); }
.new-btn .icon { width: 14px; height: 14px; }

.tagbar { position: sticky; top: 44px; z-index: 9; display: flex; align-items: center; gap: 6px;
  padding: 0 0 12px; background: var(--bg-page); flex-wrap: wrap; }
.tagbar .lbl { font-size: 11px; color: var(--ink-3); margin-right: 2px; }
.tag-pill { height: 24px; padding: 0 12px; border-radius: 999px; background: var(--bg-surface);
  box-shadow: var(--shadow-card); font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tag-pill .n { font-size: 10.5px; color: var(--ink-3); }
.tag-pill:hover { color: var(--ink-1); }
.tag-pill.on { background: var(--bg-selected); color: var(--accent-text); font-weight: 500; }
.tag-pill.on .n { color: var(--accent-text); opacity: 0.7; }

/* 分组头（底色分组，零横线） */
.group { margin-bottom: 18px; }
.group-head { position: sticky; top: 92px; z-index: 8; display: flex; align-items: baseline; gap: 8px;
  padding: 4px 2px 6px; background: var(--bg-page); }
.group-head b { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.group-head span { font-size: 11px; color: var(--ink-3); }

/* 行 */
.rows { display: flex; flex-direction: column; gap: 1px; }
.row { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 10px 0 12px;
  border-radius: 10px; cursor: pointer; position: relative; }
.row:hover { background: var(--bg-hover); }
.row.sel { background: var(--bg-selected); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.row .lead { width: 18px; flex: none; display: grid; place-items: center; color: var(--accent); }
.row .lead .icon { width: 13px; height: 13px; fill: var(--accent); stroke: none; visibility: hidden; }
.row.is-top .lead .icon { visibility: visible; }
.row .t { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .ex { flex: 1.1; min-width: 0; font-size: 12px; color: var(--ink-3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.row .tags { display: flex; gap: 4px; flex: none; }
.row .tag { font-size: 11px; color: var(--ink-2); background: var(--bg-group); border-radius: 5px;
  padding: 0.5px 7px; white-space: nowrap; }
.row .w { flex: none; width: 64px; text-align: right; font-size: 11.5px; color: var(--ink-3); }
.row .d { flex: none; width: 88px; text-align: right; font-size: 11.5px; color: var(--ink-3); }
.row .ops { flex: none; display: flex; gap: 1px; opacity: 0; transition: opacity 140ms var(--ease-out); width: 108px; justify-content: flex-end; }
.row:hover .ops, .row.sel .ops, .row:focus-within .ops { opacity: 1; }
.op-btn { width: 26px; height: 26px; border-radius: 8px; color: var(--ink-3); display: grid; place-items: center; }
.op-btn:hover { background: var(--bg-surface); color: var(--ink-1); box-shadow: var(--shadow-card); }
.op-btn .icon { width: 14px; height: 14px; }
.row.is-top .op-btn.top svg { fill: var(--accent); stroke: var(--accent); }

/* 渐进加载 / 空态 */
.load-more { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 14px; color: var(--ink-3); font-size: 12px; }
.load-more button { height: 30px; padding: 0 18px; border-radius: 999px; background: var(--bg-surface);
  box-shadow: var(--shadow-card); color: var(--ink-2); font-size: 12.5px; }
.load-more button:hover { color: var(--ink-1); }
.empty { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 80px 0 40px; color: var(--ink-3); }
.empty .icon { width: 36px; height: 36px; stroke-width: 1.25; margin-bottom: 6px; }
.empty b { font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.empty small { font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-head">
      <span style="display:flex;align-items:center;gap:8px"><span class="brand-mark">τ</span><span class="brand-name">Tau</span></span>
    </div>
    <div class="nav-section">
      <div class="nav-label">工作台</div>
      <button class="nav-item"><svg class="icon"><use href="#i-flame"/></svg><span>今日</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">知识</div>
      <button class="nav-item"><svg class="icon"><use href="#i-layers"/></svg><span>卡片库</span></button>
      <button class="nav-item active"><svg class="icon"><use href="#i-article"/></svg><span>文章</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-book"/></svg><span>知识库</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">学习</div>
      <button class="nav-item"><svg class="icon"><use href="#i-repeat"/></svg><span>闪卡复习</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">工具</div>
      <button class="nav-item"><svg class="icon"><use href="#i-calendar"/></svg><span>日程</span></button>
      <button class="nav-item"><svg class="icon"><use href="#i-chart"/></svg><span>统计</span></button>
    </div>
  </nav>
  <div class="resizer"></div>
  <div class="main">
    <header class="titlebar">
      <span class="titlebar-crumb">· 文章</span>
      <div class="titlebar-spacer"></div>
      <button class="kbd-pill"><svg class="icon" style="width:13px;height:13px"><use href="#i-search"/></svg>搜索或跳转…<kbd>Ctrl K</kbd></button>
      <div class="win-controls"><span class="win-btn"></span><span class="win-btn close"></span></div>
    </header>
    <main class="content" id="content">
      <div class="wrap">
        <div class="toolbar">
          <h1>文章</h1>
          <span class="digest num" id="digest"></span>
          <div class="toolbar-spacer"></div>
          <label class="search"><svg class="icon" style="width:13px;height:13px"><use href="#i-search"/></svg>
            <input id="q" placeholder="标题…" /></label>
          <div class="seg" id="sort">
            <button data-k="updated" class="on">最近编辑</button>
            <button data-k="created">最近创建</button>
            <button data-k="words">字数</button>
          </div>
          <button class="new-btn"><svg class="icon"><use href="#i-plus"/></svg>新建</button>
        </div>
        <div class="tagbar" id="tagbar"><span class="lbl">标签</span></div>
        <div id="groups"></div>
        <div class="load-more" id="load-more"></div>
        <div class="empty" id="empty">
          <svg class="icon"><use href="#i-article"/></svg>
          <b>没有匹配的文章</b>
          <small>换个关键词，或清空标签筛选</small>
        </div>
      </div>
    </main>
    <footer class="statusbar">
      <span class="sync">已同步</span>
      <span class="num" id="status-count"></span>
      <span style="margin-left:auto">↑↓ 移动 · Enter 打开 · 悬停行尾快速操作</span>
    </footer>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>
  <symbol id="i-article" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>

  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>

  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></symbol>

</svg>

<script>
/* ── mock 数据（与方案 A 同一口径；行式不需要 banner，摘录用于副信息列） ── */
const A = (id, title, tags, words, rel, date, ex) => ({ id, title, tags, words, rel, date, ex, top: false });
const ARTICLES = [
  Object.assign(A(1, "为什么写长文要先搭骨架", ["写作", "方法论"], 3482, "今天", "09-19",
    "骨架不是大纲。大纲是叙述的顺序，骨架是论证的顺序。"), { top: true }),
  Object.assign(A(2, "关于「渐进式总结」的再思考", ["读书笔记", "知识管理"], 2917, "3 天前", "09-16",
    "第二遍摘要不是压缩，是改写。丢失的那部分恰恰是还没理解的。"), { top: true }),
  A(3, "收集与连接的拉锯", ["知识管理"], 1204, "今天", "09-19", "每次「先存下来再说」都在推迟一次真正的思考。"),
  A(4, "与 Claude 协作的半小时：上下文比结论值钱", ["AI 协作"], 986, "今天", "09-19", "它需要的是语境，不是指令。"),
  A(5, "费曼技巧实践手记 · 第六周", ["方法论"], 763, "今天", "09-19", "卡住的地方就是理解的边界。"),
  A(6, "「记忆的错觉」读书摘录 · 第 4 章", ["读书笔记", "认知科学"], 1892, "昨天", "09-18", "流畅感是记忆最大的骗子。"),
  A(7, "一张卡片写作模板的五次重构", ["写作", "笔记法"], 645, "昨天", "09-18", "模板每次变复杂一点，写的时候反而更快。"),
  A(8, "周末知识库盘点清单", ["工具流"], 428, "昨天", "09-18", "盘点不是洁癖，是防止知识库退化成仓库。"),
  A(9, "论「小」工具的魅力", ["工具流"], 1102, "昨天", "09-18", "小而钝的工具逼你面对自己的流程。"),
  A(10, "间隔重复的最优间隔并不存在", ["认知科学", "记忆"], 2246, "3 天前", "09-16", "算法能给的是兜底，不是最优。"),
  A(11, "双链笔记的涌现结构", ["知识管理"], 1733, "4 天前", "09-15", "链接的价值在三个月后的那次意外撞见。"),
  A(12, "写作是思考的显影", ["写作"], 1510, "4 天前", "09-15", "把信噪比提到别人能读懂的程度。"),
  A(13, "我用 AI 写作的边界", ["AI 协作", "写作"], 2058, "5 天前", "09-14", "让它质疑我的论点，不让它替我形成论点。"),
  A(14, "公开学习：两周实践记录", ["方法论"], 894, "5 天前", "09-14", "忍受「这还不成熟」的羞耻感，但它加速了迭代。"),
  A(15, "带着问题读，还是边读边收集", ["读书笔记"], 1367, "6 天前", "09-13", "漫游偶有惊喜，狩猎才有战利品。"),
  A(16, "每日笔记模板的第三次尝试", ["笔记法"], 552, "6 天前", "09-13", "其余都是装饰。"),
  A(17, "知识的复利来自连接而非收集", ["知识管理"], 1689, "1 周前", "09-12", "收集创造库存，连接创造利息。"),
  A(18, "笔记是写给未来自己的，不是存档的", ["笔记法"], 1275, "1 周前", "09-12", "写给三个月后的自己。"),

  A(20, "我理解的卡片盒方法", ["知识管理", "读书笔记"], 3156, "2 周前", "09-05", "编号是思想的坐标系。"),

const GROUPS = ["置顶", "今天", "昨天", "本周", "本月", "更早"];
const GROUP_OF = (a) => a.top ? "置顶" : a.rel === "今天" ? "今天" : a.rel === "昨天" ? "昨天"
  : ["3 天前", "4 天前", "5 天前", "6 天前"].includes(a.rel) ? "本周"
  : ["1 周前", "2 周前", "3 周前"].includes(a.rel) ? "本月" : "更早";

const PAGE = 18;
let shown = PAGE, query = "", tag = "", sortKey = "updated", selId = null;
const $ = (s) => document.querySelector(s);
const fmtWords = (n) => n >= 10000 ? (n / 10000).toFixed(1) + " 万" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

function filtered() {
  const q = query.trim().toLowerCase();
  let list = ARTICLES.filter((a) =>
    (!q || a.title.toLowerCase().includes(q)) && (!tag || a.tags.includes(tag)));
  if (sortKey === "words") list = [...list].sort((a, b) => b.words - a.words);
  else if (sortKey === "created") list = [...list].sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.id - a.id);
  return list;
}

function rowHTML(a) {
  return `<div class="row ${a.top ? "is-top" : ""} ${a.id === selId ? "sel" : ""}" data-id="${a.id}" tabindex="0">
    <span class="lead"><svg class="icon"><use href="#i-star"/></svg></span>
    <span class="t">${a.title}</span>
    <span class="ex">${a.ex}</span>
    <span class="tags">${a.tags.slice(0, 2).map((t) => `<span class="tag">${t}</span>`).join("")}</span>
    <span class="w num">${fmtWords(a.words)} 字</span>
    <span class="d num">${a.rel}</span>
    <span class="ops">
      <button class="op-btn top" title="${a.top ? "取消置顶" : "置顶"}"><svg class="icon"><use href="#i-star"/></svg></button>
      <button class="op-btn" title="导出"><svg class="icon"><use href="#i-export"/></svg></button>
      <button class="op-btn" title="删除"><svg class="icon"><use href="#i-trash"/></svg></button>
      <button class="op-btn" title="更多（演示模式 · Markdown / 图片 / EPUB / PDF 导出 · 窗口打开）"><svg class="icon"><use href="#i-more"/></svg></button>
    </span>
  </div>`;
}

function render() {
  const list = filtered();
  const tops = list.filter((a) => a.top);
  const rest = list.filter((a) => !a.top).slice(0, shown);
  let html = "";
  if (tops.length) html += groupHTML("置顶", tops);
  for (const g of GROUPS.slice(1)) {
    const items = rest.filter((a) => GROUP_OF(a) === g);
    if (items.length) html += groupHTML(g, items);
  }
  $("#groups").innerHTML = html;
  document.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => {
    selId = Number(r.dataset.id);
    document.querySelectorAll(".row").forEach((x) => x.classList.toggle("sel", Number(x.dataset.id) === selId));
  }));
  const total = list.length - tops.length;
  const more = total - Math.min(shown, total);
  $("#load-more").innerHTML = more > 0
    ? `<span class="num">已显示 ${Math.min(shown, total)} / ${total} 篇</span><button id="more-btn">继续加载</button>`
    : (total > PAGE ? `<span>已全部加载 · ${total} 篇</span>` : "");
  if (more > 0) $("#more-btn").onclick = () => { shown += PAGE; render(); };
  $("#empty").style.display = list.length ? "none" : "flex";
  $("#groups").style.display = list.length ? "" : "none";
  $("#status-count").textContent = `${list.length} 篇 · ${fmtWords(list.reduce((s, a) => s + a.words, 0))}字`;
}

function groupHTML(name, items) {
  return `<section class="group">
    <div class="group-head"><b>${name}</b><span class="num">${items.length} 篇</span></div>
    <div class="rows">${items.map(rowHTML).join("")}</div>
  </section>`;
}

/* 标签栏（真实聚合计数） */
(function tagbar() {
  const counts = {};
  ARTICLES.forEach((a) => a.tags.forEach((t) => counts[t] = (counts[t] || 0) + 1));
  const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const bar = $("#tagbar");
  bar.insertAdjacentHTML("beforeend", `<button class="tag-pill on" data-t="">全部<span class="n">${ARTICLES.length}</span></button>` +
    tags.map((t) => `<button class="tag-pill" data-t="${t}">${t}<span class="n">${counts[t]}</span></button>`).join(""));
  bar.addEventListener("click", (e) => {
    const b = e.target.closest(".tag-pill"); if (!b) return;
    bar.querySelectorAll(".tag-pill").forEach((x) => x.classList.toggle("on", x === b));
    tag = b.dataset.t; shown = PAGE; render();
  });
})();

const totalWords = ARTICLES.reduce((s, a) => s + a.words, 0);
$("#digest").innerHTML = `共 <b>${ARTICLES.length}</b> 篇 · 累计 <b>${fmtWords(totalWords)}</b>字`;
$("#q").addEventListener("input", (e) => { query = e.target.value; shown = PAGE; render(); });
$("#sort").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#sort button").forEach((x) => x.classList.toggle("on", x === b));
  sortKey = b.dataset.k; shown = PAGE; render();
});
render();

/* ↑↓ 键盘移动选中（Enter 提示由状态栏承载） */
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  const rows = [...document.querySelectorAll(".row")];
  const i = rows.findIndex((r) => Number(r.dataset.id) === selId);
  const next = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (next) next.click();
  next?.scrollIntoView({ block: "nearest" });
});
</script>
