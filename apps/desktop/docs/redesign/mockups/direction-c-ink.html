<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>样板间 C · 墨韵编辑部 — Tau 桌面端</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  方向 C「墨韵编辑部」——纸与墨的编辑部风，个人特色最强
  · 素白纸面 + 近黑墨色 + 朱砂 accent（仅一个颜色）
  · 标题与卡片题名用衬线（Georgia/宋体栈），界面控件保持无衬线——衬线只用于"内容"
  · 索引卡片隐喻：卡片顶部粗墨线 + 发丝边框；圆角 4（印刷感）
  · meta 信息用等宽字体（档案感）；双细线（editorial rule）分隔
  · 深色 = 墨夜（近黑暖灰 + 亮朱砂）
  · 演示：侧边栏骨架 + 卡片列表页 + 详情抽屉(master-detail) + 分屏 + 命令面板(Ctrl+K)
  ═══════════════════════════════════════════════════════════════════
-->
<style>
:root {
  /* 尺度/字体：不随主题变（defineTheme 的正交层） */
  --radius-sm: 3px; --radius-md: 4px; --radius-lg: 5px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
  --font-serif: Georgia, "Times New Roman", "Songti SC", "Noto Serif SC", SimSun, serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

/* ── 主题 1/4：素笺（浅色默认） ── */
[data-theme="paper"] {
  color-scheme: light;
  --bg-page: #fbfaf8;
  --bg-surface: #ffffff;
  --bg-elevated: #ffffff;
  --bg-sunken: #f4f2ee;
  --bg-hover: rgba(28, 27, 25, 0.045);
  --bg-press: rgba(28, 27, 25, 0.08);
  --bg-selected: rgba(192, 61, 45, 0.08);

  --ink-1: #1c1b19;
  --ink-2: #5f594f;
  --ink-3: #8a8377;
  --ink-inverse: #fdf9f4;

  --line-1: #ddd9d1;
  --line-2: #e8e5df;
  --hairline: #e5e2db;
  --rule: #1c1b19;             /* 编辑部粗墨线（卡片顶缘/双细线） */

  --accent: #c03d2d;
  --accent-hover: #a83426;
  --accent-soft: rgba(192, 61, 45, 0.08);
  --accent-text: #b23726;
  --focus-ring: 0 0 0 2px #fbfaf8, 0 0 0 4px rgba(192, 61, 45, 0.5);

  --ok: #4a7040;      --ok-soft: #e9f0e4;
  --warn: #8f7434;    --warn-soft: #f4eeda;
  --danger: #b23726;  --danger-soft: #f6e4e0;
  --info: #46698c;    --info-soft: #e6edf4;

  --overlay: rgba(28, 27, 25, 0.42);
  --shadow-float: 0 1px 2px rgba(28, 27, 25, 0.06), 0 10px 30px -10px rgba(28, 27, 25, 0.22);
}

/* ── 主题 2/4：墨夜（深色） ── */
[data-theme="ink"] {
  color-scheme: dark;
  --bg-page: #141311;
  --bg-surface: #1c1a17;
  --bg-elevated: #211f1b;
  --bg-sunken: #100f0d;
  --bg-hover: rgba(236, 232, 224, 0.06);
  --bg-press: rgba(236, 232, 224, 0.1);
  --bg-selected: rgba(224, 96, 74, 0.12);

  --ink-1: #ece8e0;
  --ink-2: #b3aca0;
  --ink-3: #7d766a;
  --ink-inverse: #1c1917;

  --line-1: #2e2b26;
  --line-2: #272421;
  --hairline: #2a2723;
  --rule: #ece8e0;

  --accent: #e0604a;
  --accent-hover: #e97a66;
  --accent-soft: rgba(224, 96, 74, 0.12);
  --accent-text: #e97a66;
  --focus-ring: 0 0 0 2px #141311, 0 0 0 4px rgba(224, 96, 74, 0.55);

  --ok: #8fc07f;      --ok-soft: rgba(143, 192, 127, 0.12);
  --warn: #d4b96a;    --warn-soft: rgba(212, 185, 106, 0.12);
  --danger: #e97a66;  --danger-soft: rgba(224, 96, 74, 0.12);
  --info: #8fb0d4;    --info-soft: rgba(143, 176, 212, 0.12);

  --overlay: rgba(0, 0, 0, 0.55);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.55);
}

/* ── 主题 3/4：青瓷（浅色） ── */
[data-theme="celadon"] {
  color-scheme: light;
  --bg-page: #f5f8f4;
  --bg-surface: #ffffff;
  --bg-elevated: #ffffff;
  --bg-sunken: #edf1ea;
  --bg-hover: rgba(30, 38, 32, 0.045);
  --bg-press: rgba(30, 38, 32, 0.08);
  --bg-selected: rgba(64, 110, 98, 0.09);
  --ink-1: #212823;
  --ink-2: #5b665d;
  --ink-3: #8a958b;
  --ink-inverse: #f5faf6;
  --line-1: #dbe3da;
  --line-2: #e6ede5;
  --hairline: #e3ebe2;
  --rule: #212823;
  --accent: #3f7a6c;
  --accent-hover: #33675b;
  --accent-soft: rgba(64, 122, 110, 0.09);
  --accent-text: #38685c;
  --focus-ring: 0 0 0 2px #f5f8f4, 0 0 0 4px rgba(64, 122, 110, 0.5);
  --ok: #4a7040;      --ok-soft: #e9f0e4;
  --warn: #8f7434;    --warn-soft: #f4eeda;
  --danger: #b23726;  --danger-soft: #f6e4e0;
  --info: #46698c;    --info-soft: #e6edf4;
  --overlay: rgba(28, 36, 32, 0.42);
  --shadow-float: 0 1px 2px rgba(30, 40, 32, 0.06), 0 10px 30px -10px rgba(30, 40, 32, 0.22);
}

/* ── 主题 4/4：暮山（深色） ── */
[data-theme="mount"] {
  color-scheme: dark;
  --bg-page: #12151b;
  --bg-surface: #1a1e25;
  --bg-elevated: #1f242c;
  --bg-sunken: #0e1015;
  --bg-hover: rgba(232, 235, 239, 0.06);
  --bg-press: rgba(232, 235, 239, 0.1);
  --bg-selected: rgba(125, 149, 201, 0.13);
  --ink-1: #e8ebee;
  --ink-2: #a0a8b3;
  --ink-3: #62697a;
  --ink-inverse: #171a21;
  --line-1: #2b3038;
  --line-2: #252a31;
  --hairline: #272c33;
  --rule: #e8ebee;
  --accent: #7d95c9;
  --accent-hover: #92a9d8;
  --accent-soft: rgba(125, 149, 201, 0.13);
  --accent-text: #92a9d8;
  --focus-ring: 0 0 0 2px #12151b, 0 0 0 4px rgba(125, 149, 201, 0.55);
  --ok: #8fc07f;      --ok-soft: rgba(143, 192, 127, 0.12);
  --warn: #d4b96a;    --warn-soft: rgba(212, 185, 106, 0.12);
  --danger: #e97a66;  --danger-soft: rgba(224, 96, 74, 0.12);
  --info: #8fb0d4;    --info-soft: rgba(143, 176, 212, 0.12);
  --overlay: rgba(0, 0, 0, 0.55);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); font-size: 13px; line-height: 1.65;
  color: var(--ink-1); background: var(--bg-page);
  overflow: hidden; min-width: 1024px; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
::selection { background: var(--accent-soft); }
.icon { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.serif { font-family: var(--font-serif); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; }
}

.app { position: relative; display: grid; grid-template-rows: 44px 1fr 30px; grid-template-columns: auto 4px 1fr; height: 100vh;
  grid-template-areas: "titlebar titlebar titlebar" "sidebar resizer content" "statusbar statusbar statusbar"; }
.resizer { grid-area: resizer; cursor: col-resize; border-radius: 2px; transition: background 160ms var(--ease-out); }
.resizer:hover, .resizer.active { background: var(--line-1); }
/* 侧栏头部：logo 与折叠按钮住在侧栏本体，标题栏不再堆积 */
.sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 6px 10px; margin-bottom: 6px; }
.sidebar-head .icon-btn { width: 26px; height: 26px; }
/* 收起态：悬浮展开按钮淡入，标题栏状态与侧栏解耦、无跳变 */
.floating-expand { position: absolute; left: 8px; top: 52px; z-index: 50; width: 26px; height: 26px;
  border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--ink-2);
  background: var(--bg-surface); border: 1px solid var(--line-1);
  opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-out), color 160ms var(--ease-out); }
.floating-expand:hover { color: var(--ink-1); }
body.collapsed .floating-expand { opacity: 1; pointer-events: auto; }
body.collapsed .sidebar-head { justify-content: center; padding: 2px 0 10px; }
body.collapsed .sidebar-head .brand-name, body.collapsed .sidebar-head .icon-btn { display: none; }

/* ── 标题栏 ── */
.titlebar { grid-area: titlebar; display: flex; align-items: center; gap: 12px; padding: 0 12px;
  border-bottom: 1px solid var(--hairline); user-select: none; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand-mark { width: 22px; height: 22px; border-radius: var(--radius-md); background: var(--accent);
  color: var(--ink-inverse); display: grid; place-items: center; font-family: var(--font-serif); font-size: 13px; font-weight: 700; }
.brand-name { font-family: var(--font-serif); font-weight: 700; font-size: 13.5px; letter-spacing: 0.02em; }
.titlebar-crumb { color: var(--ink-3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.titlebar-spacer { flex: 1; }
.kbd-pill { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 10px;
  background: var(--bg-sunken); border: 1px solid var(--line-1); border-radius: var(--radius-md);
  color: var(--ink-2); font-size: 12px; transition: border-color 160ms var(--ease-out); }
.kbd-pill:hover { border-color: var(--accent); }
.icon-btn { width: 29px; height: 29px; border-radius: var(--radius-sm); display: grid; place-items: center;
  color: var(--ink-2); transition: background 160ms var(--ease-out), color 160ms var(--ease-out); }
.icon-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
.win-controls { display: flex; gap: 2px; margin-left: 4px; }
.win-btn { width: 34px; height: 25px; border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--ink-2); }
.win-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
.win-btn.close:hover { background: var(--danger); color: var(--ink-inverse); }

/* 平台适配：Mac 红绿灯 / Win 右侧三键 */
.traffic-lights { display: none; align-items: center; gap: 8px; padding-right: 2px; }
html[data-platform="mac"] .traffic-lights { display: flex; }
html[data-platform="mac"] .win-controls { display: none; }
html[data-platform="mac"] .titlebar { padding-left: 8px; }
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl-close { background: #ff5f57; }
.tl-min { background: #febc2e; }
.tl-max { background: #28c840; }
.icon-btn:disabled, .icon-btn:disabled:hover { opacity: 0.35; background: none; cursor: default; }
.platform-btn { font-size: inherit; color: inherit; padding: 2px 8px; border-radius: 5px; border: 1px solid transparent; opacity: 0.9; }
.platform-btn:hover { border-color: var(--line-1); opacity: 1; }

/* ── 侧边栏（极简：同纸面 + 发丝右线，激活项朱砂文字） ── */
.sidebar { grid-area: sidebar; width: var(--sidebar-w, 208px); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 1px;
  border-right: 1px solid var(--hairline); overflow-y: auto; transition: width 180ms var(--ease-out); }
.nav-section { margin-top: 16px; }
.nav-section:first-child { margin-top: 2px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; letter-spacing: 0.08em; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 31px; padding: 0 10px;
  border-radius: var(--radius-md); color: var(--ink-2); font-size: 13px; text-align: left;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out); }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { color: var(--accent-text); font-weight: 500; }
.nav-item .icon { width: 16px; height: 16px; }
.nav-badge { margin-left: auto; min-width: 19px; height: 17px; padding: 0 5px; border-radius: 3px;
  background: var(--accent-soft); color: var(--accent-text); font-size: 10.5px; font-weight: 500;
  display: grid; place-items: center; font-family: var(--font-mono); }
.nav-spacer { flex: 1; }
body.collapsed .sidebar { width: 52px; }
body.collapsed .sidebar .nav-item span, body.collapsed .sidebar .nav-label, body.collapsed .sidebar .nav-badge { display: none; }
body.collapsed .sidebar .nav-item { justify-content: center; padding: 0; }

/* ── 内容区 ── */
.content { grid-area: content; overflow-y: auto; }
.content-inner { max-width: 1120px; margin: 0 auto; padding: 32px 36px 52px; }

/* 页头：衬线大标题 + 双细线（editorial rule） */
.page-header { margin-bottom: 6px; }
.page-header-row { display: flex; align-items: flex-end; gap: 14px; }
.page-title { font-family: var(--font-serif); font-size: 24px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.3; text-wrap: balance; }
.page-sub { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
.page-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.page-rule { margin-top: 14px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); height: 4px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 31px; padding: 0 14px;
  border-radius: var(--radius-md); font-size: 12.5px; font-weight: 500; border: 1px solid transparent;
  transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 160ms var(--ease-out); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--ink-inverse); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-soft { background: transparent; color: var(--ink-1); border-color: var(--line-1); }
.btn-soft:hover { border-color: var(--ink-2); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--ink-1); }

.filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 18px; }
.search { display: flex; align-items: center; gap: 8px; width: 236px; height: 31px; padding: 0 11px;
  background: var(--bg-surface); border: 1px solid var(--line-1); border-radius: var(--radius-md);
  color: var(--ink-3); transition: border-color 160ms var(--ease-out); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; border: none; outline: none; background: none; color: var(--ink-1); }
.search input::placeholder { color: var(--ink-2); }
.chip-group { display: flex; gap: 0; border-bottom: 1px solid var(--line-1); }
.chip { height: 28px; padding: 0 2px; margin: 0 10px; font-size: 12.5px; color: var(--ink-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out); }
.chip:hover { color: var(--ink-1); }
.chip.active { color: var(--accent-text); font-weight: 500; border-bottom-color: var(--accent); }
.segmented { margin-left: auto; display: flex; align-items: center; gap: 1px; }
.seg-btn { width: 28px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center;
  color: var(--ink-2); transition: all 160ms var(--ease-out); }
.seg-btn:hover { color: var(--ink-1); }
.seg-btn.active { color: var(--accent-text); background: var(--bg-selected); }

/* 卡片：索引卡隐喻——顶部粗墨线 + 发丝边框 */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(296px, 1fr)); gap: 14px; }
.card { position: relative; padding: 14px 16px 12px; background: var(--bg-surface); text-align: left; width: 100%;
  border: 1px solid var(--line-2); border-top: 2px solid var(--rule); border-radius: var(--radius-lg);
  cursor: pointer; transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), transform 160ms var(--ease-out); }
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow-float); border-color: var(--line-1); }
/* .card 顶缘墨线直接用 var(--rule)，随主题切换 */
.card-title { font-family: var(--font-serif); font-size: 15.5px; font-weight: 700; line-height: 1.45; margin-bottom: 6px; text-wrap: balance; }
.card-excerpt { color: var(--ink-2); font-size: 12.5px; line-height: 1.7; margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { height: 20px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 11px;
  border: 1px solid var(--line-1); color: var(--ink-2); display: inline-flex; align-items: center; background: var(--bg-sunken); }
.card-meta { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 11.5px; font-family: var(--font-mono); }
.dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }
.status { display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 1px; }
.status.review::before { background: var(--warn); }
.status.mastered::before { background: var(--ok); }
.status.fresh::before { background: var(--info); }
.card-hover-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; opacity: 0;
  transition: opacity 160ms var(--ease-out); }
.card:hover .card-hover-actions { opacity: 1; }
.mini-btn { width: 25px; height: 25px; border-radius: var(--radius-sm); display: grid; place-items: center;
  background: var(--bg-elevated); color: var(--ink-2); border: 1px solid var(--line-1); }
.mini-btn:hover { color: var(--accent-text); border-color: var(--accent); }

/* 置顶卡：全宽 + 双细线包边 */
.card.pinned { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; padding: 16px 20px 13px;
  border-top: 2px solid var(--rule); }
.card.pinned .card-excerpt { max-width: 66ch; margin-bottom: 8px; }
.card.pinned .pin-side { display: flex; align-items: center; gap: 24px; }
.pin-stat { text-align: right; }
.pin-stat b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.pin-stat span { font-size: 11px; color: var(--ink-3); }
.pin-badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px;
  border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-text); font-size: 10.5px; font-weight: 500; }
.ai-badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: var(--radius-sm);
  background: var(--bg-sunken); border: 1px solid var(--line-1); color: var(--ink-2); font-size: 10.5px; }

/* ── 视图切换（页面栈：今日 / 列表 / 详情，Esc = 后退） ── */
.view.hidden { display: none; }

/* 今日（首页 · 清单流） */
.today-inner { max-width: 640px; margin: 0 auto; padding: 32px 36px 72px; }
.today-head { margin-bottom: 6px; }
.today-date { color: var(--ink-2); font-size: 12px; font-family: var(--font-mono); }
.today-title { font-size: 27px; font-weight: 700; margin-top: 6px; }
.today-rule { margin: 14px 0 16px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); height: 4px; }
.todo-section { margin-bottom: 24px; }
.todo-label { font-size: 11px; color: var(--ink-2); font-weight: 500; padding: 0 6px 6px; letter-spacing: 0.08em; }
.todo-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 8px;
  border-bottom: 1px solid var(--line-2); transition: background 160ms var(--ease-out); }
.todo-row:hover { background: var(--bg-hover); }
.todo-check { width: 15px; height: 15px; border-radius: 2px; border: 1.5px solid var(--ink-3); flex: none;
  transition: border-color 160ms var(--ease-out); }
.todo-row:hover .todo-check { border-color: var(--accent); }
.todo-text { display: flex; flex-direction: column; gap: 1px; }
.todo-text b { font-size: 13.5px; font-weight: 500; color: var(--ink-1); }
.todo-text small { font-size: 11px; color: var(--ink-2); }

.recent-row { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 10px 8px;
  border-bottom: 1px solid var(--line-2); transition: background 160ms var(--ease-out); }

/* 卡片详情（整页沉浸） */
.detail-inner { max-width: 720px; margin: 0 auto; padding: 34px 36px 80px; }
.detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.detail-title { font-family: var(--font-serif); font-size: 28px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; text-wrap: balance; }
.detail-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-2);

.prose p { margin-bottom: 13px; color: var(--ink-1); line-height: 1.9; font-size: 13.5px; }

.prose blockquote { margin: 15px 0; padding: 2px 0 2px 14px; border-left: 1px solid var(--accent);
  color: var(--accent-text); font-family: var(--font-serif); font-size: 13.5px; }
.detail-sub { font-family: var(--font-serif); font-size: 14px; font-weight: 700; margin: 26px 0 4px; }
.detail-actions { display: flex; gap: 8px; margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--rule); }

/* ── 分屏 ── */
.split-pane { position: fixed; top: 44px; right: 0; bottom: 30px; width: min(440px, 42vw); z-index: 40;
  background: var(--bg-surface); border-left: 1px solid var(--line-1);
  transform: translateX(103%); transition: transform 240ms var(--ease-out); display: flex; flex-direction: column; }
body.split-open .split-pane { transform: translateX(0); }
.split-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
.split-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--hairline);
  font-size: 11.5px; color: var(--ink-3); font-family: var(--font-mono); }
.split-head b { color: var(--ink-2); font-weight: 500; }
.split-head .icon-btn { margin-left: auto; width: 25px; height: 25px; }

/* ── 命令面板 ── */
.palette-backdrop { position: fixed; inset: 0; background: var(--overlay); opacity: 0; pointer-events: none;
  transition: opacity 160ms var(--ease-out); z-index: 80; }
body.palette-open .palette-backdrop { opacity: 1; pointer-events: auto; }
.palette { position: fixed; left: 50%; top: 15vh; transform: translate(-50%, 8px) scale(0.99); width: min(580px, 92vw);
  background: var(--bg-elevated); border: 1px solid var(--line-1); border-top: 2px solid var(--rule);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-float); opacity: 0; pointer-events: none;
  transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out); z-index: 81; overflow: hidden; }
body.palette-open .palette { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
.palette-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--hairline); }
.palette-input { flex: 1; border: none; outline: none; background: none; font-size: 14px; }
.palette-input::placeholder { color: var(--ink-2); }
.palette-list { max-height: 380px; overflow-y: auto; padding: 6px; }
.palette-group { font-size: 11px; color: var(--ink-3); padding: 8px 10px 4px; letter-spacing: 0.08em; }
.palette-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 35px; padding: 0 10px;
  border-radius: var(--radius-md); color: var(--ink-2); font-size: 13px; text-align: left; }
.palette-item .icon { width: 15px; height: 15px; }
.palette-item.active { background: var(--bg-selected); color: var(--ink-1); box-shadow: inset 2px 0 0 var(--accent); }
.palette-item kbd { margin-left: auto; }
kbd { height: 19px; padding: 0 6px; border-radius: 3px; background: var(--bg-sunken);
  color: var(--ink-2); font-size: 10.5px; font-family: var(--font-mono);
  display: inline-flex; align-items: center; border: 1px solid var(--line-1); }
.palette-empty { padding: 26px; text-align: center; color: var(--ink-3); font-size: 12px; }

/* ── 状态栏（等宽档案感） ── */
.statusbar { grid-area: statusbar; display: flex; align-items: center; gap: 18px; padding: 0 14px;
  border-top: 1px solid var(--hairline); color: var(--ink-3); font-size: 11px; font-family: var(--font-mono); user-select: none; }
.statusbar .sync { display: flex; align-items: center; gap: 6px; }
.statusbar .sync::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: var(--ok); }
.statusbar-right { margin-left: auto; display: flex; gap: 18px; }

/* ── Toast ── */
.toast { position: fixed; left: 50%; bottom: 42px; transform: translate(-50%, 10px); z-index: 90;
  background: var(--ink-1); color: var(--bg-page); padding: 8px 16px; border-radius: var(--radius-md);
  font-size: 12.5px; opacity: 0; pointer-events: none; transition: all 200ms var(--ease-out); }
body.toast-show .toast { opacity: 1; transform: translate(-50%, 0); }
</style>

<aside class="split-pane" aria-label="分屏详情">
  <div class="split-head"><b>分屏 · 卡片详情</b><span>（openInSplit 演示：常驻面板，非浮层）</span>

  <div class="prose split-body" id="split-body"></div>
</aside>

<!-- 卡片详情 = 整页视图（view-detail），无抽屉浮层 -->

<div class="palette-backdrop" id="palette-backdrop"></div>
<div class="palette" role="dialog" aria-label="命令面板">
  <div class="palette-input-row"><svg class="icon" style="width:15px;height:15px;color:var(--ink-3)"><use href="#i-search"/></svg>
    <input class="palette-input" id="palette-input" type="text" placeholder="输入页面名、动作或卡片标题…" autocomplete="off"></div>
  <div class="palette-list" id="palette-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

/* ── 主题：单主题设定（html data-theme 即真相，暂不做切换 UI） ── */

let toastTimer;
function toast(msg) {
  $('#toast').textContent = msg;
  document.body.classList.add('toast-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.body.classList.remove('toast-show'), 1800);
}

function detailHTML(card) {
  return `
    <p>${$('.card-excerpt', card).textContent}</p>
    <blockquote>这条卡片与「知识的复利来自连接而非收集」建立了引用关系 —— 示例引用</blockquote>
    <p>正文的示例段落。卡片正文支持 Markdown、双链引用与行内 AI 操作；这里仅作为排版样式的占位，展示正文、引用与元信息在详情容器中的层级关系。</p>
    <p>元信息：来源 ${card.dataset.source} · ${card.dataset.time} · 状态 ${card.dataset.statusText}。</p>`;
}
function fillDetail(card) {
  const tags = (card.dataset.tags || '').split(',').filter(Boolean)
    .map(t => `<span class="tag">${t}</span>`).join(' ');
  $('#view-detail').innerHTML = `
    <div class="detail-inner">
      <div class="detail-tags">${tags}</div>
      <h1 class="detail-title">${card.dataset.title}</h1>
      <div class="detail-meta">
        <span>${card.dataset.source}</span><span class="dot"></span>
        <span class="num">${card.dataset.time}</span><span class="dot"></span>
        <span class="status ${card.dataset.status}">${card.dataset.statusText}</span>
      </div>
      <div class="prose">${detailHTML(card)}</div>
      <h2 class="detail-sub">连接</h2>
      <button class="row-item" data-nav><span class="t serif">知识的复利来自连接而非收集</span><span class="m num">被引用 · 方法论</span></button>
      <button class="row-item" data-nav><span class="t serif">双链笔记的涌现结构</span><span class="m num">相关 · 工具</span></button>
      <div class="detail-actions">
        <button class="btn btn-primary"><svg class="icon" style="width:14px;height:14px"><use href="#i-pen"/></svg>编辑</button>
        <button class="btn btn-soft"><svg class="icon" style="width:14px;height:14px"><use href="#i-repeat"/></svg>复习</button>
        <button class="btn btn-ghost"><svg class="icon" style="width:14px;height:14px"><use href="#i-sparkles"/></svg>AI 追问</button>
      </div>
    </div>`;
  $('#view-detail').classList.remove('hidden');
  $$('#view-detail [data-nav]').forEach(b => b.addEventListener('click', () => toast('样板间内连接跳转略')));
}

/* ── 页面栈导航（今日 / 列表 / 详情三视图；栈 + forward buffer） ── */
const VIEW_EL = { today: '#view-today', list: '#view-list', detail: '#view-detail' };
const VIEW_CRUMB = { today: '今日', list: '卡片库', detail: '卡片详情' };
function render() {
  const top = navStack[navStack.length - 1];
  $$('.view').forEach(v => v.classList.add('hidden'));
  if (top.view === 'detail') fillDetail(top.card);
  else $(VIEW_EL[top.view]).classList.remove('hidden');
  $('#crumb').textContent = '· ' + VIEW_CRUMB[top.view];
  $('#nav-today').classList.toggle('active', top.view === 'today');
  $('#nav-cards').classList.toggle('active', top.view !== 'today');
  refreshNavBtns();
}
function pushView(entry) {
  const top = navStack[navStack.length - 1];
  if (top.view === entry.view && top.card === entry.card) return;
  navStack.push(entry); navForward.length = 0; render();
}
function back() { if (navStack.length > 1) { navForward.push(navStack.pop()); render(); } }
function forward() { if (navForward.length) { navStack.push(navForward.pop()); render(); } }
$$('.card').forEach(c => c.addEventListener('click', () => pushView({ view: 'detail', card: c })));

function openSplit(card) {
  const body = $('#split-body');
  body.innerHTML = `<h2 class="serif" style="font-size:17px;font-weight:700;margin-bottom:10px">${card.dataset.title}</h2>` + detailHTML(card);
  document.body.classList.add('split-open');
}
$$('[data-split]').forEach(btn => btn.addEventListener('click', e => {
  e.stopPropagation();
  openSplit(btn.closest('.card'));
}));
$('#split-toggle').addEventListener('click', () => {
  if (document.body.classList.contains('split-open')) document.body.classList.remove('split-open');
  else openSplit($('.card'));
});
$('#split-close').addEventListener('click', () => document.body.classList.remove('split-open'));

const PALETTE_ITEMS = [
  { group: '页面', icon: 'i-flame', label: '今日', nav: true },
  { group: '页面', icon: 'i-layers', label: '卡片库', kbd: 'Ctrl 1', nav: true },
  { group: '页面', icon: 'i-article', label: '文章', kbd: 'Ctrl 2', nav: true },
  { group: '页面', icon: 'i-book', label: '知识库', kbd: 'Ctrl 3', nav: true },
  { group: '页面', icon: 'i-repeat', label: '闪卡复习', nav: true },
  { group: '页面', icon: 'i-sliders', label: '设置', nav: true },
  { group: '动作', icon: 'i-plus', label: '新建卡片', kbd: 'Ctrl N' },
  { group: '动作', icon: 'i-columns', label: '开关分屏面板' },
  { group: '卡片', icon: 'i-pin', label: '知识的复利来自连接而非收集', nav: 'card' },
  { group: '卡片', icon: 'i-layers', label: '卢曼卡片盒：索引是记忆的入口', nav: 'card' },
  { group: '卡片', icon: 'i-repeat', label: '间隔重复的最优间隔并不存在', nav: 'card' },
];
let paletteIndex = 0;
function renderPalette(query = '') {
  const q = query.trim().toLowerCase();
  const hits = PALETTE_ITEMS.filter(it => it.label.toLowerCase().includes(q));
  const list = $('#palette-list');
  if (!hits.length) { list.innerHTML = `<div class="palette-empty">没有匹配「${query}」的结果</div>`; return; }
  paletteIndex = Math.min(paletteIndex, hits.length - 1);
  let html = '', lastGroup = '';
  hits.forEach((it, i) => {
    if (it.group !== lastGroup) { html += `<div class="palette-group">${it.group}</div>`; lastGroup = it.group; }
    html += `<button class="palette-item ${i === paletteIndex ? 'active' : ''}" data-i="${i}">
      <svg class="icon"><use href="#${it.icon}"/></svg>${it.label}${it.kbd ? `<kbd>${it.kbd}</kbd>` : ''}</button>`;
  });
  list.innerHTML = html;
  $$('.palette-item', list).forEach(el => {
    el.addEventListener('click', () => runPaletteItem(hits[+el.dataset.i]));
    el.addEventListener('mousemove', () => { paletteIndex = +el.dataset.i; $$('.palette-item', list).forEach(x => x.classList.toggle('active', x === el)); });
  });
  list._hits = hits;
}
function runPaletteItem(it) {
  closePalette();
  if (it.label.includes('分屏')) { $('#split-toggle').click(); return; }
  if (it.nav === 'card') { toast(`打开卡片：${it.label}`); return; }
  if (it.label === '今日') { pushView({ view: 'today' }); return; }
  if (it.label === '卡片库') { pushView({ view: 'list' }); return; }
  if (it.nav) { toast(`样板间仅实现「今日 / 卡片库」，跳转 ${it.label} 略`); return; }
  toast(`执行动作：${it.label}`);
}
function openPalette() {
  document.body.classList.add('palette-open');
  paletteIndex = 0; renderPalette('');
  $('#palette-input').value = '';
  setTimeout(() => $('#palette-input').focus(), 30);
}
function closePalette() { document.body.classList.remove('palette-open'); }
$('#palette-open-btn').addEventListener('click', openPalette);
$('#palette-backdrop').addEventListener('click', closePalette);
$('#palette-input').addEventListener('input', e => { paletteIndex = 0; renderPalette(e.target.value); });
$('#palette-input').addEventListener('keydown', e => {
  const hits = $('#palette-list')._hits || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = (paletteIndex + 1) % Math.max(hits.length, 1); renderPalette($('#palette-input').value); }
  if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = (paletteIndex - 1 + hits.length) % Math.max(hits.length, 1); renderPalette($('#palette-input').value); }
  if (e.key === 'Enter' && hits[paletteIndex]) { runPaletteItem(hits[paletteIndex]); }
});

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); back(); return; }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); forward(); return; }
  if (e.key === 'Escape') {
    if (document.body.classList.contains('palette-open')) { closePalette(); return; }
    back();
  }
});

$$('.chip-group').forEach(g => $$('.chip', g).forEach(c => c.addEventListener('click', () => {
  $$('.chip', g).forEach(x => x.classList.remove('active')); c.classList.add('active');
})));
$$('.segmented').forEach(g => $$('.seg-btn', g).forEach(b => b.addEventListener('click', () => {
  $$('.seg-btn', g).forEach(x => x.classList.remove('active')); b.classList.add('active');
  toast(b.title === '列表视图' ? '列表视图：布局已切换（演示）' : '网格视图：布局已切换');
})));
$$('[data-nav]').forEach(b => b.addEventListener('click', () => toast('样板间仅实现「今日 / 卡片库」两页')));
$('#sidebar-toggle').addEventListener('click', () => document.body.classList.toggle('collapsed'));
$('#floating-expand').addEventListener('click', () => document.body.classList.remove('collapsed'));
$('#new-card-btn').addEventListener('click', () => toast('新建卡片：快捷卡片窗口（演示）'));

/* ── 平台预览（Win/Mac 标题栏） ── */
const PLAT_KEY = 'tau-mockup-platform';
function applyPlatform(p) {
  document.documentElement.dataset.platform = p;
  $('#platform-toggle').textContent = '平台：' + (p === 'mac' ? 'Mac' : 'Win');
  localStorage.setItem(PLAT_KEY, p);
}
applyPlatform(localStorage.getItem(PLAT_KEY) || 'win');
$('#platform-toggle').addEventListener('click', () => {
  applyPlatform(document.documentElement.dataset.platform === 'mac' ? 'win' : 'mac');
});

/* ── 页面栈（栈 + forward buffer；push 清空 forward——浏览器语义） ── */
const navStack = [{ view: 'today', card: null }];
const navForward = [];
function refreshNavBtns() {
  $('#nav-back').disabled = navStack.length <= 1;
  $('#nav-forward').disabled = navForward.length === 0;
}
$('#nav-back').addEventListener('click', back);
$('#nav-forward').addEventListener('click', forward);
$('#nav-today').addEventListener('click', () => pushView({ view: 'today' }));
$('#nav-cards').addEventListener('click', () => pushView({ view: 'list' }));
render();

/* ── 侧边栏拖宽（可调宽 + 记忆） ── */
const SB_W_KEY = 'tau-mockup-sidebar-w';
const savedW = parseInt(localStorage.getItem(SB_W_KEY), 10);
if (savedW >= 180 && savedW <= 340) document.body.style.setProperty('--sidebar-w', savedW + 'px');
let sbDrag = null;
$('#sidebar-resizer').addEventListener('mousedown', e => {
  sbDrag = { x: e.clientX, w: document.querySelector('.sidebar').offsetWidth };
  $('#sidebar-resizer').classList.add('active');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!sbDrag) return;
  document.body.style.setProperty('--sidebar-w', Math.max(180, Math.min(340, sbDrag.w + e.clientX - sbDrag.x)) + 'px');
});
window.addEventListener('mouseup', () => {
  if (!sbDrag) return;
  sbDrag = null;
  $('#sidebar-resizer').classList.remove('active');
  localStorage.setItem(SB_W_KEY, document.body.style.getPropertyValue('--sidebar-w').replace('px', ''));
});
</script>
