<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>减重 · 二轮 记账本</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shared.css">
<style>
  .page { height: 100%; overflow-y: auto; padding: 2px 4px 24px 2px; margin: -2px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 14px; align-items: start; }
  .left, .right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* 顶部三张：体重 / 热量余额 / 运动 */
  .hero { display: grid; grid-template-columns: 1.1fr 1.25fr 1fr; gap: 14px; }
  .card { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .lbl .icon { width: 13px; height: 13px; }
  .big { display: flex; align-items: baseline; gap: 6px; }
  .big b { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .big .u { font-size: 13px; color: var(--ink-3); }
  .facts { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); }
  .facts span b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-1); }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .slot { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 11px; background: var(--bg-hover); text-align: left; }
  .slot:hover { background: var(--bg-press); }
  .slot .icon { width: 15px; height: 15px; color: var(--ink-3); }
  .slot div { display: flex; flex-direction: column; line-height: 1.35; }
  .slot span { font-size: 11px; color: var(--ink-3); }
  .slot b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .slot.todo { background: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
  .slot.todo b { color: var(--accent-text); font-weight: 500; font-size: 12.5px; }
  .slot.todo .icon { color: var(--accent-text); }

  .budget { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 16px; align-items: center; }
  .ring { position: relative; width: 118px; height: 118px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .ring .mid span { font-size: 11px; color: var(--ink-3); }
  .ring .mid b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ring .mid b.over { color: var(--danger); }
  .brk { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
  .brk .r { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .brk .r b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-1); }
  .brk .r.muted, .brk .r.muted b { color: var(--ink-3); font-weight: 400; }
  .brk .btn { margin-top: 6px; justify-content: center; }

  .mv-bar { height: 10px; border-radius: 5px; background: var(--bg-track); overflow: hidden; }
  .mv-bar i { display: block; height: 100%; border-radius: 5px; background: var(--cat-move); }
  .streaks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .stk { border-radius: 11px; background: var(--bg-hover); padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.35; }
  .stk span { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
  .stk b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stk b small { font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: 2px; }

  /* 趋势：体重 + 摄入，共享横轴的两张图（不做双轴） */
  .trend { padding-bottom: 14px; }
  .trend .chart { margin: 4px 14px 0 4px; }
  .sub-chart-h { display: flex; align-items: center; gap: 8px; padding: 10px 18px 0 18px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .trend .legend { padding: 8px 18px 0; }
  .legend i.bar { width: 8px; height: 10px; border-radius: 2px; background: var(--ink-3); opacity: 0.45; }
  .legend i.bar.ok { background: var(--cat-diet); opacity: 1; }
  .legend i.mv { width: 6px; height: 6px; border-radius: 50%; background: var(--cat-move); }

  /* 习惯格 + 对比 */
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .habit .body { padding: 10px 18px 16px; }
  .hgrid { display: grid; grid-template-columns: 54px repeat(7, 1fr); gap: 4px; align-items: center; }
  .hgrid .wh { font-size: 10.5px; color: var(--ink-3); text-align: center; }
  .hgrid .wl { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .hc { height: 26px; border-radius: 7px; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; gap: 3px; position: relative; }
  .hc i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--line-1); }
  .hc i.e { background: var(--cat-diet); box-shadow: none; }
  .hc i.m { background: var(--cat-move); box-shadow: none; }
  .hc.party::after { content: ""; position: absolute; top: 3px; right: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--cat-cheat); }
  .hc.future { background: none; box-shadow: inset 0 0 0 1px var(--line-2); }
  .hc.today { box-shadow: 0 0 0 1.5px var(--ink-1); }
  .hc:hover:not(.future) { background: var(--bg-press); }
  .hleg { display: flex; gap: 12px; font-size: 11px; color: var(--ink-3); margin-top: 10px; }
  .hleg span { display: inline-flex; align-items: center; gap: 5px; }
  .hleg i { width: 8px; height: 8px; border-radius: 50%; }

  .cmp .body { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
  .cmp-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 76px; gap: 10px; align-items: center; height: 32px; padding: 0 6px; border-radius: 8px; }
  .cmp-row:hover { background: var(--bg-hover); }
  .cmp-row .nm { display: flex; align-items: center; gap: 4px; font-size: 12.5px; }
  .cmp-row .nm i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--line-1); }
  .cmp-row .nm i.e { background: var(--cat-diet); box-shadow: none; }
  .cmp-row .nm i.m { background: var(--cat-move); box-shadow: none; }
  .cmp-row .zone { position: relative; height: 12px; }
  .cmp-row .zone .ax0 { position: absolute; left: 62%; top: -8px; bottom: -8px; width: 1px; background: var(--line-1); }
  .cmp-row .zone .bar { position: absolute; top: 0; height: 12px; }
  .cmp-row .zone .bar.lose { right: 38%; background: var(--div-lose-3); border-radius: 4px 0 0 4px; }
  .cmp-row .zone .bar.gain { left: 62%; background: var(--div-gain-3); border-radius: 0 4px 4px 0; }
  .cmp-row .v { text-align: right; font-size: 12.5px; }
  .cmp-row .v small { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 400; line-height: 1; }
  .cmp-note { font-size: 12px; color: var(--ink-2); line-height: 1.7; padding: 6px 6px 0; }

  /* 右栏：一句话记录 + 今日流水 + AI */
  .quick { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .qin { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--bg-hover); box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow 150ms var(--ease-out); }
  .qin:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--bg-surface); }
  .qin input { flex: 1; min-width: 0; font-size: 13px; }
  .qin input::placeholder { color: var(--ink-3); }
  .preview { display: none; border-radius: 12px; padding: 10px 12px; background: var(--bg-hover); font-size: 12.5px; gap: 6px; flex-direction: column; }
  .preview.show { display: flex; }
  .preview .pr { display: flex; align-items: center; gap: 8px; }
  .preview .pr b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .preview .after { font-size: 12px; color: var(--ink-2); }
  .preview .after b { color: var(--ink-1); }
  .preview .after.over b { color: var(--danger); }
  .preview .eq { font-size: 11.5px; color: var(--ink-3); }
  .ex-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .ex-row button { height: 24px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-1); }
  .ex-row button:hover { color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--accent); }

  .flow .body { padding: 6px 10px 12px; display: flex; flex-direction: column; }
  .it { display: grid; grid-template-columns: 22px 38px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 10px; font-size: 12.5px; }
  .it:hover { background: var(--bg-hover); }
  .it .ci { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
  .it .ci .icon { width: 11px; height: 11px; stroke-width: 2.2; }
  .it .tm { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .it .k { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; }
  .it .k.burn { color: var(--ok); }
  .it.ghost { color: var(--ink-3); }
  .it.ghost .ci { background: none; box-shadow: inset 0 0 0 1px var(--line-1); color: var(--ink-3); }

  .ai-card { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .ai-head { display: flex; align-items: center; gap: 8px; }
  .ai-head b { font-size: 13px; font-weight: 600; }
  .ai-text { font-size: 12.5px; line-height: 1.8; }
  .ai-tabs { margin-left: auto; }
  .ai-tabs button { padding: 0 8px; font-size: 11.5px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data-ledger.js"></script>
<script>window.W.LOG_WEIGHT_ONLY = true;</script>
<script src="shared.js"></script>
<script>
  const root = W.mountShell();
  const icon = W.icon;
  const NOW_LABEL = "12:40";
  let range = 30;
  let aiTab = "today";

  // 演示用的「一句话记录」解析；实现时由 AI 能力完成
  const GUESS = [
    [/奶茶/, "奶茶（全糖）", 380, "diet"],
    [/牛肉面/, "牛肉面", 680, "diet"],
    [/火锅/, "火锅", 1300, "diet"],
    [/烤串|烧烤/, "烤串 10 串", 720, "diet"],
    [/蛋糕/, "蛋糕一块", 420, "diet"],
    [/沙拉/, "鸡胸肉沙拉", 380, "diet"],
    [/苹果/, "苹果", 90, "diet"],
    [/跑/, "跑步 30 分钟", -300, "move", 30],
    [/走|散步/, "散步 30 分钟", -120, "move", 30],
  ];
  const guess = s => {
    for (const [re, text, kcal, kind, min] of GUESS) if (re.test(s)) return { text, kcal, kind, min };
    return s.trim() ? { text: s.trim(), kcal: 450, kind: "diet" } : null;
  };

  function ringSVG(used, budget) {
    const r = 50;
    const c = 2 * Math.PI * r;
    const ratio = Math.min(used / budget, 1);
    const over = used > budget;
    return `<svg width="118" height="118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--bg-track)" stroke-width="10"/>
      <circle cx="59" cy="59" r="${r}" fill="none" stroke="${over ? "var(--danger)" : "var(--cat-diet)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * ratio} ${c}"/></svg>`;
  }

  // 每日摄入柱：对齐体重图横轴（padL 34 / padR 12），预算一条虚线，达标柱用饮食色，超标柱用中性灰
  function intakeChart(el, from) {
    const draw = () => {
      const width = el.clientWidth || 600;
      const h = 110;
      const padL = 34;
      const padR = 12;
      const padT = 8;
      const plotH = h - padT - 20;
      const ds = W.days.filter(d => d.t >= from);
      const max = 3000;
      const x = t => padL + ((t - from) / (W.TODAY - from || 1)) * (width - padL - padR);
      const y = v => padT + (1 - v / max) * plotH;
      const bw = Math.max(3, (width - padL - padR) / ds.length - 3);
      let s = `<svg width="${width}" height="${h}"><g class="grid">`;
      for (const v of [0, 1000, 2000, 3000]) s += `<line x1="${padL}" x2="${width - padR}" y1="${y(v)}" y2="${y(v)}"/>`;
      s += `</g><g class="ax">`;
      for (const v of [0, 1000, 2000, 3000]) s += `<text x="${padL - 8}" y="${y(v) + 3.5}" text-anchor="end">${v ? v / 1000 + "k" : 0}</text>`;
      s += `</g>`;
      for (const d of ds) {
        const ok = d.intake <= W.BUDGET;
        const isToday = d.t === W.TODAY;
        const top = y(d.intake);
        s += `<rect x="${x(d.t) - bw / 2}" y="${top}" width="${bw}" height="${y(0) - top}" rx="${Math.min(4, bw / 2)}" fill="${ok ? "var(--cat-diet)" : "var(--ink-3)"}" opacity="${isToday ? 0.4 : ok ? 0.9 : 0.45}"/>`;
        if (d.moveMin >= W.MOVE_GOAL) s += `<circle cx="${x(d.t)}" cy="${y(0) + 10}" r="3" fill="var(--cat-move)"/>`;
      }
      s += `<line x1="${padL}" x2="${width - padR}" y1="${y(W.BUDGET)}" y2="${y(W.BUDGET)}" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="4 4"/>
        <text x="${width - padR}" y="${y(W.BUDGET) - 5}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">预算 ${W.BUDGET}</text>`;
      s += `<rect class="hit" x="${padL}" y="0" width="${width - padL - padR}" height="${h}" fill="transparent"/></svg><div class="tip"></div>`;
      el.innerHTML = s;
      const tip = el.querySelector(".tip");
      el.querySelector(".hit").addEventListener("mousemove", ev => {
        const mx = ev.clientX - el.getBoundingClientRect().left;
        let best = ds[0];
        for (const d of ds) if (Math.abs(x(d.t) - mx) < Math.abs(x(best.t) - mx)) best = d;
        const diff = best.intake - W.BUDGET;
        tip.innerHTML = `<div class="t-date">${W.mdw(best.t)}${best.t === W.TODAY ? " · 记录中" : ""}</div>
          <div class="t-row"><span class="sw" style="background:var(--cat-diet)"></span>摄入<b>${best.intake} kcal</b></div>
          <div class="t-row"><span class="sw" style="background:var(--ink-3)"></span>相对预算<b class="delta ${diff > 0 ? "up" : "down"}">${diff > 0 ? "+" : "−"}${Math.abs(diff)}</b></div>
          <div class="t-row"><span class="sw" style="background:var(--cat-move)"></span>运动<b>${best.moveMin} 分钟</b></div>`;
        tip.classList.add("show");
        const cx = x(best.t);
        const tw = tip.offsetWidth;
        tip.style.left = `${cx + 14 + tw > width ? cx - tw - 14 : cx + 14}px`;
        tip.style.top = `-20px`;
      });
      el.querySelector(".hit").addEventListener("mouseleave", () => tip.classList.remove("show"));
    };
    draw();
    new ResizeObserver(draw).observe(el);
  }

  // 四组对比：两项都做 / 只少吃 / 只多动 / 都没做 → 次晨晨重平均变化
  function groups() {
    const has = (d, a) => d.actions.includes(a);
    const defs = [
      ["both", "都做到", d => has(d, "eat") && has(d, "move"), "e m"],
      ["eat", "只少吃", d => has(d, "eat") && !has(d, "move"), "e"],
      ["move", "只多动", d => !has(d, "eat") && has(d, "move"), "m"],
      ["none", "都没做", d => !has(d, "eat") && !has(d, "move"), ""],
    ];
    return defs.map(([id, name, f, dots]) => {
      const ds = W.days.filter(d => d.next != null && f(d));
      return { id, name, dots, n: ds.length, v: ds.reduce((s, d) => s + d.next, 0) / (ds.length || 1) };
    });
  }

  function streak(id) {
    let s = 0;
    for (let k = W.days.length - 2; k >= 0 && W.days[k].actions.includes(id); k--) s++;
    return s;
  }

  function render() {
    const S = W.summary();
    const t = W.today();
    const prev = W.days[t.i - 1];
    const left = W.BUDGET - t.intake;
    const weekStart = W.TODAY - ((new Date(W.TODAY).getDay() + 6) % 7) * W.D;
    const weekMove = W.days.filter(d => d.t >= weekStart && d.moveMin >= W.MOVE_GOAL).length;
    const gs = groups();
    const gmax = Math.max(...gs.map(g => Math.abs(g.v)), 0.2);

    // 习惯格：最近 8 周，周一开头
    const firstMon = weekStart - 7 * 7 * W.D;
    let hg = `<span></span>${"一二三四五六日".split("").map(c => `<span class="wh">${c}</span>`).join("")}`;
    for (let w = 0; w < 8; w++) {
      const ws = firstMon + w * 7 * W.D;
      hg += `<span class="wl">${W.md(ws)}</span>`;
      for (let k = 0; k < 7; k++) {
        const d = W.dayAt(ws + k * W.D);
        if (!d) {
          hg += `<span class="hc future"></span>`;
          continue;
        }
        const live = d.t === W.TODAY;
        hg += `<span class="hc ${live ? "today" : ""} ${d.party ? "party" : ""}" title="${W.mdw(d.t)} · 摄入 ${d.intake} · 运动 ${d.moveMin} 分钟${live ? "（记录中）" : ""}">
          <i class="${!live && d.actions.includes("eat") ? "e" : ""}"></i><i class="${d.actions.includes("move") ? "m" : ""}"></i></span>`;
      }
    }

    root.innerHTML = `
    <div class="page scroller">
      <div class="grid">
        <div class="left">
          <div class="hero">
            <div class="panel card">
              <span class="lbl">${icon("sunrise")}今天晨重 · ${W.mdw(t.t)}</span>
              <div class="big"><b>${W.kg(t.am)}</b><span class="u">kg</span><span class="delta ${W.deltaCls(t.am - prev.am)}" style="margin-left:6px;font-size:13px">${W.signed(t.am - prev.am)}</span></div>
              <div class="facts"><span>7 日均值 <b>${W.kg(S.latest.avg)}</b></span><span>已减 <b>${S.lost.toFixed(1)}</b></span><span>距目标 <b>${S.toGoal.toFixed(1)}</b></span></div>
              <div class="slots">
                <button class="slot" data-log>${icon("sunrise")}<div><span>起床 07:12</span><b>${W.kg(t.am)}</b></div></button>
                <button class="slot todo" data-log>${icon("sunset")}<div><span>睡前</span><b>＋ 记一下</b></div></button>
              </div>
            </div>
            <div class="panel card">
              <span class="lbl">${icon("utensils")}今天还能吃</span>
              <div class="budget">
                <div class="ring">${ringSVG(t.intake, W.BUDGET)}<div class="mid"><b class="num ${left < 0 ? "over" : ""}">${left < 0 ? "−" : ""}${Math.abs(left)}</b><span>${left < 0 ? "已超 kcal" : "kcal"}</span></div></div>
                <div class="brk">
                  <div class="r">已吃<b>${t.intake}</b></div>
                  <div class="r">运动消耗<b class="delta down">${t.burn ? "−" + t.burn : 0}</b></div>
                  <div class="r muted">预算<b>${W.BUDGET}</b></div>
                  <button class="btn btn-soft" data-focus>${icon("plus")}记一笔</button>
                </div>
              </div>
            </div>
            <div class="panel card">
              <span class="lbl">${icon("footprints")}今天运动</span>
              <div class="big"><b>${t.moveMin}</b><span class="u">/ ${W.MOVE_GOAL} 分钟</span></div>
              <div class="mv-bar"><i style="width:${Math.min(100, (t.moveMin / W.MOVE_GOAL) * 100)}%"></i></div>
              <div class="streaks">
                <div class="stk"><span><i class="sw" style="width:7px;height:7px;border-radius:50%;background:var(--cat-diet)"></i>少吃连续</span><b>${streak("eat")}<small>天</small></b></div>
                <div class="stk"><span><i class="sw" style="width:7px;height:7px;border-radius:50%;background:var(--cat-move)"></i>本周多动</span><b>${weekMove}<small>/ 7 天</small></b></div>
              </div>
            </div>
          </div>

          <div class="panel trend">
            <div class="panel-head"><span class="panel-title">体重</span><span class="panel-sub">点 = 晨重，线 = 7 日均值</span><span class="spacer"></span>
              <div class="seg" id="range"><button data-r="14" class="${range === 14 ? "on" : ""}">2 周</button><button data-r="30" class="${range === 30 ? "on" : ""}">月</button><button data-r="60" class="${range === 60 ? "on" : ""}">全部</button></div>
              <div class="seg" id="pmseg"><button data-pm="0" class="on">晨重</button><button data-pm="1">+ 睡前</button></div>
            </div>
            <div class="chart" id="trend"></div>
            <div class="sub-chart-h">每天吃了多少<span class="panel-sub" style="font-weight:400">同一时间轴</span></div>
            <div class="chart" id="intake"></div>
            <div class="legend"><span><i class="dot"></i>晨重</span><span><i></i>7 日均值</span><span><i class="dash"></i>目标 ${W.GOAL}</span>
              <span><i class="bar ok"></i>没超预算</span><span><i class="bar"></i>超预算</span><span><i class="mv"></i>运动达标</span></div>
          </div>

          <div class="row2">
            <div class="panel habit">
              <div class="panel-head"><span class="panel-title">打卡</span><span class="panel-sub">最近 8 周，由记录自动判定</span></div>
              <div class="body"><div class="hgrid">${hg}</div>
                <div class="hleg"><span><i style="background:var(--cat-diet)"></i>少吃 ≤ ${W.BUDGET} kcal</span><span><i style="background:var(--cat-move)"></i>多动 ≥ ${W.MOVE_GOAL} 分钟</span><span><i style="background:var(--cat-cheat);width:5px;height:5px"></i>聚餐</span></div></div>
            </div>
            <div class="panel cmp">
              <div class="panel-head"><span class="panel-title">做到了，第二天轻多少</span></div>
              <div class="body">
                ${gs.map(g => `<div class="cmp-row"><span class="nm"><i class="${g.dots.includes("e") ? "e" : ""}"></i><i class="${g.dots.includes("m") ? "m" : ""}"></i>&nbsp;${g.name}</span>
                  <div class="zone"><div class="ax0"></div><div class="bar ${g.v < 0 ? "lose" : "gain"}" style="opacity:${g.n < 5 ? 0.4 : 1};width:${(Math.abs(g.v) / gmax) * (g.v < 0 ? 62 : 38)}%"></div></div>
                  <span class="v delta ${W.deltaCls(g.v, 0.02)}">${W.signed(g.v, 2)} kg<small>${g.n < 5 ? "样本少 · " : ""}${g.n} 天</small></span></div>`).join("")}
                <p class="cmp-note">次日晨重减当日晨重的平均值。对你来说<b>少吃是主力</b>：只少吃的日子平均 ${W.signed(gs[1].v, 2)}，两样都做到最好（${W.signed(gs[0].v, 2)}）。「只多动」的日子太少，还看不出结论。</p>
              </div>
            </div>
          </div>
        </div>

        <div class="right">
          <div class="panel quick">
            <div class="lbl">${icon("pen")}一句话记录<span class="spacer"></span><span class="ai-meta">${NOW_LABEL}</span></div>
            <div class="qin"><input id="q" placeholder="吃之前先写下来：奶茶一杯 / 跑步 30 分钟"><button class="icon-btn" id="q-go">${icon("send")}</button></div>
            <div class="preview" id="pv"></div>
            <div class="ex-row"><button>奶茶一杯</button><button>晚饭牛肉面</button><button>散步 30 分钟</button></div>
          </div>
          <div class="panel flow">
            <div class="panel-head"><span class="panel-title">今天</span><span class="panel-sub">${t.meals.length} 餐 · ${t.moves.length} 次运动</span></div>
            <div class="body">
              ${[
                ...t.meals.map((m, k) => ({ kind: "diet", tm: m.tm || ["07:30", "12:10", "15:20"][k] || NOW_LABEL, ...m })),
                ...t.moves.map(m => ({ kind: "move", tm: m.tm || "", slot: "运动", ...m })),
              ]
                .sort((a, b) => a.tm.localeCompare(b.tm))
                .map(
                  m => `<div class="it"><span class="ci c-${m.kind}">${icon(m.kind === "move" ? "footprints" : "utensils")}</span><span class="tm">${m.tm}</span><span>${m.text}</span><span class="k ${m.kind === "move" ? "burn" : ""}">${m.kind === "move" ? "−" + m.kcal : m.kcal}</span></div>`
                )
                .join("")}
              <div class="it ghost"><span class="ci">${icon("utensils")}</span><span class="tm">晚饭</span><span>还没记 · 建议 ≤ ${Math.max(0, left - 100)} kcal</span><span></span></div>
              <div class="it ghost"><span class="ci">${icon("footprints")}</span><span class="tm">运动</span><span>还差 ${Math.max(0, W.MOVE_GOAL - t.moveMin)} 分钟</span><span></span></div>
            </div>
          </div>
          <div class="ai-card">
            <div class="ai-head"><span class="ai-mark">${icon("sparkles")}</span><b>AI</b>
              <div class="seg ai-tabs"><button data-ai="today" class="${aiTab === "today" ? "on" : ""}">今天</button><button data-ai="week" class="${aiTab === "week" ? "on" : ""}">本周</button></div></div>
            <div class="ai-text" id="ai"></div>
            <div class="ai-input"><input placeholder="问问你的数据…"><button class="icon-btn">${icon("send")}</button></div>
          </div>
        </div>
      </div>
    </div>`;

    const from = W.TODAY - (range - 1) * W.D;
    const trend = W.trendChart(root.querySelector("#trend"), { from, height: 210, strip: false, bands: false, goal: range > 14 });
    intakeChart(root.querySelector("#intake"), from);
    root.querySelectorAll("#range button").forEach(b => b.addEventListener("click", () => ((range = +b.dataset.r), render())));
    root.querySelectorAll("#pmseg button").forEach(b =>
      b.addEventListener("click", () => {
        root.querySelectorAll("#pmseg button").forEach(x => x.classList.toggle("on", x === b));
        trend.redraw({ pm: b.dataset.pm === "1" });
      })
    );

    const AI = {
      today: [
        `<p>中午为止吃了 <b>${t.intake}</b> kcal，还剩 <b>${left}</b>。晚饭控制在 ${left - 100} 以内，今天就是「少吃」日，连续第 ${streak("eat") + 1} 天。</p>`,
        `<p>今天还没动。你的记录里，<b>晚饭后散步 30 分钟</b>是最容易坚持的一项，走完还能多出约 120 kcal 余量。</p>`,
      ],
      week: [
        `<p>本周均值 <b>${W.kg(S.latest.avg)}</b>，速率 <span class="delta down">${W.signed(S.week, 2)}</span> kg/周，在健康区间里。</p>`,
        `<p>超预算的日子都在<b>周五、周六</b>，基本是聚餐；第二天晨重平均涨 ${W.signed(W.effects().find(e => e.id === "party").diff, 1)} kg，两三天回落。下周如果有饭局，前后两天把预算压到 1500。</p>`,
      ],
    };
    W.streamAI(root.querySelector("#ai"), AI[aiTab]);
    root.querySelectorAll("[data-ai]").forEach(b => b.addEventListener("click", () => ((aiTab = b.dataset.ai), W.streamAI(root.querySelector("#ai"), AI[aiTab]), root.querySelectorAll("[data-ai]").forEach(x => x.classList.toggle("on", x === b)))));

    // 吃之前先写：输入即预估，显示记下后的余额和「要走多久才能抵掉」
    const q = root.querySelector("#q");
    const pv = root.querySelector("#pv");
    const update = () => {
      const g = guess(q.value);
      if (!g) return pv.classList.remove("show");
      const after = left - g.kcal;
      pv.innerHTML =
        g.kind === "move"
          ? `<div class="pr"><span class="ci" style="--c:var(--cat-move)"></span>${g.text}<b class="delta down">−${-g.kcal} kcal</b></div><div class="after">记下后还能吃 <b>${after}</b> kcal</div>`
          : `<div class="pr">${g.text}<b>≈ ${g.kcal} kcal</b></div>
             <div class="after ${after < 0 ? "over" : ""}">记下后${after < 0 ? "超出预算" : "还能吃"} <b>${Math.abs(after)}</b> kcal</div>
             <div class="eq">相当于散步 ${Math.round(g.kcal / 4)} 分钟 · AI 估算，可修改</div>`;
      pv.classList.add("show");
    };
    q.addEventListener("input", update);
    root.querySelectorAll(".ex-row button").forEach(b => b.addEventListener("click", () => ((q.value = b.textContent), q.focus(), update())));
    const commit = () => {
      const g = guess(q.value);
      if (!g) return;
      if (g.kind === "move") t.moves.push({ text: g.text, min: g.min, kcal: -g.kcal, tm: NOW_LABEL });
      else t.meals.push({ slot: "加餐", text: g.text, kcal: g.kcal, tm: NOW_LABEL });
      W.recalc(t);
      W.toast(`已记下 ${g.text}`);
      render();
    };
    q.addEventListener("keydown", e => e.key === "Enter" && !e.isComposing && commit());
    root.querySelector("#q-go").onclick = commit;
    root.querySelector("[data-focus]").onclick = () => q.focus();
    root.querySelectorAll("[data-log]").forEach(b => b.addEventListener("click", () => W.openLog("weight", render)));
  }
  render();
</script>
</body>
</html>
