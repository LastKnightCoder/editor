<!doctype html>
<html lang="zh-CN" data-theme="ocean" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据库日期单元格 · 三个方向</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  /* ---------- tokens：取值与 packages/themes/src/tokens.css 一致（海盐 / 暖纸 × 明暗） ---------- */
  [data-theme="ocean"][data-mode="light"] {
    color-scheme: light;
    --page: #edf2f8; --surface: #fcfdff; --surface-hover: #f2f3f6; --sunken: #d6e0ec;
    --hover: rgba(45, 54, 68, 0.05); --press: rgba(45, 54, 68, 0.09); --selected: rgba(77, 127, 196, 0.12);
    --ink-1: #2d3644; --ink-2: #56637a; --ink-3: #a6b1c2; --ink-inverse: #f7faff;
    --line-1: #dde5ef; --line-2: rgba(221, 229, 239, 0.55);
    --accent: hsl(214 50% 44%); --accent-soft: hsla(214, 50%, 44%, 0.12); --accent-text: #35659f;
    --tag-1: #527f63; --tag-1-soft: #e2eee6; --tag-2: #4d6f9e; --tag-2-soft: #dfe9f5; --tag-4: #97894e; --tag-4-soft: #f3eed6;
    --shadow-card: 0 1px 2px rgba(60, 80, 120, 0.06), 0 10px 24px -14px rgba(60, 80, 120, 0.2);
    --shadow-lift: 0 1px 2px rgba(60, 80, 120, 0.07), 0 6px 16px -10px rgba(60, 80, 120, 0.24);
  }
  [data-theme="ocean"][data-mode="dark"] {
    color-scheme: dark;
    --page: #161c25; --surface: #1f2733; --surface-hover: #2b333f; --sunken: #0b1017;
    --hover: rgba(227, 234, 244, 0.06); --press: rgba(227, 234, 244, 0.11); --selected: hsla(214, 62%, 66%, 0.2);
    --ink-1: #e3eaf4; --ink-2: #9aa7b9; --ink-3: #748196; --ink-inverse: #0f1722;
    --line-1: #2c3542; --line-2: rgba(44, 53, 66, 0.55);
    --accent: hsl(214 62% 66%); --accent-soft: hsla(214, 62%, 66%, 0.16); --accent-text: hsl(214 70% 72%);
    --tag-1: #82b394; --tag-1-soft: #1f2e26; --tag-2: #86abd9; --tag-2-soft: #1c2838; --tag-4: #c9b36a; --tag-4-soft: #2e2a1a;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.24), 0 10px 24px -14px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 1px 2px rgba(0, 0, 0, 0.26), 0 6px 16px -10px rgba(0, 0, 0, 0.52);
  }
  [data-theme="paper"][data-mode="light"] {
    color-scheme: light;
    --page: #f3eee2; --surface: #fffdf9; --surface-hover: #f6f3ef; --sunken: #e7dbc8;
    --hover: rgba(67, 57, 44, 0.05); --press: rgba(67, 57, 44, 0.09); --selected: rgba(217, 119, 87, 0.12);
    --ink-1: #43392c; --ink-2: #6a5c49; --ink-3: #a89a85; --ink-inverse: #fff8ef;
    --line-1: #e9e1d2; --line-2: rgba(233, 225, 210, 0.55);
    --accent: hsl(22 58% 42%); --accent-soft: hsla(22, 58%, 42%, 0.12); --accent-text: #a05236;
    --tag-1: #61795f; --tag-1-soft: #e5ede2; --tag-2: #5c7d99; --tag-2-soft: #e2ebf3; --tag-4: #a38c4d; --tag-4-soft: #f6efd6;
    --shadow-card: 0 1px 2px rgba(120, 100, 70, 0.05), 0 10px 24px -14px rgba(120, 100, 70, 0.18);
    --shadow-lift: 0 1px 2px rgba(120, 100, 70, 0.06), 0 6px 16px -10px rgba(120, 100, 70, 0.22);
  }
  [data-theme="paper"][data-mode="dark"] {
    color-scheme: dark;
    --page: #221d16; --surface: #2e2820; --surface-hover: #39332b; --sunken: #100d08;
    --hover: rgba(236, 226, 208, 0.06); --press: rgba(236, 226, 208, 0.11); --selected: hsla(22, 62%, 65%, 0.2);
    --ink-1: #ece2d0; --ink-2: #a89a85; --ink-3: #857768; --ink-inverse: #241a10;
    --line-1: #3a3227; --line-2: rgba(58, 50, 39, 0.55);
    --accent: hsl(22 62% 65%); --accent-soft: hsla(22, 62%, 65%, 0.16); --accent-text: hsl(22 66% 70%);
    --tag-1: #8cab87; --tag-1-soft: #243023; --tag-2: #83aecf; --tag-2-soft: #1e2a35; --tag-4: #c4a458; --tag-4-soft: #302917;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.24), 0 10px 24px -14px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 1px 2px rgba(0, 0, 0, 0.26), 0 6px 16px -10px rgba(0, 0, 0, 0.52);
  }
  :root {
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink-1); font: 13px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 14px; height: 14px; flex: none; stroke-width: 1.75; }

  /* ---------- mock 控制条（不属于方案） ---------- */
  .ctrl { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 28px;
    background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(12px); }
  .ctrl h1 { font-size: 13.5px; font-weight: 600; margin-right: 4px; }
  .grp { display: flex; gap: 2px; padding: 2px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line-1); }
  .grp button { height: 26px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; color: var(--ink-2); transition: background-color .16s var(--ease), color .16s var(--ease); }
  .grp button.on { background: var(--surface); color: var(--ink-1); font-weight: 500; box-shadow: var(--shadow-lift); }
  .grp button .rec { font-size: 10.5px; color: var(--accent-text); margin-left: 4px; }
  .ctrl .sp { flex: 1; }
  .ctrl .note { font-size: 12px; color: var(--ink-3); }

  .stage { padding: 8px 28px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1320px; }
  .intro { padding: 4px 2px 0; }
  .intro h2 { font-size: 16px; font-weight: 600; }
  .intro p { color: var(--ink-2); max-width: 820px; margin-top: 2px; }
  .intro ul { color: var(--ink-2); margin: 6px 0 0 18px; font-size: 12.5px; }
  .paper { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-card); overflow: hidden; }
  .sec-title { font-size: 12px; color: var(--ink-3); padding: 0 2px 8px; letter-spacing: .02em; }

  /* ---------- 表格 ---------- */
  .dbh { padding: 22px 24px 10px; display: flex; align-items: center; gap: 10px; }
  .dbh h3 { font-size: 19px; font-weight: 600; }
  .dbh svg { width: 18px; height: 18px; color: var(--ink-3); }
  .tbl-wrap { overflow-x: auto; padding: 0 24px 20px; }
  .tbl { display: grid; grid-template-columns: var(--cols); width: max-content; min-width: 100%; }
  .th { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--ink-2); font-size: 12.5px;
    border-bottom: 1px solid var(--line-1); white-space: nowrap; overflow: hidden; }
  .th svg { color: var(--ink-3); }
  .th small { color: var(--ink-3); font-size: 11px; }
  .td { height: 40px; display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid var(--line-2);
    min-width: 0; overflow: hidden; container-type: inline-size; }
  .td + .td, .th + .th { box-shadow: -1px 0 0 var(--line-2); }
  .td.title { font-weight: 500; white-space: nowrap; }
  .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
  .tag.t1 { background: var(--tag-1-soft); color: var(--tag-1); }
  .tag.t2 { background: var(--tag-2-soft); color: var(--tag-2); }
  .tag.t4 { background: var(--tag-4-soft); color: var(--tag-4); }

  /* ---------- 日期视图：公共 ---------- */
  .dv { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; font-size: 13px; font-variant-numeric: tabular-nums; }
  .dv > * { flex: none; }
  .dv .main { color: var(--ink-1); }
  .dv .sub { color: var(--ink-3); font-size: 12px; }
  .dv .time { color: var(--ink-2); }
  .dv .dur { color: var(--ink-3); font-size: 12px; }
  .dv.past .main, .dv.past .time { color: var(--ink-3); }
  .dv .main.today { color: var(--accent-text); font-weight: 500; }
  .old { color: var(--ink-1); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* A 排版层次 */
  .a .arw { color: var(--ink-3); font-size: 12px; }
  .a .left { color: var(--accent-text); font-size: 12px; }
  .a .open { color: var(--ink-3); font-size: 12px; }

  /* B 日历签 */
  .tile { display: inline-flex; flex-direction: column; width: 26px; height: 28px; border-radius: 5px; overflow: hidden;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-1), 0 1px 1px var(--line-2); text-align: center; }
  .tile i { font-style: normal; font-size: 8.5px; line-height: 10px; height: 10px; background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
  .tile b { flex: 1; font-size: 12.5px; line-height: 17px; font-weight: 600; color: var(--ink-1); }
  .tile.today i { background: var(--accent); color: var(--ink-inverse); }
  .tile.past i { background: var(--hover); color: var(--ink-3); }
  .tile.past b { color: var(--ink-3); font-weight: 500; }
  .b .stack { display: flex; flex-direction: column; line-height: 15px; }
  .b .stack .l1 { font-size: 12px; color: var(--ink-2); }
  .b .stack .l2 { font-size: 11px; color: var(--ink-3); }
  .b .link { position: relative; width: 44px; height: 14px; display: inline-flex; align-items: center; justify-content: center; }
  .b .link::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line-1); }
  .b .link em { position: relative; font-style: normal; font-size: 10.5px; color: var(--ink-3); background: var(--surface); padding: 0 3px; }
  .b .link.live::before { border-top-color: var(--accent); }
  .b .link.live em { color: var(--accent-text); }
  .b .link.open::before { border-top-style: dashed; }
  .b .t2 { font-size: 12px; color: var(--ink-2); }

  /* C 时间条 */
  .bar { position: relative; display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px;
    box-shadow: inset 0 0 0 1px var(--line-1); overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p); background: var(--accent-soft); }
  .bar .fill::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--accent); }
  .bar .lab { position: relative; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-1); }
  .bar .lab .arw { color: var(--ink-3); font-size: 11px; }
  .bar.done .fill { width: 100%; background: var(--hover); }
  .bar.done .fill::after, .bar.upcoming .fill { display: none; }
  .bar.done .lab { color: var(--ink-3); }
  .bar.upcoming { box-shadow: none; background: repeating-linear-gradient(-45deg, transparent 0 5px, var(--line-2) 5px 6px); outline: 1px dashed var(--line-1); outline-offset: -1px; }
  .bar.open .fill { width: 100%; background: linear-gradient(90deg, var(--accent-soft) 60%, transparent); }
  .bar.open .fill::after { display: none; }
  .c .rel { font-size: 12px; color: var(--ink-3); }
  .c .rel.live { color: var(--accent-text); }

  /* 窄列退化：先丢次级信息，再截断 */
  @container (max-width: 190px) {
    .dv .sub, .dv .dur, .a .left, .c .rel, .b .stack .l2 { display: none; }
    .b .link { width: 18px; }
    .b .link em { display: none; }
  }
  @container (max-width: 130px) {
    .dv .time { display: none; }
  }

  /* ---------- 看板卡片 + 规则表 ---------- */
  .row2 { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .kanban { display: flex; gap: 12px; padding: 16px; background: var(--page); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line-1); }
  .card { width: 170px; flex: none; background: var(--surface); border-radius: 10px; padding: 10px 11px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 8px; }
  .card .ct { font-weight: 500; }
  .card .fields { border-top: 1px solid var(--line-2); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .card .f { display: flex; align-items: center; gap: 6px; }
  .card .f .fl { font-size: 11px; color: var(--ink-3); width: 26px; flex: none; }
  .card .f .fv { flex: 1; min-width: 0; container-type: inline-size; overflow: hidden; }
  .rules { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rules th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 8px 12px; border-bottom: 1px solid var(--line-1); }
  .rules td { padding: 7px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  .rules td:first-child { color: var(--ink-2); }
  .rules td.o { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rules td.n { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="ctrl">
  <h1>数据库日期单元格</h1>
  <div class="grp" data-key="dir">
    <button data-v="old">现状</button>
    <button data-v="a">A 排版层次</button>
    <button data-v="b">B 日历签</button>
    <button data-v="c" class="on">C 时间条<span class="rec">推荐</span></button>
  </div>
  <div class="grp" data-key="theme"><button data-v="ocean" class="on">海盐</button><button data-v="paper">暖纸</button></div>
  <div class="grp" data-key="mode"><button data-v="light" class="on">浅色</button><button data-v="dark">深色</button></div>
  <div class="grp" data-key="width"><button data-v="std" class="on">标准列宽</button><button data-v="narrow">窄列</button></div>
  <span class="sp"></span>
  <span class="note">「现在」固定为 2026-09-30 周三 15:10</span>
</div>

<div class="stage">
  <div class="intro" id="intro"></div>

  <div class="paper">
    <div class="dbh"><i data-lucide="table-2"></i><h3>项目排期</h3></div>
    <div class="tbl-wrap"><div class="tbl" id="tbl"></div></div>
  </div>

  <div class="row2">
    <div>
      <div class="sec-title">看板卡片（卡片宽 170px，自动走窄列退化）</div>
      <div class="kanban" id="kanban"></div>
    </div>
    <div>
      <div class="sec-title">格式规则（三个方向共用同一套文案）</div>
      <div class="paper"><table class="rules" id="rules"></table></div>
    </div>
  </div>
</div>

<script>
/* ================= 时间基准 ================= */
const NOW = new Date(2026, 8, 30, 15, 10).getTime();
const DAY = 86400000;
const THIS_YEAR = new Date(NOW).getFullYear();
const D = (y, m, d, h = 0, mi = 0) => new Date(y, m - 1, d, h, mi).getTime();
const sod = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayDiff = (a, b) => Math.round((sod(a) - sod(b)) / DAY);
const pad = n => String(n).padStart(2, "0");
const yearOf = ts => new Date(ts).getFullYear();
const weekday = ts => "周" + "日一二三四五六"[new Date(ts).getDay()];
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const md = (ts, withYear) => { const d = new Date(ts); return `${withYear ? d.getFullYear() + "年" : ""}${d.getMonth() + 1}月${d.getDate()}日`; };

/* ================= 共用文案规则 ================= */
// 单日主文案：±1 天用相对词，本年省略年份
function dayWord(ts) {
  const dd = dayDiff(ts, NOW);
  if (dd === 0) return "今天";
  if (dd === 1) return "明天";
  if (dd === -1) return "昨天";
  return md(ts, yearOf(ts) !== THIS_YEAR);
}
function span(n) {
  return n < 14 ? `${n} 天` : n < 60 ? `${Math.round(n / 7)} 周` : n < 365 ? `${Math.round(n / 30)} 个月` : `${Math.round(n / 365)} 年`;
}
function relHint(ts) {
  const dd = dayDiff(ts, NOW);
  if (dd === 0) return "今天";
  if (dd === 1) return "明天";
  if (dd === -1) return "昨天";
  return dd > 0 ? `${span(dd)}后` : `${span(-dd)}前`;
}
function leftText(ms) {
  const mins = Math.round(ms / 60000);
  if (mins < 60) return `${mins} 分钟`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return m ? `${h} 小时 ${m} 分` : `${h} 小时`;
  return `${Math.round(h / 24)} 天`;
}
function singleState(ts, showTime) {
  const dd = dayDiff(ts, NOW);
  if (dd < 0 || (showTime && dd === 0 && ts < NOW)) return "past";
  return dd === 0 ? "today" : "future";
}
// 范围文案：跨年才写两次年份，同月省略结束月份，同日只写一次日期
function rangeParts(s, e, showTime) {
  const sy = yearOf(s), ey = yearOf(e);
  if (dayDiff(s, e) === 0) {
    return { sameDay: true, day: dayWord(s), time: showTime ? `${hm(s)} – ${hm(e)}` : null };
  }
  const crossYear = sy !== ey;
  const a = md(s, crossYear || sy !== THIS_YEAR);
  const sameMonth = !crossYear && new Date(s).getMonth() === new Date(e).getMonth();
  const b = crossYear ? md(e, true) : sameMonth && !showTime ? `${new Date(e).getDate()}日` : md(e, false);
  return { a, b, at: showTime ? hm(s) : null, bt: showTime ? hm(e) : null };
}
function duration(s, e, showTime) {
  if (showTime) {
    const mins = Math.round((e - s) / 60000);
    if (mins < 60) return `${mins} 分钟`;
    const h = mins / 60;
    return h < 24 ? `${+h.toFixed(1)} 小时` : `${+(h / 24).toFixed(1)} 天`;
  }
  return `${dayDiff(e, s) + 1} 天`;
}
// 范围相对于「现在」的状态：未开始 / 进行中（附进度）/ 已结束
function rangeStatus(s, e, showTime) {
  const start = showTime ? s : sod(s);
  const end = showTime ? e : sod(e) + DAY;
  if (NOW < start) {
    const hint = showTime && dayDiff(s, NOW) === 0 ? `${leftText(start - NOW)}后开始` : `${relHint(s)}开始`;
    return { state: "upcoming", p: 0, hint };
  }
  if (NOW >= end) return { state: "done", p: 1, hint: "已结束" };
  const p = (NOW - start) / (end - start);
  const hint = showTime
    ? `剩 ${leftText(end - NOW)}`
    : dayDiff(e, NOW) === 0 ? "今天结束" : `剩 ${dayDiff(e, NOW)} 天`;
  return { state: "live", p, hint };
}
// 现状实现：formatDateRange 的原样输出
function oldFormat(v, cfg) {
  if (!v || (v.start == null && v.end == null)) return "";
  const f = ts => { if (ts == null) return ""; const d = new Date(ts);
    const base = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    return cfg.showTime ? `${base} ${pad(d.getHours())}:${pad(d.getMinutes())}:00` : base; };
  if (!cfg.isRange || v.start === v.end) return f(v.start);
  if (v.start != null && v.end != null) return `${f(v.start)} ~ ${f(v.end)}`;
  return f(v.start) || f(v.end);
}

/* ================= 三个方向的渲染 ================= */
const R = {
  old(v, cfg) { return `<span class="old">${oldFormat(v, cfg)}</span>`; },

  a(v, cfg) {
    const { start: s, end: e } = v;
    if (!cfg.isRange || e === s) {
      const st = singleState(s, cfg.showTime);
      const word = dayWord(s);
      const isRel = word.endsWith("天") && word.length === 2;
      return `<span class="dv a ${st === "past" ? "past" : ""}">
        <span class="main ${st === "today" ? "today" : ""}">${word}</span>
        ${!isRel || !cfg.showTime ? `<span class="sub">${weekday(s)}</span>` : ""}
        ${cfg.showTime ? `<span class="time">${hm(s)}</span>` : ""}
      </span>`;
    }
    if (e == null) {
      return `<span class="dv a"><span class="main">${md(s, yearOf(s) !== THIS_YEAR)}</span><span class="open">起 · 已 ${span(dayDiff(NOW, s))}</span></span>`;
    }
    const r = rangeParts(s, e, cfg.showTime);
    const st = rangeStatus(s, e, cfg.showTime);
    const tail = st.state === "live" ? `<span class="left">${st.hint}</span>` : `<span class="dur">${duration(s, e, cfg.showTime)}</span>`;
    if (r.sameDay) {
      return `<span class="dv a ${st.state === "done" ? "past" : ""}">
        <span class="main ${r.day === "今天" && st.state !== "done" ? "today" : ""}">${r.day}</span>
        ${r.time ? `<span class="time">${r.time}</span>` : ""}${tail}</span>`;
    }
    return `<span class="dv a ${st.state === "done" ? "past" : ""}">
      <span class="main">${r.a}${r.at ? ` <span class="time">${r.at}</span>` : ""}</span>
      <span class="arw">→</span>
      <span class="main">${r.b}${r.bt ? ` <span class="time">${r.bt}</span>` : ""}</span>
      ${tail}</span>`;
  },

  b(v, cfg) {
    const { start: s, end: e } = v;
    const tile = (ts, st) => { const d = new Date(ts);
      return `<span class="tile ${st}"><i>${d.getMonth() + 1}月</i><b>${d.getDate()}</b></span>`; };
    if (!cfg.isRange || e === s) {
      const st = singleState(s, cfg.showTime);
      const dd = dayDiff(s, NOW);
      const l1 = Math.abs(dd) <= 1 ? dayWord(s) : weekday(s);
      return `<span class="dv b">${tile(s, st)}<span class="stack"><span class="l1">${l1}${cfg.showTime ? " " + hm(s) : ""}</span>${
        yearOf(s) !== THIS_YEAR ? `<span class="l2">${yearOf(s)}</span>` : ""}</span></span>`;
    }
    if (e == null) {
      return `<span class="dv b">${tile(s, "")}<span class="link open"><em>至今</em></span><span class="t2">已 ${span(dayDiff(NOW, s))}</span></span>`;
    }
    const st = rangeStatus(s, e, cfg.showTime);
    const tst = st.state === "done" ? "past" : "";
    const r = rangeParts(s, e, cfg.showTime);
    if (r.sameDay) {
      return `<span class="dv b">${tile(s, tst || (dayDiff(s, NOW) === 0 ? "today" : ""))}<span class="stack"><span class="l1">${r.time || dayWord(s)}</span><span class="l2">${st.state === "live" ? st.hint : duration(s, e, cfg.showTime)}</span></span></span>`;
    }
    const label = st.state === "live" ? st.hint : duration(s, e, cfg.showTime);
    return `<span class="dv b">${tile(s, tst)}${r.at ? `<span class="t2">${r.at}</span>` : ""}<span class="link ${st.state === "live" ? "live" : ""}"><em>${label}</em></span>${tile(e, tst)}${r.bt ? `<span class="t2">${r.bt}</span>` : ""}</span>`;
  },

  c(v, cfg) {
    const { start: s, end: e } = v;
    if (!cfg.isRange || e === s) {
      const st = singleState(s, cfg.showTime);
      const word = dayWord(s);
      const isRel = word.length === 2 && word.endsWith("天");
      return `<span class="dv c ${st === "past" ? "past" : ""}">
        <span class="main ${st === "today" ? "today" : ""}">${word}</span>
        ${cfg.showTime ? `<span class="time">${hm(s)}</span>` : ""}
        ${isRel ? "" : `<span class="rel">${relHint(s)}</span>`}
      </span>`;
    }
    if (e == null) {
      return `<span class="dv c"><span class="bar open"><span class="fill"></span><span class="lab">${md(s, yearOf(s) !== THIS_YEAR)} <span class="arw">→</span> 至今</span></span><span class="rel live">已 ${span(dayDiff(NOW, s))}</span></span>`;
    }
    const r = rangeParts(s, e, cfg.showTime);
    const st = rangeStatus(s, e, cfg.showTime);
    const label = r.sameDay
      ? `${r.day}${r.time ? ` <span class="time">${r.time}</span>` : ""}`
      : `${r.a}${r.at ? ` ${r.at}` : ""} <span class="arw">→</span> ${r.b}${r.bt ? ` ${r.bt}` : ""}`;
    const rel = st.state === "done" ? duration(s, e, cfg.showTime) : st.hint;
    return `<span class="dv c"><span class="bar ${st.state}" style="--p:${(st.p * 100).toFixed(1)}%"><span class="fill"></span><span class="lab">${label}</span></span><span class="rel ${st.state === "live" ? "live" : ""}">${rel}</span></span>`;
  },
};

/* ================= 数据 ================= */
const COLS = [
  { id: "title", title: "名称", icon: "type", w: [170, 140] },
  { id: "status", title: "状态", icon: "circle-dot", w: [92, 84] },
  { id: "due", title: "截止日期", icon: "calendar-days", cfg: {}, w: [160, 108], note: "单日期" },
  { id: "meet", title: "会议时间", icon: "calendar-days", cfg: { showTime: true }, w: [190, 124], note: "含时间" },
  { id: "span", title: "项目周期", icon: "calendar-days", cfg: { isRange: true }, w: [270, 150], note: "范围" },
  { id: "slot", title: "活动时段", icon: "calendar-days", cfg: { isRange: true, showTime: true }, w: [300, 160], note: "范围 + 时间" },
];
const S = { doing: ["进行中", "t2"], todo: ["未开始", "t4"], done: ["已完成", "t1"] };
const one = ts => ({ start: ts, end: ts });
const rg = (s, e) => ({ start: s, end: e });
const ROWS = [
  { title: "首页改版评审", status: "doing", due: one(D(2026, 9, 30)), meet: one(D(2026, 9, 30, 16, 0)),
    span: rg(D(2026, 9, 21), D(2026, 10, 9)), slot: rg(D(2026, 9, 30, 14, 0), D(2026, 9, 30, 16, 30)) },
  { title: "整理读书笔记", status: "todo", due: one(D(2026, 10, 1)), meet: one(D(2026, 10, 2, 9, 30)),
    span: rg(D(2026, 10, 5), D(2026, 10, 18)), slot: rg(D(2026, 10, 3, 10, 0), D(2026, 10, 3, 11, 30)) },
  { title: "写作马拉松", status: "doing", due: one(D(2026, 10, 27)), meet: one(D(2026, 10, 12, 19, 0)),
    span: rg(D(2026, 9, 28), D(2026, 10, 27)), slot: null },
  { title: "晨间站会", status: "done", due: one(D(2026, 9, 29)), meet: one(D(2026, 9, 30, 9, 30)),
    span: rg(D(2026, 9, 30), D(2026, 9, 30)), slot: rg(D(2026, 9, 30, 9, 30), D(2026, 9, 30, 9, 45)) },
  { title: "季度复盘", status: "done", due: one(D(2026, 9, 26)), meet: one(D(2026, 9, 25, 15, 0)),
    span: rg(D(2026, 9, 1), D(2026, 9, 26)), slot: rg(D(2026, 9, 25, 13, 0), D(2026, 9, 25, 17, 0)) },
  { title: "年度旅行计划", status: "todo", due: one(D(2027, 1, 8)), meet: null,
    span: rg(D(2026, 12, 28), D(2027, 1, 4)), slot: rg(D(2026, 12, 28, 8, 0), D(2026, 12, 30, 20, 0)) },
  { title: "长期阅读计划", status: "doing", due: null, meet: null, span: rg(D(2026, 9, 15), null), slot: null },
  { title: "旧项目归档", status: "done", due: one(D(2025, 11, 12)), meet: one(D(2025, 11, 10, 10, 0)),
    span: rg(D(2025, 10, 1), D(2025, 12, 20)), slot: null },
];

const INTRO = {
  old: ["现状", "formatDateRange 直出 ISO：YYYY-MM-DD [HH:mm:ss]，范围用「~」连接。年份、秒全部冗余，没有「今天在哪」的参照，范围只是两串数字。", []],
  a: ["A 排版层次", "只动文字，不加图形。改的是信息层次而不是装饰——最安静、实现成本最低。", [
    "±1 天用「今天 / 明天 / 昨天」，本年省略年份，时间去掉秒",
    "星期作为次级灰字；已过去的日期整体降一级灰",
    "范围：结束日期同月省略月份，尾部附时长；进行中的范围改显示「剩 N 天」（accent 色）"]],
  b: ["B 日历签", "迷你日历页作为视觉锚点，扫一眼就知道「这一列是日期」；范围是两张签之间一条连线，线上写时长。", [
    "识别度最高，看板/画廊里很出彩",
    "代价：视觉重量大，多列日期 × 多行时满屏都是小方块，和选项标签抢注意力",
    "今天的签顶部实色高亮，已过去的签整体变灰"]],
  c: ["C 时间条", "文字规则同 A；范围单元格是一条轨道，已过去的部分被填充、填充边缘就是「今天」——进行中 / 未开始 / 已结束一眼可辨。", [
    "进行中：accent 浅填充 + 今天刻度 + 右侧「剩 N 天」",
    "未开始：虚线斜纹空轨 +「N 天后开始」；已结束：整条灰填充 + 时长",
    "只有开始日期：填充渐隐到右端 +「至今 · 已 N 天」；单日期附相对时间（3 天后 / 4 天前）"]],
};

/* ================= 渲染 ================= */
const state = { dir: "c", width: "std" };

function cell(col, row) {
  if (col.id === "title") return `<div class="td title">${row.title}</div>`;
  if (col.id === "status") { const [t, c] = S[row.status]; return `<div class="td"><span class="tag ${c}">${t}</span></div>`; }
  const v = row[col.id];
  return `<div class="td">${v ? R[state.dir](v, col.cfg) : ""}</div>`;
}

function render() {
  const wi = state.width === "std" ? 0 : 1;
  const tbl = document.getElementById("tbl");
  tbl.style.setProperty("--cols", COLS.map(c => c.w[wi] + "px").join(" "));
  tbl.innerHTML =
    COLS.map(c => `<div class="th"><i data-lucide="${c.icon}"></i>${c.title}${c.note ? `<small>${c.note}</small>` : ""}</div>`).join("") +
    ROWS.map(r => COLS.map(c => cell(c, r)).join("")).join("");

  const [t, p, li] = INTRO[state.dir];
  document.getElementById("intro").innerHTML = `<h2>${t}</h2><p>${p}</p>${li.length ? `<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}`;

  const colBy = id => COLS.find(c => c.id === id);
  document.getElementById("kanban").innerHTML = [ROWS[0], ROWS[1], ROWS[5]].map(r => {
    const [st, sc] = S[r.status];
    const f = (lab, id) => r[id] ? `<div class="f"><span class="fl">${lab}</span><div class="fv">${R[state.dir](r[id], colBy(id).cfg)}</div></div>` : "";
    return `<div class="card"><div class="ct">${r.title}</div><div><span class="tag ${sc}">${st}</span></div>
      <div class="fields">${f("截止", "due")}${f("周期", "span")}</div></div>`;
  }).join("");

  const RULES = [
    ["今天", {}, one(D(2026, 9, 30))],
    ["明天 + 时间", { showTime: true }, one(D(2026, 10, 1, 9, 0))],
    ["本年其他日", {}, one(D(2026, 10, 12))],
    ["跨年单日", {}, one(D(2027, 1, 8))],
    ["同月范围", { isRange: true }, rg(D(2026, 10, 5), D(2026, 10, 18))],
    ["跨月范围", { isRange: true }, rg(D(2026, 9, 21), D(2026, 10, 9))],
    ["跨年范围", { isRange: true }, rg(D(2026, 12, 28), D(2027, 1, 4))],
    ["同日时段", { isRange: true, showTime: true }, rg(D(2026, 10, 3, 10, 0), D(2026, 10, 3, 11, 30))],
    ["只有开始", { isRange: true }, rg(D(2026, 9, 15), null)],
  ];
  document.getElementById("rules").innerHTML =
    `<tr><th>场景</th><th>现状</th><th>新文案（${state.dir === "old" ? "A" : INTRO[state.dir][0].split(" ")[0]}）</th></tr>` +
    RULES.map(([name, cfg, v]) => `<tr><td>${name}</td><td class="o">${oldFormat(v, cfg) || "—"}</td><td class="n">${R[state.dir === "old" ? "a" : state.dir](v, cfg)}</td></tr>`).join("");

  lucide.createIcons();
}

document.querySelectorAll(".grp").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  const key = g.dataset.key, v = b.dataset.v;
  if (key === "theme") document.documentElement.dataset.theme = v;
  else if (key === "mode") document.documentElement.dataset.mode = v;
  else { state[key] = v; render(); }
}));
render();
</script>
