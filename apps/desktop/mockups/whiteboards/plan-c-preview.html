<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白板 · 方案 C 预览台</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="shared.css">
<style>
  .page-c { display: flex; flex-direction: column; height: 100%; padding: 0 26px 18px; }
  /* 一整张纸：左目录 + 右预览同在一块 surface 上，中间只靠留白分开，不画竖线 */
  .desk { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); overflow: hidden; }

  .list { overflow-y: auto; padding: 12px 8px 16px 12px; scrollbar-width: none; }
  .list::-webkit-scrollbar { display: none; }
  .grp { display: flex; align-items: baseline; gap: 6px; padding: 12px 10px 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .grp:first-child { padding-top: 4px; }
  .grp small { font: 400 11px/1 var(--mono); color: var(--ink-3); }
  .row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 12px; text-align: left;
    transition: background 140ms var(--ease-out); }
  .row + .row { margin-top: 2px; }
  .row:hover { background: var(--bg-hover); }
  .row.on { background: var(--bg-selected); }
  .row .thumb { border-radius: 8px; background-size: 8px 8px; }
  .row .t { font-size: 13.5px; font-weight: 500; line-height: 1.4; }
  .row.on .t { color: var(--accent-text); }
  .row .meta { margin-top: 3px; font-size: 11.5px; }
  .row .side { align-self: start; padding-top: 3px; display: flex; gap: 2px; }
  .row .side .icon { width: 12px; height: 12px; color: var(--accent-text); }
  .row.fresh { animation: rowFresh 1600ms var(--ease-out); }
  @keyframes rowFresh { 0%, 35% { background: var(--accent-soft); } }

  /* 预览：大缩略图 + 页带 + 资料 */
  .pv { min-width: 0; overflow-y: auto; padding: 20px 28px 24px 18px; display: flex; flex-direction: column; }
  .pv-head { display: flex; align-items: flex-start; gap: 12px; }
  .pv-head .tt { flex: 1; min-width: 0; }
  .pv-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; }
  .pv-head p { margin-top: 4px; font-size: 13px; color: var(--ink-2); }
  .pv-head .acts { display: flex; gap: 6px; flex: none; padding-top: 2px; }

  .stage { margin-top: 16px; position: relative; }
  .stage .thumb { border-radius: 14px; aspect-ratio: 16 / 9; cursor: zoom-in; }
  .stage .thumb:hover { box-shadow: inset 0 0 0 1px var(--line-1); }
  .stage .flip { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }
  .stage .flip.l { left: 12px; } .stage .flip.r { right: 12px; }
  .stage .flip:disabled { opacity: 0; pointer-events: none; }
  .stage .cap { position: absolute; left: 14px; bottom: 12px; z-index: 2; height: 24px; padding: 0 9px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; background: color-mix(in srgb, var(--bg-surface) 92%, transparent); color: var(--ink-2); box-shadow: var(--shadow-lift); }
  .stage .cap b { font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .stage .open-hint { position: absolute; right: 14px; bottom: 12px; z-index: 2; }

  .film { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; padding: 3px; margin-left: -3px; }
  .film::-webkit-scrollbar { display: none; }
  .fr { flex: none; width: 128px; text-align: left; }
  .fr .thumb { border-radius: 9px; background-size: 9px 9px; transition: box-shadow 140ms; }
  .fr:hover .thumb { box-shadow: inset 0 0 0 1px var(--line-1), var(--shadow-lift); }
  .fr.on .thumb { box-shadow: 0 0 0 2px var(--accent); }
  .fr span { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr.on span { color: var(--ink-1); font-weight: 500; }
  .fr:focus-visible { box-shadow: none; }
  .fr:focus-visible .thumb { box-shadow: var(--focus-ring); }

  .facts { margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 24px; }
  .fact .k { font-size: 12px; color: var(--ink-3); }
  .fact .v { margin-top: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .fact.wide { grid-column: 1 / -1; }
  .mix { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mix .tag { height: 22px; }
  .mix .tag b { font-weight: 600; color: var(--ink-1); font-variant-numeric: tabular-nums; }
  .kbd-hint { margin-top: auto; padding-top: 20px; display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-3); }
  .kbd-hint span { display: inline-flex; align-items: center; gap: 5px; }

  .pv.swap > * { animation: fadeIn 200ms var(--ease-out); }
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script>
(() => {
  const X = WB, { icon, esc } = X;
  const { page } = X.mountShell();
  page.style.height = "100%";
  page.innerHTML = `
    <div class="page-c">
      <div class="toolbar">
        <h1>白板</h1><span class="sum" id="sum"></span>
        <span class="spacer"></span>
        <div class="actions"><span id="sort-slot"></span><button class="btn btn-primary" id="new">${icon("plus")}新建白板</button></div>
      </div>
      <div class="panel desk" id="desk"></div>
    </div>`;
  document.getElementById("new").onclick = () => X.editDialog();
  const desk = document.getElementById("desk");
  let sel = null, pg = 0;

  const rowHTML = b => `
    <button class="row${b.id === sel ? " on" : ""}" data-id="${b.id}">
      <div class="thumb">${X.coverHTML(b)}</div>
      <div style="min-width:0"><div class="t clamp1">${esc(b.title)}</div>
        <div class="meta"><span>${b.pages.length} 页</span><i class="dot"></i><span>${X.rel(X.S.sort === "created" ? b.createTime : b.updateTime)}</span></div></div>
      <div class="side">${b.sequences ? `<span title="可演示">${icon("play")}</span>` : ""}</div>
    </button>`;

  function listHTML(list) {
    if (X.S.sort === "title") return list.map(rowHTML).join("");
    const key = b => X.bucket(X.S.sort === "created" ? b.createTime : b.updateTime);
    const groups = [];
    list.forEach(b => {
      const k = key(b);
      if (!groups.length || groups[groups.length - 1][0] !== k) groups.push([k, []]);
      groups[groups.length - 1][1].push(b);
    });
    return groups.map(([k, bs]) => `<div class="grp">${k}<small>${bs.length}</small></div>${bs.map(rowHTML).join("")}`).join("");
  }

  function previewHTML(b) {
    const p = b.pages[pg], n = b.pages.length;
    const mix = X.breakdown(b);
    return `
      <div class="pv-head">
        <div class="tt"><h2>${esc(b.title)}</h2>${b.description ? `<p>${esc(b.description)}</p>` : ""}</div>
        <div class="acts">
          ${b.sequences ? `<button class="btn btn-ghost" data-present>${icon("play")}演示</button>` : ""}
          <button class="btn btn-soft" data-open>${icon("corner-down-left")}打开</button>
          <button class="ibtn" data-more title="更多">${icon("more")}</button>
        </div>
      </div>
      <div class="stage">
        <div class="thumb" data-open-page title="打开这一页">${X.pageSVG(p, { ratio: 16 / 9 })}</div>
        ${n > 1 ? `<button class="float-btn flip l" data-flip="-1" ${pg ? "" : "disabled"} title="上一页 (←)">${icon("chev-left")}</button>
          <button class="float-btn flip r" data-flip="1" ${pg < n - 1 ? "" : "disabled"} title="下一页 (→)">${icon("chev-right")}</button>` : ""}
        <span class="cap"><b>${pg + 1}/${n}</b>${esc(p.name)}</span>
      </div>
      ${n > 1 ? `<div class="film">${b.pages.map((q, i) => `<button class="fr${i === pg ? " on" : ""}" data-pg="${i}"><div class="thumb">${X.pageSVG(q)}</div><span>${i + 1} · ${esc(q.name)}</span></button>`).join("")}</div>` : ""}
      <div class="facts">
        <div class="fact"><div class="k">更新</div><div class="v" title="${X.fullDate(b.updateTime)}">${X.rel(b.updateTime)}</div></div>
        <div class="fact"><div class="k">创建</div><div class="v">${X.fullDate(b.createTime).slice(0, 10)}</div></div>
        <div class="fact"><div class="k">演示</div><div class="v">${b.sequences ? `${b.sequences} 个演示序列` : '<span class="muted">未设置</span>'}</div></div>
        <div class="fact wide"><div class="k">内容 · ${X.elementCount(b)} 个元素</div>
          <div class="mix">${mix.length ? mix.map(m => `<span class="tag">${icon(m.icon)}${m.label} <b>${m.n}</b></span>`).join("") : '<span class="muted" style="font-size:12.5px">还是一张空白画布</span>'}</div></div>
      </div>
      <div class="kbd-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 选白板</span><span><kbd>←</kbd><kbd>→</kbd> 翻页</span><span><kbd>↵</kbd> 打开</span></div>`;
  }

  function render() {
    document.getElementById("sum").innerHTML = X.summary();
    document.getElementById("sort-slot").innerHTML = X.S.empty ? "" : X.sortSeg();
    X.bindSort(document);
    const list = X.sorted();
    if (!list.length) {
      desk.style.display = "grid";
      desk.style.gridTemplateColumns = "1fr";
      desk.innerHTML = `<div style="display:grid;place-items:center">${X.emptyHTML()}</div>`;
      desk.querySelector("[data-new]").onclick = () => X.editDialog();
      return;
    }
    desk.style.gridTemplateColumns = "";
    if (X.S.lastCreated) { sel = X.S.lastCreated; pg = 0; }
    if (!list.some(b => b.id === sel)) { sel = list[0].id; pg = 0; }
    desk.innerHTML = `<div class="list" id="list">${listHTML(list)}</div><div class="pv" id="pv"></div>`;
    desk.querySelectorAll(".row").forEach(r => {
      r.onclick = () => select(+r.dataset.id);
      r.ondblclick = () => X.open(X.findB(+r.dataset.id));
      r.oncontextmenu = e => {
        e.preventDefault();
        select(+r.dataset.id);
        X.boardMenu({ left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY }, X.findB(+r.dataset.id), { placement: "bottom-start" });
      };
    });
    if (X.S.lastCreated) {
      const el = desk.querySelector(`.row[data-id="${sel}"]`);
      el && (el.classList.add("fresh"), el.scrollIntoView({ block: "nearest" }));
      X.S.lastCreated = null;
    }
    drawPreview(false);
  }

  function drawPreview(anim = true) {
    const b = X.findB(sel), pv = document.getElementById("pv");
    pv.classList.toggle("swap", anim);
    pv.innerHTML = previewHTML(b);
    pv.querySelector("[data-open]").onclick = () => X.open(b, pg);
    pv.querySelector("[data-open-page]").onclick = () => X.open(b, pg);
    const pr = pv.querySelector("[data-present]");
    if (pr) pr.onclick = () => X.present(b);
    pv.querySelector("[data-more]").onclick = e => X.boardMenu(e.currentTarget, b);
    pv.querySelectorAll("[data-flip]").forEach(f => (f.onclick = () => flip(+f.dataset.flip)));
    pv.querySelectorAll("[data-pg]").forEach(f => (f.onclick = () => { pg = +f.dataset.pg; drawPreview(false); }));
    const on = pv.querySelector(".fr.on");
    on && on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function select(id) {
    if (id === sel) return;
    sel = id; pg = 0;
    desk.querySelectorAll(".row").forEach(r => r.classList.toggle("on", +r.dataset.id === sel));
    drawPreview();
  }
  function flip(d) {
    const b = X.findB(sel);
    const n = Math.min(b.pages.length - 1, Math.max(0, pg + d));
    if (n !== pg) { pg = n; drawPreview(false); }
  }

  addEventListener("keydown", e => {
    if (X.dialogOpen() || X.S.empty || (e.target.closest && e.target.closest("input, textarea"))) return;
    const ids = [...desk.querySelectorAll(".row")].map(r => +r.dataset.id);
    const i = ids.indexOf(sel);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const j = Math.min(ids.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)));
      select(ids[j]);
      desk.querySelector(`.row[data-id="${sel}"]`).scrollIntoView({ block: "nearest" });
    } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      flip(e.key === "ArrowRight" ? 1 : -1);
    } else if (e.key === "Enter") {
      X.open(X.findB(sel), pg);
    }
  });

  X.on(render);
  render();
})();
</script>
</body>
</html>
