<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄专注 · 方案 A 专注舞台</title>
<link rel="stylesheet" href="shared.css">
<style>
  .paper { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 372px; background: var(--bg-surface);
    border-radius: 18px; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }

  /* ---------- 舞台 ---------- */
  .stage { position: relative; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 30px 36px 26px; }
  .enter { animation: enter 360ms var(--ease-out); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(0.985); } }

  .idle-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .idle-head p { color: var(--ink-2); margin-top: 2px; font-size: 12.5px; display: flex; align-items: center; gap: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { position: relative; text-align: left; border: 1px solid var(--line-1); border-radius: 14px; padding: 13px 14px 12px; display: flex; flex-direction: column;
    transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out); min-height: 138px; }
  .tile:hover { background: var(--bg-hover); border-color: transparent; }
  .tile.dragging { opacity: 0.4; }
  .tile.drop-before { box-shadow: -3px 0 0 var(--accent); }
  .tile.drop-after { box-shadow: 3px 0 0 var(--accent); }
  .t-top { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); height: 22px; }
  .t-top kbd { margin-left: auto; }
  .t-play { position: absolute; right: 11px; top: 10px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--ink-inverse);
    display: grid; place-items: center; opacity: 0; transform: scale(0.85); transition: opacity 160ms, transform 160ms var(--ease-out); }
  .t-play .icon { width: 12px; height: 12px; margin-left: 1px; }
  .tile:hover .t-play { opacity: 1; transform: none; }
  .tile:hover kbd { opacity: 0; }
  .t-name { font-size: 15px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 3px; height: 26px; margin-top: auto; padding-top: 10px; }
  .t-bars i { flex: 0 1 12px; border-radius: 3px; background: var(--c); opacity: 0.4; min-height: 2px; }
  .t-bars i.z { background: var(--bg-track); opacity: 1; }
  .t-bars i.today { opacity: 1; }
  .t-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .t-foot b { color: var(--ink-1); font-weight: 500; }
  .tile.add { border-style: dashed; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); }
  .tile.add .icon { width: 18px; height: 18px; }
  .tile.add span { font-size: 12.5px; }
  .idle-foot { margin-top: 18px; display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; }

  /* 专注中 */
  .run { margin: auto; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 520px; }
  .run-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .run-name .muted { font-weight: 400; font-size: 12.5px; }
  .run-ring { position: relative; width: 296px; height: 296px; margin-top: 18px; }
  .run-ring .ring { position: absolute; inset: 0; }
  .run-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .run-label { font-size: 12.5px; color: var(--ink-2); }
  .run-label.paused { color: var(--warn); font-weight: 500; }
  .run-time { font-size: 62px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; }
  .run-end { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .run-meta { margin-top: 16px; color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; gap: 8px; }
  .run-meta i { color: var(--ink-3); font-style: normal; }
  .run-ctrl { display: flex; align-items: flex-start; gap: 22px; margin-top: 22px; }
  .rc { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .rbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--bg-hover); color: var(--ink-1); display: grid; place-items: center; transition: background 160ms; }
  .rbtn:hover { background: var(--bg-press); }
  .rbtn .icon { width: 17px; height: 17px; }
  .rbtn.on { background: var(--accent-soft); color: var(--accent-text); }
  .rbtn.main { width: 64px; height: 64px; background: var(--accent); color: var(--ink-inverse); box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
  .rbtn.main:hover { background: var(--accent-hover); }
  .rbtn.main .icon { width: 20px; height: 20px; }
  .run-aux { display: flex; align-items: center; gap: 4px; margin-top: 18px; color: var(--ink-3); font-size: 12px; }
  .run-aux .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); margin: 0 6px; }
  .confirm-slot { margin-top: 16px; width: 100%; max-width: 440px; min-height: 44px; }

  /* 完成 */
  .done { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 440px; width: 100%; }
  .done-mark { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); animation: pop 520ms var(--ease-out); }
  .done-mark.early { background: var(--warn-soft); color: var(--warn); }
  .done-mark .icon { width: 26px; height: 26px; stroke-width: 2.2; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.06); } }
  .done h2 { font-size: 20px; font-weight: 600; margin-top: 16px; }
  .done p { color: var(--ink-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .done .ribbon { width: 100%; margin-top: 22px; }
  .done .acts { display: flex; gap: 8px; margin-top: 22px; }

  /* ---------- 今天（同一张纸的右栏，靠留白分区） ---------- */
  .today { min-height: 0; display: flex; flex-direction: column; padding: 30px 26px 18px 8px; }
  .sec-h { display: flex; align-items: baseline; gap: 8px; }
  .sec-h h3 { font-size: 14.5px; font-weight: 600; }
  .sec-h .muted { font-size: 12px; }
  .sec-h .spacer + * { font-size: 12px; }
  .t-line { margin-top: 6px; color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .t-line b { color: var(--ink-1); font-weight: 600; }
  .t-line .up { color: var(--ok); }
  .today .ribbon { margin-top: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .t-list { flex: 0 1 auto; margin: 12px -4px 0 -10px; padding: 4px 0; }
  .wk { margin-top: 18px; }
  .today > .link { margin-top: auto; }
  .wk-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 54px; margin-top: 10px; }
  .wk-bars div { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .wk-bars i { width: 100%; max-width: 26px; border-radius: 4px; background: var(--bg-track); min-height: 3px; }
  .wk-bars i.has { background: color-mix(in srgb, var(--accent) 45%, var(--bg-track)); }
  .wk-bars .now i { background: var(--accent); }
  .wk-bars span { font-size: 11px; color: var(--ink-3); }
  .wk-bars .now span { color: var(--accent-text); font-weight: 600; }
  .link { color: var(--accent-text); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; align-self: flex-start; padding: 3px 6px; margin-left: -6px; border-radius: 7px; }
  .link:hover { background: var(--accent-soft); }
  .link .icon { width: 13px; height: 13px; }

  /* ---------- 全部记录抽屉（恰好盖住右栏，不压暗舞台） ---------- */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: var(--bg-surface); box-shadow: var(--shadow-float);
    border-radius: 16px 0 0 16px; display: flex; flex-direction: column; transform: translateX(104%); transition: transform 300ms var(--ease-out); z-index: 5; }
  .drawer.open { transform: none; }
  .dr-head { display: flex; align-items: center; gap: 8px; padding: 18px 14px 8px 22px; }
  .dr-head h3 { font-size: 14.5px; font-weight: 600; }
  .dr-head .muted { font-size: 12px; font-variant-numeric: tabular-nums; }
  .dr-body { flex: 1; padding: 0 12px 0 12px; }
  .dr-foot { padding: 0 12px 12px; }

  .arch-row { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 8px; border-radius: 8px; }
  .arch-row:hover { background: var(--bg-hover); }
  .arch-row .n { flex: 1; font-weight: 500; }
  .arch-row .m { color: var(--ink-3); font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script src="records.js"></script>
<script>
(function () {
  const { icon, fmtClock, fmtDur, fmtDurCN, hm } = P;
  const { page } = P.mountShell();
  page.style.height = "100%";
  page.innerHTML = `
  <div class="page">
    <div class="toolbar"><h1>番茄专注</h1><div class="sum" id="sum"></div><span class="spacer"></span>
      <button class="btn btn-ghost" id="arch-btn">${icon("archive")}<span></span></button>
      <button class="btn btn-secondary" id="hist-btn">${icon("history")}全部记录</button>
      <button class="btn btn-primary" id="new-btn">${icon("plus")}新建预设</button></div>
    <div class="paper">
      <section class="stage" id="stage"></section>
      <aside class="today" id="today"></aside>
      <div class="drawer" id="drawer">
        <div class="dr-head"><h3>全部记录</h3><span class="muted" id="dr-sum"></span><span class="spacer"></span>
          <button class="btn btn-ghost" id="dr-sel">${icon("list-checks")}选择</button><button class="ibtn" id="dr-x" title="关闭 (Esc)">${icon("x")}</button></div>
        <div class="dr-body fade-scroll" id="dr-body"></div>
        <div class="dr-foot" id="dr-foot"></div>
      </div>
    </div>
  </div>`;
  const $ = s => page.querySelector(s);
  const stage = $("#stage"), today = $("#today");

  /* ---------- 工具栏 ---------- */
  function renderSum() {
    const t = P.todaySummary();
    $("#sum").innerHTML = `今天 <b class="num">${t.count}</b> 个 <span class="sep">·</span> <b class="num">${fmtDur(t.focusMs)}</b> <span class="sep">·</span> 连续 <b class="num">${P.streak()}</b> 天`;
    const a = P.archivedPresets().length;
    $("#arch-btn").style.display = a ? "" : "none";
    $("#arch-btn span").textContent = `已归档 ${a}`;
  }
  $("#new-btn").onclick = e => P.openPresetEditor(e.currentTarget, null);
  $("#arch-btn").onclick = e => openArchived(e.currentTarget);
  function openArchived(anchor) {
    const html = () => `<div class="pop-title">${icon("archive")}已归档的预设</div>` +
      (P.archivedPresets().map(p => `<div class="arch-row"><span class="pdot" style="--c:${P.colorOf(p.id)}"></span><span class="n">${p.name}</span><span class="m">${P.presetShort(p)}</span>
        <button class="btn btn-ghost" data-r="${p.id}">恢复</button><button class="ibtn" data-d="${p.id}" title="删除（历史记录保留）">${icon("trash")}</button></div>`).join("") ||
        `<div class="muted" style="padding:8px">没有归档的预设</div>`);
    P.openPop(anchor, html(), { width: 320, placement: "bottom-end", onMount(el, close, rerender) {
      el.addEventListener("click", e => {
        const r = e.target.closest("[data-r]"), d = e.target.closest("[data-d]");
        if (r) { P.archivePreset(+r.dataset.r, false); rerender(html()); }
        if (d) { const p = P.presetById(+d.dataset.d); const undo = P.deletePreset(p.id); P.toast(`已删除「${p.name}」，历史记录保留`, undo); rerender(html()); }
      });
    }});
  }

  /* ---------- 舞台：空闲 / 专注中 / 完成 三态 ---------- */
  let view = null, done = null, confirming = false;
  function setView(v) { view = v; confirming = false; renderStage(true); }

  function tileHTML(p, i) {
    const st = P.presetStats(p.id);
    const max = Math.max(...st.days, 30 * P.MIN);
    const bars = st.days.map((ms, k) => `<i class="${ms ? "" : "z"}${k === 6 ? " today" : ""}" style="height:${ms ? Math.max(12, (ms / max) * 100) : 8}%"></i>`).join("");
    return `<button class="tile" draggable="true" data-pid="${p.id}" style="--c:${P.colorOf(p.id)}" title="开始「${p.name}」">
      <div class="t-top"><span class="pdot"></span>${p.mode === "countdown" ? `${p.durationMin} 分钟` : "正计时"}${i < 9 ? `<kbd>${i + 1}</kbd>` : ""}</div>
      <span class="t-play">${icon("play", "fill")}</span>
      <div class="t-name">${p.name}</div>
      <div class="t-bars">${bars}</div>
      <div class="t-foot"><span>今天 <b>${st.todayMs ? fmtDur(st.todayMs) : "—"}</b></span><span>近 7 天 ${fmtDur(st.weekMs)}</span></div></button>`;
  }
  function idleHTML() {
    const list = P.activePresets();
    return `<div class="idle-head"><h2>要专注什么？</h2><p>点一下立即开始 · 数字键 <kbd>1</kbd>–<kbd>${Math.min(9, list.length)}</kbd> · 右键编辑 · 拖动排序</p></div>
      <div class="tiles">${list.map(tileHTML).join("")}<button class="tile add" id="add-tile">${icon("plus")}<span>新建预设</span></button></div>
      <div class="idle-foot">${icon("clock")}结束时不足 5 分钟的专注不会留下记录</div>`;
  }
  function runHTML() {
    const t = P.timing(), p = t.preset;
    return `<div class="run">
      <div class="run-name"><span class="pdot" style="--c:${P.colorOf(p.id)}"></span>${p.name}<span class="muted">${P.presetMeta(p)}</span></div>
      <div class="run-ring">${P.ringSVG(296, 7, t.progress, t.paused)}
        <div class="run-center"><div class="run-label" data-k="label"></div><div class="run-time num" data-k="time"></div><div class="run-end" data-k="end"></div></div></div>
      <div class="run-meta num" data-k="meta"></div>
      <div class="run-ctrl">
        <div class="rc"><button class="rbtn" data-a="sound" title="背景音">${icon("music")}</button><span data-k="sound"></span></div>
        <div class="rc"><button class="rbtn main" data-a="toggle" title="暂停 / 继续（空格）"></button><span data-k="tlabel"></span></div>
        <div class="rc"><button class="rbtn" data-a="stop" title="结束">${icon("stop")}</button><span>结束</span></div>
      </div>
      <div class="run-aux"><button class="btn btn-ghost" data-a="mini">${icon("pip")}小窗</button><button class="btn btn-ghost" data-a="imm">${icon("expand")}沉浸 <kbd>I</kbd></button>
        <span class="dot"></span>小窗与沉浸仅 Electron 渲染</div>
      <div class="confirm-slot" data-k="confirm"></div></div>`;
  }
  function doneHTML() {
    const s = done, p = P.presetById(s.presetId), early = P.isEarly(s), t = P.todaySummary();
    return `<div class="done">
      <div class="done-mark${early ? " early" : ""}">${icon(early ? "clock" : "check")}</div>
      <h2>${early ? "已结束" : "完成"}「${p.name}」</h2>
      <p>${early ? `专注 ${Math.round(s.focusMs / P.MIN)} / ${Math.round(s.expectedMs / P.MIN)} 分钟，记为提前结束` : `专注 ${fmtDurCN(s.focusMs)}${s.pauseCount ? ` · 暂停 ${s.pauseCount} 次` : ""}`} · 今天第 ${t.count} 个，共 ${fmtDur(t.focusMs)}</p>
      <div style="width:100%"><div class="ribbon">${P.ribbonHTML(P.sessions)}</div>${P.ribbonAxis()}</div>
      <div class="acts"><button class="btn btn-primary md" data-a="again">${icon("play")}再来一个「${p.name}」</button><button class="btn btn-ghost md" data-a="back">换一个</button></div></div>`;
  }
  function renderStage(animate) {
    const t = P.timing();
    if (t) view = "run"; else if (view === "run") view = done ? "done" : "idle";
    view = view || "idle";
    stage.innerHTML = view === "run" ? runHTML() : view === "done" ? doneHTML() : idleHTML();
    if (animate) { stage.firstElementChild.classList.add("enter"); if (view === "idle") stage.children[1].classList.add("enter"); }
    if (view === "run") tickStage();
    if (view === "idle") bindTiles();
  }
  function tickStage() {
    const t = P.timing(); if (!t || view !== "run") return;
    const q = k => stage.querySelector(`[data-k="${k}"]`);
    const cd = t.remain !== undefined;
    q("label").textContent = t.paused ? "已暂停" : cd ? "剩余" : "已专注";
    q("label").classList.toggle("paused", t.paused);
    q("time").textContent = fmtClock(t.display);
    q("end").textContent = t.paused ? "空格继续" : cd ? `预计 ${hm(t.endsAt)} 结束` : `第 ${Math.floor(t.elapsed / P.H) + 1} 小时 · 手动结束`;
    const s = P.timer.session;
    q("meta").innerHTML = `${hm(s.startTime)} 开始<i>·</i>${cd ? `已专注 ${fmtClock(t.elapsed)}` : `目标不限`}<i>·</i>${s.pauseCount ? `暂停 ${s.pauseCount} 次` : "未暂停"}`;
    q("sound").textContent = P.timer.sound ? P.soundName(P.timer.sound) : "背景音";
    stage.querySelector('[data-a="sound"]').classList.toggle("on", !!P.timer.sound);
    const tg = stage.querySelector('[data-a="toggle"]');
    const want = t.paused ? "play" : "pause";
    if (tg.dataset.i !== want) { tg.innerHTML = icon(want, "fill"); tg.dataset.i = want; }
    q("tlabel").textContent = t.paused ? "继续" : "暂停";
    P.setRing(stage.querySelector(".ring"), t.progress, t.paused);
    const c = q("confirm");
    if (confirming && !t.willDiscard) confirming = false;
    const want2 = confirming ? "c" : "";
    if (c.dataset.s !== want2) {
      c.dataset.s = want2;
      c.innerHTML = confirming ? `<div class="confirm-strip enter">${icon("alert")}专注不足 5 分钟，结束后不会留下记录<span class="spacer"></span>
        <button class="btn btn-ghost" data-a="keep">继续专注</button><button class="btn btn-secondary" data-a="discard">仍然结束</button></div>` : "";
    }
  }
  stage.addEventListener("click", e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    const tile = e.target.closest(".tile[data-pid]");
    if (tile && view === "idle") return P.start(+tile.dataset.pid);
    if (e.target.closest("#add-tile")) return P.openPresetEditor(e.target.closest("#add-tile"), null, { placement: "bottom-start" });
    if (!a) return;
    if (a === "toggle") P.toggle();
    if (a === "sound") P.openSound(e.target.closest("[data-a]"), { placement: "top" });
    if (a === "mini") P.openMini();
    if (a === "imm") P.openImmersive();
    if (a === "stop") {
      const t = P.timing();
      if (t.willDiscard) { confirming = true; tickStage(); return; }
      finish(P.stopByUser());
    }
    if (a === "keep") { confirming = false; tickStage(); }
    if (a === "discard") finish(P.stopByUser());
    if (a === "again") { const pid = done.presetId; done = null; P.start(pid); }
    if (a === "back") { done = null; setView("idle"); }
  });
  stage.addEventListener("contextmenu", e => {
    const tile = e.target.closest(".tile[data-pid]");
    if (!tile) return;
    e.preventDefault();
    P.presetMenu({ x: e.clientX, y: e.clientY }, P.presetById(+tile.dataset.pid), { editAnchor: tile });
  });
  function finish(r) {
    if (!r) return;
    if (r.discarded) { P.toast("不足 5 分钟，本次未记录"); done = null; setView("idle"); return; }
    done = r.saved; setView("done");
  }
  /* 拖动排序（同 legacy 能力，落 reorderPomodoroPresets） */
  let dragId = null;
  function bindTiles() {
    stage.querySelectorAll(".tile[data-pid]").forEach(t => {
      t.addEventListener("dragstart", () => { dragId = +t.dataset.pid; t.classList.add("dragging"); });
      t.addEventListener("dragend", () => { t.classList.remove("dragging"); stage.querySelectorAll(".tile").forEach(x => x.classList.remove("drop-before", "drop-after")); });
      t.addEventListener("dragover", e => {
        e.preventDefault(); const r = t.getBoundingClientRect(); const before = e.clientX < r.left + r.width / 2;
        stage.querySelectorAll(".tile").forEach(x => x.classList.remove("drop-before", "drop-after"));
        if (+t.dataset.pid !== dragId) t.classList.add(before ? "drop-before" : "drop-after");
      });
      t.addEventListener("drop", e => {
        e.preventDefault(); const target = +t.dataset.pid; if (target === dragId) return;
        const r = t.getBoundingClientRect(); const before = e.clientX < r.left + r.width / 2;
        const ids = P.activePresets().map(p => p.id).filter(id => id !== dragId);
        ids.splice(ids.indexOf(target) + (before ? 0 : 1), 0, dragId);
        P.reorderPresets(ids);
      });
    });
  }

  /* ---------- 右栏：今天 ---------- */
  function renderToday() {
    const t = P.todaySummary(), y = P.sessionsOn(-1).reduce((a, s) => a + s.focusMs, 0);
    const diff = t.focusMs - y;
    const byPreset = new Map();
    P.sessionsOn(0).forEach(s => byPreset.set(s.presetId, (byPreset.get(s.presetId) || 0) + s.focusMs));
    const wk = P.dayTotals(7), dow = (new Date(P.now()).getDay() + 6) % 7;
    const week = []; for (let i = 0; i < 7; i++) { const o = i - dow; week.push({ o, ms: o <= 0 ? P.sessionsOn(o).reduce((a, s) => a + s.focusMs, 0) : 0 }); }
    const wmax = Math.max(...week.map(w => w.ms), 60 * P.MIN);
    const ws = P.weekSummary();
    today.innerHTML = `
      <div class="sec-h"><h3>今天</h3><span class="muted">${P.dateCN(P.now())}</span></div>
      <p class="t-line"><b>${t.count}</b> 个番茄 · 专注 <b>${fmtDurCN(t.focusMs)}</b>${y ? ` · <span class="${diff >= 0 ? "up" : ""}">比昨天${diff >= 0 ? "多" : "少"} ${fmtDurCN(Math.abs(diff))}</span>` : ""}</p>
      <div class="ribbon" id="rib">${P.ribbonHTML(P.sessions)}</div>${P.ribbonAxis()}
      <div class="legend">${[...byPreset].map(([pid, ms]) => `<span><i class="pdot" style="--c:${P.colorOf(pid)}"></i>${P.presetById(pid)?.name ?? "已删除"} ${fmtDur(ms)}</span>`).join("")}</div>
      <div class="t-list fade-scroll" id="tlist"></div>
      <div class="wk"><div class="sec-h"><h3 style="font-size:13px">本周</h3><span class="spacer"></span><span class="muted num">${ws.count} 个 · ${fmtDur(ws.focusMs)}</span></div>
        <div class="wk-bars">${week.map((w, i) => `<div class="${w.o === 0 ? "now" : ""}" title="${w.ms ? fmtDur(w.ms) : "无记录"}"><i class="${w.ms ? "has" : ""}" style="height:${w.ms ? Math.max(8, (w.ms / wmax) * 100) : 6}%"></i><span>${"一二三四五六日"[i]}</span></div>`).join("")}</div></div>
      <button class="link" id="more-link">全部记录 ${icon("chev-right")}</button>`;
    renderTodayList();
    today.querySelector("#more-link").onclick = openDrawer;
  }
  function renderTodayList() {
    const el = today.querySelector("#tlist"); if (!el) return;
    const list = P.sessionsOn(0);
    el.innerHTML = R.liveRowHTML() + (list.map(s => R.recRowHTML(s, { tags: "early" })).join("") || (P.timer.session ? "" : `<div class="empty">${icon("timer")}今天还没有专注记录</div>`));
  }
  R.bindRows(today);

  /* ---------- 全部记录抽屉 ---------- */
  const drawer = $("#drawer");
  const hist = R.mountHistory($("#dr-body"), { onSelChange: renderDrFoot });
  function renderDrSum() { const t = P.totalSummary(); $("#dr-sum").textContent = `累计 ${t.count} 个 · ${Math.round(t.focusMs / P.H)} 小时`; }
  function renderDrFoot(n = 0) {
    $("#dr-sel").innerHTML = hist.selecting() ? "完成" : `${icon("list-checks")}选择`;
    $("#dr-foot").innerHTML = hist.selecting() ? `<div class="sel-bar"><span>已选 <b class="num">${n}</b> 条</span><button class="btn btn-ghost" data-today>全选今天</button><span class="spacer"></span>
      <button class="btn btn-danger-soft" data-del ${n ? "" : "disabled"}>${icon("trash")}删除</button></div>` : "";
    const d = $("#dr-foot [data-del]"); if (d) d.onclick = () => hist.deleteSelected();
    const td = $("#dr-foot [data-today]"); if (td) td.onclick = () => hist.selectDay(0);
  }
  function openDrawer() { drawer.classList.add("open"); renderDrSum(); }
  function closeDrawer() { drawer.classList.remove("open"); if (hist.selecting()) hist.setSelecting(false); renderDrFoot(); }
  $("#hist-btn").onclick = () => (drawer.classList.contains("open") ? closeDrawer() : openDrawer());
  $("#dr-x").onclick = closeDrawer;
  $("#dr-sel").onclick = () => { hist.setSelecting(!hist.selecting()); renderDrFoot(); };
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && drawer.classList.contains("open") && !document.querySelector(".pop,.menu,.imm.open")) closeDrawer();
  });

  /* ---------- 订阅 ---------- */
  let lastRun = !!P.timing();
  P.on((type, payload) => {
    if (type === "completed") { done = payload; setView("done"); return; }
    if (type === "timer") {
      const running = !!P.timing();
      if (running !== lastRun) { lastRun = running; if (running) done = null; renderStage(true); }
      else if (view === "run") tickStage();
      renderToday(); renderSum();
    }
    if (type === "data") { if (view !== "run") renderStage(false); renderToday(); renderSum(); renderDrSum(); }
    if (type === "sound") tickStage();
    if (type === "tick") {
      tickStage();
      const rib = today.querySelector("#rib"); if (rib && P.timer.session) rib.innerHTML = P.ribbonHTML(P.sessions);
      const l = today.querySelector("[data-live]"); const t = P.timing(); if (l && t) l.textContent = fmtDur(t.elapsed);
    }
  });
  P.bindKeys();
  renderSum(); renderStage(false); renderToday(); renderDrFoot();
})();
</script>
</body>
</html>
