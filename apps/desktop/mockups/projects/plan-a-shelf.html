<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<title>项目 · A 书架网格 — Tau 桌面端</title>
<!--
  【视觉参考，非导出源】（D-001）：mockup 用于对照评审，落地时样式迁移组件 Tailwind。
  A · 书架网格 —— 与文章月刊（plan-a3-journal）/ 卡片墙完全同构的项目页：
  工具栏（标题 + 计数 + 右上「新建 ▾」三型下拉）→ 类型 pills（全部/文档树/数据表格/
  Vibe Learning，带计数）→ 滚动区两段：置顶段 + 最近更新段（均 sticky 段头、零横线、
  段头带合计元信息）→ 底部归档折叠段（chevron 旋转 + grid-rows 展开过渡，对齐 legacy
  「归档可折叠」习惯）。
  设计要点：
  ① 项目卡无封面（项目没有 banner 概念）——身份由「类型色图标块」承载：36px 圆角块，
     类型色 soft 底 + 类型色线性图标，比文字徽章醒目、比整卡染色克制；
  ② 卡片信息 = 标题 + 摘要两行（纯文本，从富文本 desc 提取——实现层不再内嵌只读 Editor）
     + 子项计数 + 相对更新时间（tabular-nums）；
  ③ 置顶由「独立段」表达，卡内不重复星标（段即语义，双表达冗余）；hover 操作可置顶/
     取消置顶，卡片即时在段间移动；
  ④ 归档卡整卡去饱和（opacity + grayscale），hover 操作首位变「取消归档」；
  ⑤ hover = 阴影加深 + 1px 描边亮起（同文章卡口径，无位移）；操作按钮浅底小方块，
     仅 hover/focus 显现。
  交互均为真实现：pills 筛选、新建下拉、置顶切换、归档段折叠、更多菜单、状态栏计数联动。
-->
<style>
:root {
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
}
[data-theme="cream"] {
  color-scheme: light;
  --bg-page: #f3eee2; --bg-surface: #fffdf9; --bg-group: #faf6ec; --bg-sunken: #ece5d4;
  --bg-hover: rgba(67,57,44,0.05); --bg-selected: rgba(217,119,87,0.12);
  --ink-1: #43392c; --ink-2: #7a6c5a; --ink-3: #a89a85; --ink-inverse: #fff8ef;
  --accent: #d97757; --accent-hover: #c96a4c; --accent-soft: rgba(217,119,87,0.12); --accent-text: #b85f42;
  --ok: #61795f; --ok-soft: #e5ede2; --warn: #a38c4d; --warn-soft: #f6efd6;
  --info: #5c7d99; --info-soft: #e2ebf3; --danger: #b0564d; --danger-soft: #f6e3e0;
  --line: #e9e1d2;
  --shadow-card: 0 1px 2px rgba(120,100,70,0.05), 0 10px 24px -14px rgba(120,100,70,0.18);
  --shadow-float: 0 2px 4px rgba(120,100,70,0.06), 0 18px 40px -16px rgba(120,100,70,0.3);
  /* 类型派生色（设计数据色，不进主题词表——同文章封面派生色口径） */
  --type-tree: #3f857c; --type-tree-soft: rgba(63,133,124,0.13);
  --type-table: #6f5396; --type-table-soft: rgba(111,83,150,0.13);
  --type-vibe: #b85f42; --type-vibe-soft: rgba(217,119,87,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--ink-1);
  background: var(--bg-page); overflow: hidden; min-width: 1100px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 融合骨架（与 home-final / articles 同构） ---------- */
.app { display: grid; grid-template-columns: 218px 4px minmax(0,1fr); grid-template-rows: 100vh;
  grid-template-areas: "sidebar resizer main"; }
.sidebar { grid-area: sidebar; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-head { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; margin-bottom: 6px; flex: none; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(145deg, var(--accent-hover), var(--accent));
  color: var(--ink-inverse); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.brand-name { font-weight: 600; font-size: 13.5px; }
.nav-section { margin-top: 12px; }
.nav-label { font-size: 11px; color: var(--ink-3); padding: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-2); font-size: 13px; text-align: left; }
.nav-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.nav-item.active { background: var(--bg-selected); color: var(--accent-text); font-weight: 500; position: relative; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item .icon { width: 15px; height: 15px; }
.nav-spacer { flex: 1; }
.nav-footer { border-radius: 10px; }
.resizer { grid-area: resizer; cursor: col-resize; }
.main { grid-area: main; display: grid; grid-template-rows: 46px minmax(0,1fr) 30px; min-width: 0; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; -webkit-app-region: drag; }
.titlebar-crumb { color: var(--ink-2); font-size: 12.5px; }
.titlebar-crumb b { color: var(--ink-1); font-weight: 600; }
.titlebar-btn { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
.titlebar-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--ink-1); }
.titlebar-btn:disabled { opacity: 0.4; cursor: default; }
.titlebar-spacer { flex: 1; }
.titlebar-search { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 8px;
  color: var(--ink-3); font-size: 12px; }
.titlebar-search:hover { background: var(--bg-hover); color: var(--ink-2); }
kbd { font: 11px/1 ui-monospace, Consolas, monospace; background: var(--bg-group); color: var(--ink-2);
  border-radius: 5px; padding: 2px 5px; }
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 11.5px; color: var(--ink-3); }
.statusbar .dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: currentColor; opacity: 0.6; }

/* ---------- 页面骨架：工具栏 / pills / 滚动区 ---------- */
.page { display: flex; flex-direction: column; min-height: 0; height: 100%;
  max-width: 1680px; margin: 0 auto; padding: 0 26px; }
.toolbar { height: 44px; flex: none; display: flex; align-items: center; gap: 14px; }
.toolbar h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar .sum { font-size: 12.5px; color: var(--ink-2); }
.toolbar .sum b { color: var(--ink-1); font-weight: 600; }
.toolbar .spacer { flex: 1; }

/* 「新建 ▾」split 按钮（primary 实心 + 展开箭头区） */
.split-btn { display: inline-flex; height: 28px; border-radius: 9px; background: var(--accent); color: var(--ink-inverse);
  font-size: 12.5px; font-weight: 500; box-shadow: var(--shadow-card); transition: background 150ms var(--ease-out); position: relative; }
.split-btn:hover { background: var(--accent-hover); }
.split-btn .main-part { display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 9px 0 0 9px; }
.split-btn .menu-part { display: grid; place-items: center; width: 24px; border-radius: 0 9px 9px 0; }
.split-btn .menu-part .icon { width: 12px; height: 12px; transition: transform 150ms var(--ease-out); }
.split-btn.open .menu-part .icon { transform: rotate(180deg); }
.split-btn .menu-part:hover { background: rgba(255,255,255,0.14); }

/* 新建下拉（Menu 形态：surface 底 + shadow-float + 12px 圆角） */
.create-menu { position: absolute; right: 0; top: calc(100% + 6px); width: 264px; background: var(--bg-surface);
  border-radius: var(--radius-md); box-shadow: var(--shadow-float); padding: 5px; z-index: 50;
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity 130ms var(--ease-out), transform 130ms var(--ease-out); }
.create-menu.open { opacity: 1; transform: none; pointer-events: auto; }
.create-menu .menu-label { font-size: 11px; color: var(--ink-3); padding: 5px 9px 4px; }
.create-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 9px; border-radius: 9px; text-align: left; }
.create-item:hover { background: var(--bg-hover); }
.create-item .type-chip { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.create-item .t { font-size: 13px; font-weight: 500; }
.create-item .d { font-size: 11.5px; color: var(--ink-3); }

/* pills 筛选（与文章页标签 pills 同构） */
.pillbar { height: 38px; flex: none; display: flex; align-items: center; gap: 6px; padding-bottom: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; border-radius: 99px;
  background: var(--bg-surface); box-shadow: var(--shadow-card); color: var(--ink-2); font-size: 12px; white-space: nowrap;
  transition: background 150ms var(--ease-out), color 150ms var(--ease-out); }
.pill:hover { color: var(--ink-1); }
.pill.active { background: var(--bg-selected); color: var(--accent-text); font-weight: 500; }
.pill .count { font-size: 10.5px; color: var(--ink-3); }
.pill.active .count { color: var(--accent-text); opacity: 0.7; }
.pill .type-dot { width: 7px; height: 7px; border-radius: 3px; }

/* 滚动区：edge-fade + 段头 sticky */
.scroller { flex: 1; min-height: 0; overflow-y: auto; margin: 4px -18px 0 0; padding: 0 18px 28px 0; position: relative;
  mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 20px), transparent 100%);
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 20px), transparent 100%);
  scrollbar-width: thin; }
.scroller::-webkit-scrollbar { width: 4px; }
.scroller::-webkit-scrollbar-thumb { background: rgba(67,57,44,0.25); border-radius: 2px; }
.scroller::-webkit-scrollbar-track { background: transparent; }

.section { margin-bottom: 26px; }
.section-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 10px;
  padding: 4px 2px 12px; background: linear-gradient(180deg, var(--bg-page) calc(100% - 13px), transparent); }
.section-head .label { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.section-head .meta { font-size: 11.5px; color: var(--ink-3); }
.section-head.toggle { cursor: pointer; user-select: none; }
.section-head.toggle:hover .label { color: var(--accent-text); }
.section-head .chev { width: 13px; height: 13px; color: var(--ink-3); transition: transform 200ms var(--ease-out);
  transform: rotate(-90deg); align-self: center; }
.section-head.open .chev { transform: rotate(0deg); }
.collapse-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 260ms var(--ease-out); }
.collapse-wrap.open { grid-template-rows: 1fr; }
.collapse-wrap > .collapse-inner { overflow: hidden; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

/* ---------- 项目卡 ---------- */
.card { position: relative; display: flex; flex-direction: column; background: var(--bg-surface);
  border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 14px 16px 12px;
  cursor: pointer; outline: 1px solid transparent; outline-offset: -1px;
  transition: box-shadow 200ms var(--ease-out), outline-color 200ms var(--ease-out); }
.card:hover, .card:focus-visible { box-shadow: var(--shadow-float); outline-color: var(--line); }
.card-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
.type-chip { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.type-chip .icon { width: 16px; height: 16px; stroke-width: 1.9; }
.type-chip.tree { background: var(--type-tree-soft); color: var(--type-tree); }
.type-chip.table { background: var(--type-table-soft); color: var(--type-table); }
.type-chip.vibe { background: var(--type-vibe-soft); color: var(--type-vibe); }
.card-ops { display: flex; gap: 4px; margin-left: auto; opacity: 0; transition: opacity 150ms var(--ease-out); }
.card:hover .card-ops, .card:focus-within .card-ops { opacity: 1; }
.op-btn { width: 23px; height: 23px; border-radius: 7px; display: grid; place-items: center;
  background: rgba(255,248,239,0.86); color: var(--ink-2); box-shadow: var(--shadow-card); }
.op-btn:hover { background: #fff8ef; color: var(--ink-1); }
.op-btn .icon { width: 13px; height: 13px; }
.op-btn.pinned { color: var(--accent); }
.card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.45; letter-spacing: -0.005em;
  display: flex; align-items: center; gap: 6px; }
.card h3 .type-name { font-size: 10.5px; font-weight: 500; padding: 1px 7px; border-radius: 99px; flex: none; }
.type-name.tree { background: var(--type-tree-soft); color: var(--type-tree); }
.type-name.table { background: var(--type-table-soft); color: var(--type-table); }
.type-name.vibe { background: var(--type-vibe-soft); color: var(--type-vibe); }
.card .ex { margin-top: 5px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 41px; }
.card .meta { margin-top: auto; padding-top: 9px; display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--ink-3); }
.card .meta .dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: currentColor; opacity: 0.6; }

/* 归档卡：去饱和 + 降存在感 */
.card.archived { opacity: 0.62; }
.card.archived:hover { opacity: 1; }
.card.archived .type-chip, .card.archived h3 .type-name { filter: saturate(0.5); }

/* 空态 */
.empty { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 72px 0 40px; text-align: center; }
.empty .t1 { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.empty .t2 { font-size: 12.5px; color: var(--ink-3); }

/* 更多菜单（卡片 ⋯） */
.ctx-menu { position: fixed; width: 196px; background: var(--bg-surface); border-radius: var(--radius-md);
  box-shadow: var(--shadow-float); padding: 5px; z-index: 100; }
.ctx-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border-radius: 8px;
  font-size: 12.5px; text-align: left; color: var(--ink-1); }
.ctx-item:hover { background: var(--bg-hover); }
.ctx-item .icon { width: 14px; height: 14px; color: var(--ink-3); }
.ctx-item.danger { color: var(--danger); }
.ctx-item.danger .icon { color: var(--danger); }
.ctx-item.danger:hover { background: var(--danger-soft); }
.ctx-sep { height: 1px; background: var(--line); margin: 5px 7px; }

/* toast（轻胶囊，对齐 ui primitives Toast 定稿形态） */
.toast { position: fixed; left: 50%; bottom: 44px; transform: translate(-50%, 8px); background: var(--ink-1);
  color: var(--ink-inverse); font-size: 12.5px; border-radius: 99px; padding: 7px 16px; z-index: 200;
  box-shadow: var(--shadow-float); opacity: 0; pointer-events: none;
  transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<script>
/* ================= mock 数据（13 个项目：3 置顶 / 7 活跃 / 3 归档，三型覆盖） ================= */
const TYPES = {
  tree:  { key: "tree",  label: "文档树",  icon: "i-tree",  cls: "tree"  },
  table: { key: "table", label: "数据表格", icon: "i-table", cls: "table" },
  vibe:  { key: "vibe",  label: "Vibe Learning", icon: "i-flask", cls: "vibe" },
};
const P = (id, type, title, ex, items, daysAgo, pinned, archived) =>
  ({ id, type, title, ex, items, daysAgo, pinned: !!pinned, archived: !!archived });
const PROJECTS = [
  P(1, "vibe",  "Rust 语言学习", "以官方教程 + Rustlings 为主线，每个语法点配一张卡片与一个小练习，周复盘一次。", 24, 0, true),
  P(2, "vibe",  "认知科学导读", "对照《认知天性》与课程讲义整理学习路线，重点章节制卡进闪卡库循环复习。", 18, 1, true),
  P(3, "tree",  "毕业论文", "开题到答辩的全部材料：文献笔记、章节草稿、导师意见与修改记录。", 32, 3),
  P(4, "table", "阅读清单 2026", "年度书单追踪：书名、类型、状态、评分与一句话短评，读完即归档一行。", 58, 5),
  P(5, "table", "产品灵感库", "随手记录的产品点子与竞品观察，按场景分类，每月筛选一次值得深挖的方向。", 41, 6),
  P(6, "vibe",  "英语写作训练营", "八周计划：每周一篇随笔 + 一篇仿写，AI 批改反馈沉淀成常见错误表。", 12, 9),
  P(7, "tree",  "家装修理手册", "新家的维修与改造记录：水电点位图、材料清单、每次修理的步骤与照片。", 9, 14),
  P(8, "tree",  "投资研究", "行业与公司的长期跟踪笔记，关键假设单独成卡，季报后回看验证。", 27, 21),
  P(9, "table", "健身计划", "三分化训练记录：动作、组数、重量与主观疲劳度，四周做一次加量决策。", 15, 33),
  P(10, "tree", "Python 自动化", "把重复工作写成脚本的过程笔记，每个脚本记录需求、坑与最终用法。", 22, 38),
  P(11, "vibe",  "日语五十音", "平假名与片假名的两周速成，配合闪卡每日过一轮。", 8, 62, false, true),
  P(12, "tree",  "Vue3 迁移评估", "旧项目升级到 Vue3 的差异清单与试点结论。", 11, 95, false, true),
  P(13, "table", "读书会领读准备", "每期领读的章节拆解、讨论问题与时间轴。", 6, 150, false, true),
];

const rel = (d) => d === 0 ? "今天" : d === 1 ? "昨天" : d <= 6 ? `${d} 天前` : d <= 13 ? "上周" : d <= 29 ? `${Math.round(d / 7)} 周前` : d <= 59 ? "上月" : `${Math.round(d / 30)} 个月前`;
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const $ = (s) => document.querySelector(s);
let typeFilter = "", archivedOpen = false, toastTimer;

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ---------- pills（全部 + 三型，带计数；归档计数在归档段头） ---------- */
function renderPills() {
  const active = PROJECTS.filter(p => !p.archived);
  const count = (t) => active.filter(p => p.type === t).length;
  const pills = [
    { key: "", label: "全部", n: active.length, dot: null },
    { key: "tree", label: "文档树", n: count("tree"), dot: "var(--type-tree)" },
    { key: "table", label: "数据表格", n: count("table"), dot: "var(--type-table)" },
    { key: "vibe", label: "Vibe Learning", n: count("vibe"), dot: "var(--type-vibe)" },
  ];
  $("#pillbar").innerHTML = pills.map(p => `
    <button class="pill${typeFilter === p.key ? " active" : ""}" data-type="${p.key}">
      ${p.dot ? `<span class="type-dot" style="background:${p.dot}"></span>` : ""}${p.label}
      <span class="count">${p.n}</span>
    </button>`).join("");
  $("#pillbar").querySelectorAll(".pill").forEach(el =>
    el.onclick = () => { typeFilter = el.dataset.type; render(); });
}

/* ---------- 卡片 ---------- */
function cardHTML(p) {
  const t = TYPES[p.type];
  const pinTitle = p.pinned ? "取消置顶" : "置顶";
  const pinIcon = p.archived ? `<svg class="icon"><use href="#i-unarchive"/></svg>` : `<svg class="icon"><use href="#i-pin"/></svg>`;
  return `<article class="card${p.archived ? " archived" : ""}" tabindex="0" data-id="${p.id}">
    <div class="card-head">
      <span class="type-chip ${t.cls}"><svg class="icon"><use href="#${t.icon}"/></svg></span>
      <span class="card-ops">
        <button class="op-btn" data-act="toggle" title="${p.archived ? "取消归档" : pinTitle}">${pinIcon}</button>
        <button class="op-btn" data-act="more" title="更多操作"><svg class="icon"><use href="#i-more"/></svg></button>
      </span>
    </div>
    <h3>${p.title}<span class="type-name ${t.cls}">${t.label}</span></h3>
    <p class="ex">${p.ex}</p>
    <div class="meta num"><span>${fmt(p.items)} 条子项</span><span class="dot"></span><span>更新于 ${rel(p.daysAgo)}</span></div>
  </article>`;
}

function sectionHTML(label, meta, cards, opts = {}) {
  if (!cards.length) return "";
  const headCls = opts.toggle ? `section-head toggle${archivedOpen ? " open" : ""}` : "section-head";
  const chev = opts.toggle ? `<svg class="icon chev"><use href="#i-chev-down"/></svg>` : "";
  const grid = `<div class="grid">${cards.join("")}</div>`;
  return `<section class="section">
    <div class="${headCls}" ${opts.toggle ? 'data-toggle="archived"' : ""}>
      ${chev}<span class="label">${label}</span><span class="meta num">${meta}</span>
    </div>
    ${opts.toggle ? `<div class="collapse-wrap${archivedOpen ? " open" : ""}"><div class="collapse-inner">${grid}</div></div>` : grid}
  </section>`;
}

/* ---------- 渲染 ---------- */
function render() {
  renderPills();
  const match = (p) => !typeFilter || p.type === typeFilter;
  const active = PROJECTS.filter(p => !p.archived && match(p));
  const pinned = active.filter(p => p.pinned);
  const rest = active.filter(p => !p.pinned).sort((a, b) => a.daysAgo - b.daysAgo);
  const archived = PROJECTS.filter(p => p.archived && match(p));

  $("#sections").innerHTML =
    sectionHTML("置顶", `${pinned.length} 个`, pinned.map(cardHTML)) +
    sectionHTML("最近更新", `${rest.length} 个 · 子项 ${fmt(rest.reduce((s, p) => s + p.items, 0))} 条`,
      rest.map(cardHTML)) +
    sectionHTML("归档项目", `${archived.length} 个`, archived.map(cardHTML), { toggle: true });

  $("#empty").style.display = active.length + archived.length ? "none" : "flex";
  const all = PROJECTS.filter(p => !p.archived);
  const byType = (t) => all.filter(p => p.type === t).length;
  $("#sum").innerHTML = `共 <b>${all.length}</b> 个 · 文档树 ${byType("tree")} / 表格 ${byType("table")} / 学习 ${byType("vibe")}`;
  $("#status-left").textContent = typeFilter
    ? `${TYPES[typeFilter].label} · ${active.length} 个项目`
    : `${all.length} 个项目`;
  $("#status-right").textContent = `子项 ${fmt(all.reduce((s, p) => s + p.items, 0))} 条 · 已归档 ${PROJECTS.filter(p => p.archived).length}`;
}

/* ---------- 交互：新建下拉 ---------- */
const createBtn = $("#create-btn"), createMenu = $("#create-menu");
const closeCreate = (e) => {
  if (!createBtn.contains(e.target)) { createBtn.classList.remove("open"); createMenu.classList.remove("open"); }
};
document.addEventListener("click", closeCreate);
$("#create-btn .menu-part").onclick = (e) => {
  e.stopPropagation();
  createBtn.classList.toggle("open"); createMenu.classList.toggle("open");
};
$("#create-btn .main-part").onclick = () => {
  createBtn.classList.remove("open"); createMenu.classList.remove("open");
  toast("（mock）新建文档树项目 → 弹窗填标题与描述 → 创建并进入详情");
};
createMenu.querySelectorAll(".create-item").forEach(el => el.onclick = () => {
  createBtn.classList.remove("open"); createMenu.classList.remove("open");
  toast(`（mock）新建${TYPES[el.dataset.type].label}项目 → 创建并进入详情`);
});

/* ---------- 交互：段头折叠 / 卡片操作 / 更多菜单 ---------- */
let ctxEl = null;
const closeCtx = (e) => {
  if (ctxEl && !ctxEl.el.contains(e.target)) { ctxEl.el.remove(); ctxEl = null; }
};
document.addEventListener("click", closeCtx);

$("#sections").addEventListener("click", (e) => {
  const toggleHead = e.target.closest('[data-toggle="archived"]');
  if (toggleHead) { archivedOpen = !archivedOpen; render(); return; }

  const card = e.target.closest(".card");
  if (!card) return;
  const p = PROJECTS.find(x => x.id === +card.dataset.id);
  const op = e.target.closest(".op-btn");
  if (!op) { toast(`（mock）进入项目「${p.title}」详情`); return; }
  e.stopPropagation();
  if (op.dataset.act === "toggle") {
    if (p.archived) { p.archived = false; toast(`「${p.title}」已取消归档`); }
    else { p.pinned = !p.pinned; toast(`「${p.title}」${p.pinned ? "已置顶" : "已取消置顶"}`); }
    render();
  } else if (op.dataset.act === "more") {
    if (ctxEl) ctxEl.el.remove();
    const r = op.getBoundingClientRect();
    const menu = document.createElement("div");
    menu.className = "ctx-menu";
    menu.style.left = Math.min(r.left, innerWidth - 210) + "px";
    menu.style.top = Math.min(r.bottom + 6, innerHeight - 200) + "px";
    menu.innerHTML = `
      <button class="ctx-item"><svg class="icon"><use href="#i-edit"/></svg>编辑项目信息</button>
      <button class="ctx-item" data-x="pin"><svg class="icon"><use href="#i-pin"/></svg>${p.pinned ? "取消置顶" : "置顶项目"}</button>
      <button class="ctx-item" data-x="arch"><svg class="icon"><use href="#i-archive"/></svg>${p.archived ? "取消归档" : "归档项目"}</button>
      <button class="ctx-item"><svg class="icon"><use href="#i-export"/></svg>整体导出</button>
      <div class="ctx-sep"></div>
      <button class="ctx-item danger" data-x="del"><svg class="icon"><use href="#i-trash"/></svg>删除项目</button>`;
    document.body.appendChild(menu);
    ctxEl = { el: menu, p };
    menu.addEventListener("click", (ev) => {
      const item = ev.target.closest(".ctx-item");
      if (!item) return;
      ev.stopPropagation();
      const act = item.dataset.x;
      menu.remove(); ctxEl = null;
      if (act === "pin") { p.pinned = !p.pinned; toast(`「${p.title}」${p.pinned ? "已置顶" : "已取消置顶"}`); render(); }
      else if (act === "arch") {
        if (p.archived) { p.archived = false; toast(`「${p.title}」已取消归档`); }
        else { p.archived = true; p.pinned = false; toast(`「${p.title}」已归档`); }
        render();
      } else if (act === "del") toast(`（mock）删除「${p.title}」→ ConfirmDialog danger 确认`);
      else toast(`（mock）编辑「${p.title}」→ 弹窗（标题 + 富文本描述 + 类型）`);
    });
  }
});

render();
</script>
