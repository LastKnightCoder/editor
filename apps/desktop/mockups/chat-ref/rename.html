<!doctype html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="utf-8" />
<title>聊天引用 · 自定义名称</title>
<link rel="stylesheet" href="../chat/shared.css?v=3" />
<link rel="stylesheet" href="chat-ref.css?v=2" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  /* 预览卡标题：可点即改，悬停才露出铅笔，平时和现在一模一样 */
  .pv-hd .t.editable { cursor: text; border-radius: 5px; padding: 1px 4px; margin: -1px -4px; display: flex; align-items: center; gap: 5px; flex: 1; }
  .pv-hd .t.editable .pen { width: 12px; height: 12px; color: var(--ink-3); opacity: 0; transition: opacity var(--fast); flex: none; }
  .pv-hd .t.editable.hover { background: var(--hover, rgba(60,40,20,.06)); }
  .pv-hd .t.editable.hover .pen { opacity: 1; }
  .pv-hd .tt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .pv-hd .orig { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .pv-hd .orig button { all: unset; cursor: pointer; color: var(--accent-text); margin-left: 6px; }
  .pv-edit { flex: 1; min-width: 0; height: 26px; margin: -3px 0; padding: 0 7px; font: inherit; font-size: 13px; font-weight: 500; color: var(--ink-1);
    background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
  .pv-hint { padding: 0 12px 8px 46px; color: var(--ink-3); font-size: 11.5px; }

  /* 正文里就地改：引用本身变成输入框，宽度跟着字走 */
  .cref-edit { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; height: 24px; vertical-align: 1px; border-radius: 6px;
    border: 1px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); color: var(--accent-text); font-size: 14px; }
  .cref-edit svg.lucide { width: 13px; height: 13px; }
  .cref-edit .val { color: var(--ink-1); }
  .cref-edit .sel { background: var(--selected); color: var(--ink-1); }
  .cref-edit .caret-here { margin-left: 0; height: 15px; vertical-align: -2px; }
  .inline-tip { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--line-1); border-radius: 6px; box-shadow: var(--shadow-float);
    padding: 4px 8px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .inline-tip b { color: var(--ink-2); font-weight: 500; }

  .cref.selected { background: var(--selected); border-radius: 4px; }
</style>
</head>
<body class="no-anno">
<div class="stage"><div class="win" id="win"></div></div>
<script type="module">
import { win, cref, TURNS, QUOTE_TEXT, SESSION, mockBar, anno } from "./data.js?v=2";

const CUSTOM = "FSRS 的难度回归";

const doc = (inline, overlay = "") => `
  <div class="paper doc" style="position:relative"><div class="doc-inner">
  <h1>间隔重复：我的理解</h1>
  <div class="dm num">11-12 · 草稿 · 学习 / 记忆</div>
  <p>以前一直以为 Anki 的卡片越复习越难，是因为自己记性不好。后来才明白是 SM-2 的易度因子只降不升，错过几次的卡就被困在低增长里。</p>
  <h2>FSRS 为什么不会陷进去</h2>
  <p>我的理解是：它把「难」和「记得多久」拆开了，难度还会自己慢慢回落，见 ${inline}。</p>
  <p>所以迁移时不用担心老卡的「坏记录」会一直拖着它，重放日志后 D 自己就会回落。</p>
  </div>${overlay}</div>`;

/* head: 预览卡头部；hint: 头部下一行提示 */
const preview = (style, { head, hint = "", body = true, footExtra = "" } = {}) => `
  <div class="pv" style="${style}">
    <div class="pv-hd"><span class="ai-avatar"><i data-lucide="message-square-quote"></i></span>${head}</div>
    ${hint ? `<div class="pv-hint">${hint}</div>` : ""}
    ${body ? `<div class="pv-bd">
      <div class="pv-ask">${TURNS[1].ask}</div>
      <div class="pv-ans">FSRS 不用单一的 EF，而是把记忆拆成两个量：<b>稳定性 S</b>：记忆能保持多久…；<b>难度 D</b>：卡片本身有多难，答错只是小幅上调，并且会向均值回归。<br/><span class="hit">${QUOTE_TEXT}</span></div>
    </div>` : ""}
    <div class="pv-ft">
      <button class="btn"><i data-lucide="panel-right-open"></i>在侧栏打开</button>
      <button class="btn"><i data-lucide="maximize-2"></i>对话页</button>
      <span class="sp"></span>
      ${footExtra}
      <button class="ib" title="复制引用链接"><i data-lucide="link-2"></i></button>
    </div>
  </div>`;

const META = `<span class="m num">第 2 / 6 轮 · 11-12</span>`;
const titleHover = `<span class="t editable hover">${SESSION.title}<i data-lucide="pencil" class="pen"></i></span>${META}`;
const titleEditing = `<input class="pv-edit" value="${SESSION.title}" />`;
const titleRenamed = `<span class="tt"><span class="t editable" style="flex:none">${CUSTOM}<i data-lucide="pencil" class="pen"></i></span>
  <span class="orig">对话：${SESSION.title}<button>恢复</button></span></span>${META}`;

const SCENES = {
  /* 方案 A：点预览卡标题就改 */
  aHover: () => win({ main: doc(cref(SESSION.title, "第 2 轮", "active"), preview("left:330px;top:350px", { head: titleHover })) })
    + anno(1, "不加按钮：鼠标移到卡片标题上才浮出淡底和铅笔，平时卡片和现在完全一样", "left:740px;top:345px")
    + anno(2, "点标题进入编辑；只读 / 协作者视角下标题不可点", "left:740px;top:410px"),

  aEdit: () => win({ main: doc(cref(SESSION.title, "第 2 轮", "active"), preview("left:330px;top:350px", { head: titleEditing, hint: "↵ 保存 · Esc 取消 · 清空恢复为对话名", body: false })) })
    + anno(1, "标题原地变成输入框，全选原名，直接打字覆盖", "left:740px;top:345px")
    + anno(2, "编辑时收起问答正文，卡片变小，避免鼠标移开就关掉；编辑中不会因移出而收起", "left:740px;top:410px"),

  /* 方案 B：正文里选中引用按回车 / 双击，就地改 */
  bSelect: () => win({ main: doc(cref(SESSION.title, "第 2 轮", "selected"),
      `<div class="inline-tip" style="left:540px;top:322px"><b>↵</b> 重命名 · <b>⌘ 点击</b> 打开</div>`) })
    + anno(1, "编辑态里光标停在引用上（方向键移过来或单击）时，旁边轻提示「↵ 重命名」", "left:740px;top:300px")
    + anno(2, "双击也直接进入编辑；单击仍只放光标，不和现在的行为冲突", "left:740px;top:365px"),

  bEdit: () => win({ main: doc(`<span class="cref-edit"><i data-lucide="message-square-quote"></i><span class="val"><span class="sel">${SESSION.title}</span></span><span class="caret-here"></span></span>`,
      `<div class="inline-tip" style="left:330px;top:322px">↵ 保存 · Esc 取消 · 清空恢复为对话名</div>`) })
    + anno(1, "引用本体变成输入框，宽度随字数伸缩，不离开正文、不弹窗", "left:740px;top:300px")
    + anno(2, "最快：写作时手不离键盘。缺点是要先知道有这个操作，所以 A 仍要保留做可见入口", "left:740px;top:365px"),

  /* 方案 C：收进「更多」菜单 */
  cMenu: () => win({ main: doc(cref(SESSION.title, "第 2 轮", "active"), preview("left:330px;top:350px", {
      head: `<span class="t">${SESSION.title}</span>${META}`,
      footExtra: `<button class="ib on" title="更多"><i data-lucide="more-horizontal"></i></button>`,
    }) + `<div class="menu" style="left:560px;top:640px;width:160px">
        <div class="mi"><i data-lucide="pencil"></i>重命名</div>
        <div class="mi"><i data-lucide="text-quote"></i>改为摘录块</div>
        <div class="msep"></div>
        <div class="mi" style="color:var(--danger)"><i data-lucide="trash-2"></i>移除引用</div>
      </div>`) })
    + anno(1, "卡片右下多一个「更多」，重命名和以后的操作都收在里面；点了之后标题同 A 一样原地变输入框", "left:740px;top:600px")
    + anno(2, "比 A 多一次点击，入口也更藏；只有以后确实要放更多操作时才值得", "left:740px;top:665px"),

  /* 改名之后 */
  renamed: () => win({ main: doc(cref(CUSTOM, "第 2 轮", "active"), preview("left:330px;top:350px", { head: titleRenamed })) })
    + anno(1, "正文显示自定义名称，轮次照常跟在后面", "left:560px;top:250px")
    + anno(2, "卡片标题显示自定义名，下面小字给出对话原名，一眼知道它指向哪段对话；「恢复」一键回到跟随对话名", "left:740px;top:345px")
    + anno(3, "不改名的引用继续跟随对话的最新标题；改过名就固定为自定义名", "left:740px;top:440px"),
};

mockBar("rename.html", [
  ["aHover", "A · 点卡片标题"], ["aEdit", "A · 编辑中"],
  ["bSelect", "B · 正文里 ↵"], ["bEdit", "B · 就地编辑"],
  ["cMenu", "C · 更多菜单"], ["renamed", "改名之后"],
], k => (document.getElementById("win").innerHTML = SCENES[k]()));
</script>
</body>
</html>
