  { kind: "chain", icon: "chain", label: "缺一环", scope: "数据库", time: "10月5日",
    title: "「事务隔离」这条线上缺了 MVCC 的可见性判断",
    desc: "从「隔离级别」直接跳到了「幻读与间隙锁」，中间解释快照为什么看得见、看不见的那一步没写。",
    chips: [["doc", "《隔离级别》"], ["doc", "《幻读与间隙锁》"]],
    ev: { type: "list", items: [
      { icon: "doc", b: "《隔离级别》", t: "RC 与 RR 的区别在于快照的创建时机……" },
      { icon: "doc", b: "《幻读与间隙锁》", t: "RR 下用 next-key lock 防止幻读……" } ] },
    acts: [["map", "在地图上看"]] },
];

let plan = "full", open = 0, showAll = false;
const gone = new Set();

const btns = (it, i, size = "") => it.acts.map(([ic, l], n) =>
  `<button class="btn ${n ? "quiet" : "soft"} ${size}">${I[ic]}${l}</button>`).join("")
  + `<button class="btn quiet ${size}" data-dismiss="${i}" title="${it.dismiss ? "" : "以后不再提这一条"}">${it.dismiss ?? "不相关"}</button>`;
const head = n => `<div class="ptitle"><span style="color:var(--accent);display:flex">${I.spark}</span>洞见<small>${n} 条新发现</small>
  <button class="pa">在地图上看全部${I.r}</button></div>`;
const evidence = it => it.ev.type === "claims"
  ? `<div class="claims">${it.ev.items.map(c => `<button class="ev"><b>${c.b}</b><span>${c.t}</span></button>`).join("")}</div>`
  : `<div class="evs">${it.ev.items.map(e => `<button class="ev">${I[e.icon]}<span class="t"><b>${e.b}</b>${e.t}</span></button>`).join("")}</div>`;
const count = () => ITEMS.length - gone.size;

function renderCur() {
  const it = ITEMS[0];
  return `<div class="cur"><div><div class="h">${I.spark}洞见<small>AI 从你的知识版图里看到的</small><span class="pg">‹ 1 / 5 ›</span></div>
    <p><span class="lb">问了没写</span>你在对话里问过 2 次<em>${it.title}</em> 笔记里还没写</p></div>
    <div style="display:flex;gap:6px"><button class="btn pbtn">${I.map}在地图上看</button><button class="btn quiet">不相关</button></div></div>`;
}
function renderL1() {
  return `<div class="panel l1">${head(count())}<div class="list">${ITEMS.map((it, i) => `
    <div class="it k-${it.kind} ${gone.has(i) ? "gone" : ""}">
      <span class="kico">${I[it.icon]}</span>
      <div style="min-width:0"><div class="tt" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.title}</div><div class="ds">${it.desc}</div></div>
      <div class="slot">
        <div class="info"><span class="klabel">${it.label}</span><span class="meta">· ${it.scope} · ${it.time}</span></div>
        ${gone.has(i) ? "" : `<div class="acts">${btns(it, i, "sm")}</div>`}
      </div>
    </div>`).join("")}</div></div>`;
}
function renderL2() {
  return `<div class="panel l2">${head(count())}<div class="list">${ITEMS.map((it, i) => {
    const ex = open === i && !gone.has(i);
    return `<div class="it k-${it.kind} ${gone.has(i) ? "gone" : ""}" aria-expanded="${ex}" data-open="${i}">
      <span class="kico">${I[it.icon]}</span>
      <div style="min-width:0">
        <div class="line1"><span class="tt">${it.title}</span><span class="klabel">${it.label}</span><span class="meta">${it.scope} · ${it.time}</span><span class="chev">${I.r}</span></div>
        <div class="ds">${it.desc}</div>
        <div class="body"><div><div class="body-in">${evidence(it)}<div class="acts-row">${btns(it, i)}</div></div></div></div>
      </div></div>`;
  }).join("")}</div></div>`;
}
function renderFull() {
  const shown = showAll ? ITEMS : ITEMS.slice(0, 3);
  return `<div class="panel l3 full">${head(count())}<div class="list">${shown.map((it, i) => `
    <div class="it k-${it.kind} ${gone.has(i) ? "gone" : ""}">
      <span class="kico">${I[it.icon]}</span>
      <div style="min-width:0">
        <div class="line1"><span class="tt" style="white-space:normal">${it.title}</span><span class="klabel">${it.label}</span><span class="meta">${it.scope} · ${it.time}</span></div>
        <div class="ds">${it.desc}</div>
        ${gone.has(i) ? "" : `<div class="ev-wrap">${evidence(it)}</div><div class="foot">${btns(it, i, "sm")}</div>`}
      </div></div>`).join("")}</div>
    ${showAll ? "" : `<button class="more" data-more>${I.down}还有 ${ITEMS.length - 3} 条</button>`}</div>`;
}
function renderL3() {
  const shown = showAll ? ITEMS : ITEMS.slice(0, 3);
  return `<div class="panel l3">${head(count())}<div class="list">${shown.map((it, i) => `
    <div class="it k-${it.kind} ${gone.has(i) ? "gone" : ""}">
      <span class="kico">${I[it.icon]}</span>
      <div style="min-width:0">
        <div class="line1"><span class="tt" style="white-space:normal">${it.title}</span><span class="klabel">${it.label}</span><span class="meta">${it.scope} · ${it.time}</span></div>
        <div class="ds">${it.desc}</div>
        <div class="chips">${it.chips.map(([ic, t]) => `<button class="chip">${I[ic]}<span>${t}</span></button>`).join("")}</div>
        ${gone.has(i) ? "" : `<div class="foot">${btns(it, i, "sm")}</div>`}
      </div></div>`).join("")}</div>
    ${showAll ? "" : `<button class="more" data-more>${I.down}还有 ${ITEMS.length - 3} 条</button>`}</div>`;
}

const NOTES = {
  cur: `<h2>现状</h2><p>一次只露一条，标题行挤，结论没有证据，宽屏中间空着一大片。</p>`,
  l1: `<h2>L1 · 紧凑列表</h2><p>一条一行：图标、标题、一行描述，行尾是类型和时间。</p>
    <h3>操作</h3><p>悬停（或键盘聚焦）时，行尾的类型和时间原位淡出，换成操作按钮。用的是固定槽位叠放，不会把行宽顶开。</p>
    <h3>取舍</h3><p>最省高度，5 条约 300px，扫起来最快。但描述只有一行，证据看不到，操作也要悬停才出现。</p>`,
  l2: `<h2>L2 · 展开列表 <span class="tag">推荐</span></h2><p>默认每条两行：标题加类型和时间、一行描述。点一下展开：描述完整显示，下面出证据（问过的原话 / 两端摘录 / 矛盾双方），再下面一排操作。</p>
    <h3>为什么推荐</h3><ul>
    <li>收起时是干净的列表，5 条全部可见。</li>
    <li>展开后有证据、有操作，都在同一列里往下排，不左右分栏。</li>
    <li>第一条默认展开，打开首页就能直接动手。</li>
    <li>处理掉的条目留在原位，划掉变淡，等下次刷新再消失，列表不跳动。</li></ul>
    <h3>细节</h3><ul><li>一次只展开一条，点别的行就切过去。</li><li>证据每条都能点：笔记直达命中位置；对话要确认 chat 页能不能接 sessionId 参数。</li></ul>`,
  full: `<h2>直接展开 · 完整证据</h2><p>每条都铺开：标题加类型和时间、完整描述、证据、常驻操作。默认露 3 条，「还有 N 条」展开其余。</p>
    <h3>证据</h3><p>每行左边一道细竖线，悬停时换成类型色。问了没写列问过的原话加日期；呼应、回顾、缺一环列笔记标题加摘录；矛盾把两边的说法并排放。每行都能点，直达对话或笔记里的命中位置。</p>
    <h3>取舍</h3><p>信息最全，不用点。代价是高度：每条约 170px，露 3 条时面板约 610px。如果嫌高，可以默认只露 2 条。</p>`,
  l3: `<h2>直接展开 · 证据 chips</h2><p>每条都完整展示：标题、完整描述、证据 chips、常驻操作。默认露 3 条，「还有 N 条」展开其余。</p>
    <h3>取舍</h3><p>不用点就能看到全部信息，操作也一直在。但每条约 130px，3 条就接近 400px，会把「最近编辑」推到首屏外。</p>`,
};

function render() {
  document.getElementById("slot").innerHTML = ({ cur: renderCur, full: renderFull, l1: renderL1, l2: renderL2, l3: renderL3 })[plan]();
  document.getElementById("notes").innerHTML = NOTES[plan];
  document.querySelectorAll("#plan button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === plan));
}
document.getElementById("plan").onclick = e => { const b = e.target.closest("button"); if (!b) return; plan = b.dataset.p; render(); };
document.getElementById("slot").onclick = e => {
  const d = e.target.closest("[data-dismiss]");
  if (d) { gone.add(+d.dataset.dismiss); const next = ITEMS.findIndex((_, j) => !gone.has(j)); if (gone.has(open)) open = next; render(); return; }
  if (e.target.closest("[data-more]")) { showAll = true; render(); return; }
  if (e.target.closest("button")) return;
  const o = e.target.closest("[data-open]");
  if (o && !gone.has(+o.dataset.open) && open !== +o.dataset.open) { open = +o.dataset.open; render(); }
};
document.getElementById("reset").onclick = () => { gone.clear(); open = 0; showAll = false; render(); };
document.getElementById("theme").onclick = e => {
  const dark = document.documentElement.dataset.theme === "cocoa";
  document.documentElement.dataset.theme = dark ? "" : "cocoa"; e.target.textContent = dark ? "深色" : "浅色";
};
document.getElementById("notesBtn").onclick = e => { document.body.classList.toggle("notes-on"); e.target.setAttribute("aria-pressed", document.body.classList.contains("notes-on")); fit(); };
function fit() {
  const w = document.getElementById("wrap"), win = document.getElementById("win");
  win.style.transform = `scale(${Math.min(w.clientWidth / 1440, w.clientHeight / 900, 1)})`;
}
addEventListener("resize", fit);
render(); fit();
</script>
</body>
</html>
