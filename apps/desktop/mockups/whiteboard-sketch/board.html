<!doctype html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白板手绘风格 · 整板演示</title>
<link rel="stylesheet" href="../whiteboards/base.css">
<link rel="stylesheet" href="sketch.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .sheet { position: relative; flex: 1; min-height: 0; margin: 12px 14px 14px; border-radius: 16px; overflow: hidden; background: var(--bg-surface); box-shadow: var(--shadow-card); }
  #canvas { position: absolute; inset: 0; overflow: auto; background-color: var(--sk-paper); background-image: radial-gradient(var(--sk-dot) 1px, transparent 1.2px); background-size: 16px 16px; }
  #world { position: relative; width: 1220px; height: 680px; margin: 52px 24px 60px; }
  .layer { position: absolute; inset: 0; overflow: visible; }
  svg.layer { pointer-events: none; }
  svg.layer .arrow .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  svg.layer .arrow.sel .hit { stroke: var(--accent-soft); }
  .layer.front { pointer-events: none; }
  .el { position: absolute; cursor: grab; user-select: none; }
  .dragging .el { cursor: grabbing; }
  .el .shape { position: absolute; inset: 0; overflow: visible; }
  .el.sel::after { content: ""; position: absolute; inset: -7px; border: 1.5px solid var(--accent); border-radius: 6px; pointer-events: none; }
  .el .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13.5px; color: var(--sk-ink); padding: 4px; }
  .el .label.hand { font-size: 17px; }
  .el .label.small { font-size: 12.5px; }
  .el .label.hand.small { font-size: 15.5px; }
  .el.text { font-size: 13.5px; line-height: 1.6; color: var(--sk-ink); white-space: pre-wrap; padding: 4px 6px; }
  .el.text.hand { font-size: 17px; line-height: 1.45; }
  .el.card { background: var(--bg-surface); border-radius: 12px; box-shadow: var(--shadow-lift); outline: 1px solid var(--line-1); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .el.card b { font-size: 14px; color: var(--ink-1); font-weight: 600; }
  .el.card p { line-height: 1.6; }
  .el.card small { margin-top: auto; color: var(--ink-3); }
  .frame-title { position: absolute; font-size: 12.5px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
  .frame-title.hand { font-size: 16px; font-weight: 400; }
  .arrow-label { position: absolute; font-size: 12px; color: var(--ink-2); background: var(--sk-paper); padding: 0 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .arrow-label.hand { font-size: 15px; }

  /* 画布 chrome（沿用 D-049：实底 surface + shadow-lift + 细描边，激活 accent-soft） */
  .chrome { position: absolute; z-index: 10; background: var(--bg-surface); box-shadow: var(--shadow-lift), 0 0 0 1px var(--line-2); border-radius: 12px; }
  .toolbar { left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; }
  .toolbar i { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); font-style: normal; font-size: 13px; }
  .toolbar i.on { background: var(--accent-soft); color: var(--accent-text); }
  .toolbar .g { width: 10px; }
  #attrbar { transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; }
  #attrbar .gap { width: 8px; }
  .cbtn { height: 30px; min-width: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); padding: 0 7px; }
  .cbtn:hover { background: var(--bg-hover); color: var(--ink-1); }
  .cbtn.on { background: var(--accent-soft); color: var(--accent-text); }
  .cbtn .tag { font-size: 12px; }
  .cbtn .sw { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .cbtn .sw.sq { border-radius: 4px; }
  #pop { width: 300px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  #pop[hidden], #attrbar[hidden], #stylemenu[hidden] { display: none; }
  .field label { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .field label em { font-style: normal; font-size: 11px; color: var(--ink-3); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .field.five .tiles { grid-template-columns: repeat(5, 1fr); }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 2px 5px; border-radius: 9px; font-size: 12px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-1); line-height: 1.25; }
  .tile:hover { background: var(--bg-hover); }
  .tile.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-text); }
  .tile svg { overflow: visible; }
  .tile small { display: block; font-size: 10.5px; color: var(--ink-3); }
  .field.five .tile svg { width: 36px; height: 24px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swb { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
  .swb i { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .swb.on { box-shadow: 0 0 0 2px var(--accent); }
  .swb.none i { background: linear-gradient(135deg, transparent 45%, var(--danger) 46%, var(--danger) 54%, transparent 55%) !important; box-shadow: inset 0 0 0 1px var(--line-1); }
  .poprow { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line-2); padding-top: 10px; }
  .btn { height: 28px; padding: 0 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-1); box-shadow: inset 0 0 0 1px var(--line-1); white-space: nowrap; }
  .btn:hover { background: var(--bg-hover); }
  .hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
  .hint.pad { padding: 2px 0; }
  #status { right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; font-size: 12.5px; }
  #status .cbtn { color: var(--ink-2); }
  #status .sep { width: 1px; height: 16px; background: var(--line-1); margin: 0 4px; }
  #stylemenu { right: 12px; bottom: 54px; width: 260px; padding: 6px; font-size: 13px; }
  .mh { font-size: 11.5px; color: var(--ink-3); padding: 6px 10px 4px; }
  .mi { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; text-align: left; }
  .mi:hover { background: var(--bg-hover); }
  .mi b { font-weight: 500; }
  .mi small { color: var(--ink-3); font-size: 11.5px; flex: 1; }
  .mi .ck { margin-left: auto; color: var(--accent-text); }
  .mi.dis { opacity: .45; cursor: default; }
  #stylemenu .sep { height: 1px; background: var(--line-2); margin: 4px 6px; }
  .foot { font-size: 11.5px; color: var(--ink-3); padding: 6px 10px 4px; }
  .tip { position: absolute; left: 14px; bottom: 14px; z-index: 5; font-size: 12px; color: var(--ink-3); background: var(--bg-surface); padding: 6px 10px; border-radius: 9px; box-shadow: var(--shadow-lift); max-width: 520px; }
</style>
</head>
<body>
<div class="demo">
  <div class="title"><a href="index.html">← 总览</a>整板演示</div>
  <div class="grp"><span>方案</span>
    <button class="chip" data-plan="current">现状</button>
    <button class="chip" data-plan="a">A · 纸笔</button>
    <button class="chip" data-plan="b">B · 墨水</button>
    <button class="chip" data-plan="c">C · 铅笔</button>
  </div>
  <div class="spacer"></div>
  <div class="grp"><button class="chip" id="theme">☾ cocoa</button></div>
</div>
<div class="sheet">
  <div id="canvas">
    <div id="world"></div>
  </div>
  <div class="chrome toolbar" aria-hidden="true">
    <i class="on">▢</i><i>↗</i><i>✎</i><i>T</i><i>⌘</i><span class="g"></span><i>▣</i><i>▶</i><i>♪</i><i>◎</i><span class="g"></span><i>❏</i><i>▦</i><span class="g"></span><i>⬚</i><i>▥</i>
  </div>
  <div class="chrome" id="attrbar" hidden></div>
  <div class="chrome" id="pop" hidden></div>
  <div class="chrome" id="status">
    <button class="cbtn" data-k="style"></button>
    <span class="sep"></span>
    <button class="cbtn">网格</button>
    <button class="cbtn">−</button><span style="padding:0 4px;color:var(--ink-2)">100%</span><button class="cbtn">＋</button>
    <button class="cbtn">全览</button>
    <button class="cbtn">演示</button>
  </div>
  <div class="chrome" id="stylemenu" hidden></div>
  <div class="tip">拖动元素看连线跟随；点选形状 / 连线 / 文本 → 浮动条「笔触」；右下「手绘」切整块白板的画风。卡片是内容元素，不参与手绘。</div>
</div>
<script src="vendor/rough.js"></script>
<script src="vendor/perfect-freehand.js"></script>
<script src="sketch.js"></script>
<script src="board.js"></script>
</body>
</html>
