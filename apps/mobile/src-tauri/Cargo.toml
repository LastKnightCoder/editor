[package]
name = "Tau"
version = "0.1.0"
description = "A Note App"
authors = ["LastKnightCoder"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
rusqlite = { version = "0.29.0", features = ["bundled", "blob", "functions"] }
sqlite-vec = "0.1.3"
jieba-rs = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
webp = "0.3"
uuid = { version = "1", features = ["v4"] }
aws-sdk-s3 = "1"
aws-smithy-http-client = { version = "1", features = ["hyper-014"] }
hyper-rustls = { version = "0.24.2", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio"] }
roxmltree = "0.20"
sha2 = "0.10"
fsrs = "6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
