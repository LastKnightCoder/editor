# 构建 macOS 随包分发的 whisper.cpp 转录程序（whisper-cli）
#
# 产物：apps/desktop/build/bin/darwin/whisper-cli（通用二进制，Metal 加速）
# 由 electron-builder 的 mac.extraResources 打进应用包，
# 运行时由 transcription.ts 的 darwin 分支解析（process.resourcesPath/bin/whisper-cli）。
#
# 触发方式：手动 dispatch（指定 whisper.cpp 版本），产物作为 artifact 上传，
# 需提交到仓库 apps/desktop/build/bin/darwin/whisper-cli 后再打 Mac 安装包。
name: build-whisper-cli-macos

on:
  workflow_dispatch:
    inputs:
      whisper_cpp_ref:
        description: "whisper.cpp 的 tag/commit（如 v1.7.6）"
        required: false
        default: "master"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper_cpp_ref }}

      - name: Build universal whisper-cli (Metal)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DWHISPER_METAL=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release --target whisper-cli -j

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp build/bin/whisper-cli staging/whisper-cli
          chmod +x staging/whisper-cli
          file build/bin/whisper-cli || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-macos-universal
          path: staging/whisper-cli
          if-no-files-found: error
